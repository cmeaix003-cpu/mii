/* ========== 自分のコンディション ========== */
function myLog(){D.me=D.me||{};D.me.log=D.me.log||[];return D.me.log}
function myToday(){return myLog().find(x=>x.d===reflectDate())||null}
function setMyCond(v,note){
  const l=myLog(), t=reflectDate();
  const ix=l.findIndex(x=>x.d===t);
  const rec={d:t,v:Number(v),note:note!==undefined?note:(ix>=0?l[ix].note:'')};
  if(ix>=0)l[ix]=rec;else l.push(rec);
  l.sort((a,b)=>a.d.localeCompare(b.d));
  store.save();render();
}
function myRecent(n){return myLog().slice(-(n||14))}
function myAvg(days){
  const from=addDays(today(),-(days||6));
  const a=myLog().filter(x=>x.d>=from);
  return a.length?a.reduce((s,x)=>s+x.v,0)/a.length:null;
}
/** 連続で働いた日数（私用だけの日と予定ゼロの日は休みとみなす） */
function workStreak(){
  let n=0;
  for(let i=0;i<60;i++){
    const d=addDays(today(),-i);
    const ev=eventsOn(d).filter(e=>e.cat!=='私用');
    const own=shiftOf(D.settings.myName||'',d);
    const worked=ev.length>0||(own!==null&&!isOff(own));
    if(i===0&&!worked)continue;      // 今日まだ何も無ければ数えない
    if(worked)n++;else break;
  }
  return n;
}
/** 私用に使えた時間（今週） */
function privateHours(ws){
  ws=ws||weekStart(today());const we=addDays(ws,6);
  return D.events.filter(e=>e.cat==='私用'&&e.date>=ws&&e.date<=we).reduce((a,e)=>a+durH(e),0);
}
/** 遅い時間・長時間の予定 */
function overWork(ws){
  ws=ws||weekStart(today());const we=addDays(ws,6);
  const ev=D.events.filter(e=>e.date>=ws&&e.date<=we&&e.cat!=='私用');
  const late=ev.filter(e=>e.end&&mins(e.end)>=20*60).length;
  const total=ev.reduce((a,e)=>a+durH(e),0);
  return {late,total};
}
function myCare(){
  const t=today(), cur=myToday();
  const streak=workStreak(), avg=myAvg(7), ph=privateHours(), ow=overWork();
  const msg=[];
  if(streak>=7)msg.push({w:6,s:streak+'日続けて働いておられます。どこかで一日、お休みを。'});
  else if(streak>=5)msg.push({w:4,s:streak+'日連続でございます。ご無理のないように。'});
  if(avg!==null&&avg>=4)msg.push({w:5,s:'この1週間、お疲れが続いておられるようです。'});
  if(ow.late>=3)msg.push({w:4,s:'今週、20時以降の予定が'+ow.late+'件。夜が長くなっております。'});
  if(ow.total>=45)msg.push({w:3,s:'今週の予定は'+ow.total.toFixed(0)+'時間。少し詰め込みすぎかもしれません。'});
  if(ph===0&&(parse(t).getDay()>=4||parse(t).getDay()===0))msg.push({w:2,s:'今週はご自分の時間が入っておりません。'});
  try{
    const rs=rsStats(13);
    if(rs.minus>=4)msg.push({w:5,s:'この2週間で'+rs.minus+'件、やむを得ず予定を動かしております。詰め込みすぎかもしれません。'});
    else if(rs.minus>=2&&rs.plus===0)msg.push({w:3,s:'予定を動かすことが続いております。'});
    const cx=cancelStats(13);
    if(cx.self>=3)msg.push({w:5,s:'この2週間で'+cx.self+'件、ご自身の理由で予定を取りやめております。少しお疲れかもしれません。'});
    if(cx.people>=2)msg.push({w:4,s:'人の枠を'+cx.people+'件、取りやめております。次は守れる日に入れましょう。'});
  }catch(e){}
  msg.sort((a,b)=>b.w-a.w);
  return {cur,streak,avg,ph,ow,say:msg.length?msg[0].s:''};
}

/* ========== この1週間のふりかえり（傾向の分析） ========== */
function weekStats(ws){
  const we=addDays(ws,6);
  const inR=d=>d>=ws&&d<=we;
  const pe=D.events.filter(e=>e.cat==='人'&&inR(e.date));
  const mt=pe.filter(e=>e.type==='面談');
  const meet=D.events.filter(e=>(e.cat==='会議'||e.cat==='打合せ')&&inR(e.date));
  const doneT=D.tasks.filter(t=>t.status==='done'&&t.doneAt&&inR(t.doneAt));
  const madeT=D.tasks.filter(t=>t.createdAt&&inR(t.createdAt.slice(0,10)));
  const deleg=D.tasks.filter(t=>t.status==='delegated'&&t.createdAt&&inR(t.createdAt.slice(0,10)));
  const doneE=D.events.filter(e=>e.done&&inR(e.date));
  const allE=D.events.filter(e=>inR(e.date)&&e.date<=today());
  return {
    ws,we,
    peopleH:pe.reduce((a,e)=>a+durH(e),0),
    met:new Set(pe.map(e=>e.staffName).filter(Boolean)).size,
    mt:mt.length, reported:mt.filter(e=>e.report).length,
    meetH:meet.reduce((a,e)=>a+durH(e),0), meetN:meet.length,
    done:doneT.length, made:madeT.length, deleg:deleg.length,
    doneRate:allE.length?Math.round(doneE.length/allE.length*100):null
  };
}
/** 先週と今週を比べて、みーが気づいたことを述べる */
function trendComment(){
  const thisW=weekStart(today()), lastW=addDays(thisW,-7);
  const a=weekStats(lastW), b=weekStats(thisW);
  const dow=(parse(today()).getDay()+6)%7;         // 月=0
  const prog=(dow+1)/7;                            // 今週の進み具合
  const out=[];
  // ① 人に使えた時間
  const paceH=b.peopleH-a.peopleH*prog;
  if(a.peopleH>0||b.peopleH>0){
    if(paceH>=0.5)out.push({w:3,s:'先週より人に時間を使えております。よい流れでございます。'});
    else if(paceH<=-1)out.push({w:5,s:'先週に比べ、人に使う時間が減っております。'});
  }
  // ② 話せた人数
  if(a.met||b.met){
    if(b.met> a.met*prog+0.5)out.push({w:2,s:'お話しできた方が増えております。'});
    else if(a.met>=3&&b.met<=a.met*prog-1)out.push({w:4,s:'今週はまだ'+b.met+'名。先週は'+a.met+'名でした。'});
  }
  // ③ 案件の増減（入ってくる量と片付ける量）
  if(b.made||b.done){
    if(b.made-b.done>=4)out.push({w:5,s:'今週は入ってくる案件が'+b.made+'件、片付いたのが'+b.done+'件。溜まりつつあります。'});
    else if(b.done>=b.made&&b.done>=3)out.push({w:2,s:'入ってくる分をきちんと捌けております。'});
  }
  // ④ 予定の消化率
  if(b.doneRate!==null&&b.doneRate<50&&(parse(today()).getDay()>=4||dow>=3))
    out.push({w:3,s:'今週のご予定の消化は'+b.doneRate+'％。残りに無理がないか、ご確認を。'});
  // ⑤ 会議の量
  if(a.meetH>=1&&b.meetH>a.meetH*prog+1.5)out.push({w:4,s:'会議が先週より増えております（今週'+b.meetH.toFixed(1)+'時間）。'});
  // ⑥ 面談の記録
  if(a.mt&&a.reported<a.mt)out.push({w:4,s:'先週の面談'+a.mt+'件のうち'+(a.mt-a.reported)+'件が未記録でございます。'});
  // ⑦ 人に振れているか
  if(b.deleg===0&&b.made>=5)out.push({w:2,s:'今週はまだどなたにもお任せしておりません。'});
  try{
    const ds=delegStats(89);const nm=Object.keys(ds.by).filter(k=>!ds.by[k].outside);
    if(nm.length&&ds.list.length>=5){
      const top=nm.sort((x,y)=>ds.by[y].n-ds.by[x].n)[0];
      const sh=Math.round(ds.by[top].n/ds.list.length*100);
      if(sh>=45)out.push({w:4,s:'お任せする相手が'+esc(top)+'さんに偏っております（'+sh+'％）。'});
    }
  }catch(e){}
  if(!out.length)return '';
  out.sort((x,y)=>y.w-x.w);
  return out[0].s;
}
function vTrend(){
  const thisW=weekStart(today()), lastW=addDays(thisW,-7);
  const a=weekStats(lastW), b=weekStats(thisW);
  const ar=(x,y)=>x>y?'<i class="up">▲</i>':x<y?'<i class="down">▼</i>':'<i>―</i>';
  const c=trendComment();
  let h='';
  if(c)h+=`<div class="bubble">${miiTag()}<p>${esc(c)}</p></div>`;
  h+=`<h2>先週と今週</h2><div class="condbox">
    <div class="trow"><span class="tl">人に使えた時間</span><span class="tv">${a.peopleH.toFixed(1)}h → <b>${b.peopleH.toFixed(1)}h</b> ${ar(b.peopleH,a.peopleH)}</span></div>
    <div class="trow"><span class="tl">お話しできた方</span><span class="tv">${a.met}名 → <b>${b.met}名</b> ${ar(b.met,a.met)}</span></div>
    <div class="trow"><span class="tl">面談</span><span class="tv">${a.mt}件 → <b>${b.mt}件</b> ${ar(b.mt,a.mt)}</span></div>
    <div class="trow"><span class="tl">会議の時間</span><span class="tv">${a.meetH.toFixed(1)}h → <b>${b.meetH.toFixed(1)}h</b> ${ar(a.meetH,b.meetH)}</span></div>
    <div class="trow"><span class="tl">片付けた案件</span><span class="tv">${a.done}件 → <b>${b.done}件</b> ${ar(b.done,a.done)}</span></div>
    <div class="trow"><span class="tl">入ってきた案件</span><span class="tv">${a.made}件 → <b>${b.made}件</b> ${ar(a.made,b.made)}</span></div>
    <div class="trow"><span class="tl">人にお任せした数</span><span class="tv">${a.deleg}件 → <b>${b.deleg}件</b> ${ar(b.deleg,a.deleg)}</span></div>
    ${b.doneRate!==null?`<div class="trow"><span class="tl">ご予定の消化</span><span class="tv"><b>${b.doneRate}％</b></span></div>`:''}
  </div>
  <p class="small muted" style="margin-top:10px">▲は増、▼は減。会議と案件の増加は▼が望ましい向きです。</p>`;
  return h;
}

/* ========== 今の状態（4つのパラメータ） ========== */
function statusParams(){
  const t=today(), ws=weekStart(t);
  const n=Math.max(1,targetStaff().length);
  // ① 人：30日で話せた割合＋長期沈黙の重み
  const from30=addDays(t,-29);
  const met=new Set(D.events.filter(e=>e.cat==='人'&&e.date>=from30&&e.date<=t&&e.staffName).map(e=>e.staffName)).size;
  const long=targetStaff().filter(p=>!p.lastContact||diffDays(p.lastContact,t)>=90).length;
  const goal=weekGoal(t), hrs=weekPeopleHours(t);
  let people=D.staff.length? Math.round( (met/n)*60 + (1-Math.min(1,long/n))*25 + Math.min(1,goal?hrs/goal:0)*15 ) : 50;
  // ② 捌き：未処理と停滞
  const open=openTasks(), stale=open.filter(x=>staleDays(x)>=3), old=open.filter(x=>staleDays(x)>=14);
  let desk=100 - Math.min(40,open.length*3) - Math.min(35,stale.length*7) - Math.min(25,old.length*10);
  // ③ 返信：要返信と放置日数
  const rep=D.mails.filter(m=>m.status==='open'&&mailBucket(m)==='reply');
  const repOld=rep.filter(m=>mailStaleDays(m)>=3), rep7=rep.filter(m=>mailStaleDays(m)>=7);
  let mail=100 - Math.min(35,rep.length*6) - Math.min(35,repOld.length*10) - Math.min(30,rep7.length*15);
  // ④ 余裕：今週の会議・作業の重さ
  const we=addDays(ws,6);
  const mh=D.events.filter(e=>(e.cat==='会議'||e.cat==='打合せ')&&e.date>=ws&&e.date<=we).reduce((a,e)=>a+durH(e),0);
  const all=D.events.filter(e=>e.date>=ws&&e.date<=we&&e.cat!=='私用').reduce((a,e)=>a+durH(e),0);
  let room=100 - Math.min(50,Math.round(mh*4)) - Math.min(30,Math.max(0,Math.round((all-30)*2)));
  const cl=v=>Math.max(0,Math.min(100,Math.round(v)));
  return {
    people:cl(people), desk:cl(desk), mail:cl(mail), room:cl(room),
    raw:{met,n,long,hrs,goal,open:open.length,stale:stale.length,rep:rep.length,repOld:repOld.length,mh:Math.round(mh*10)/10}
  };
}
function statusTotal(s){return Math.round((s.people*2+s.desk+s.mail+s.room)/5)}
/** みーの所見（低い順に1つだけ、具体的な次の一手つき） */
function statusVoice(s){
  const r=s.raw;
  const items=[
    {k:'people',v:s.people,say:()=>{
      if(r.n<=1)return '名簿を入れていただければ、人の状況も見てまいります。';
      if(s.people>=75)return 'よく回っております。この調子でまいりましょう。';
      if(r.long>0)return r.long+'名と3か月以上お話しできておりません。今週おひとりだけでも、いかがでしょう。';
      return 'この30日でお話しできたのは'+r.met+'／'+r.n+'名。少し偏りが出てまいりました。';
    }},
    {k:'desk',v:s.desk,say:()=>{
      if(s.desk>=75)return '机の上は片付いております。';
      if(r.stale)return '机に'+r.stale+'件、3日以上止まっております。出口を決めてしまいましょう。';
      return '未処理が'+r.open+'件。溜める前に、ひとつずつ。';
    }},
    {k:'mail',v:s.mail,say:()=>{
      if(s.mail>=75)return '返信の滞りはございません。';
      if(r.repOld)return '要返信のうち'+r.repOld+'件が3日以上動いておりません。';
      return '要返信が'+r.rep+'件ございます。';
    }},
    {k:'room',v:s.room,say:()=>{
      if(s.room>=75)return '今週は動ける余白がございます。人に使われてはいかがでしょう。';
      return '今週の会議は'+r.mh+'時間。ひとつ削れるものはございませんか。';
    }}
  ];
  const worst=items.slice().sort((a,b)=>a.v-b.v)[0];
  const tot=statusTotal(s);
  const head=tot>=80?'順調でございます。':tot>=60?'おおむね整っております。':tot>=40?'少し立て込んでまいりました。':'だいぶ詰まっております。まずはひとつずつ。';
  return head+' '+worst.say();
}
/** 忙しさの度合い（詳しい内訳はREVIEWで） */
function busyLevel(){
  const s=statusParams();
  const tot=statusTotal(s);
  if(tot>=78)return {k:'calm', t:'ゆとりがあります', s:'いまのうちに、人に時間を',  v:tot,p:s};
  if(tot>=58)return {k:'ok',   t:'落ち着いています', s:'この調子でまいりましょう',  v:tot,p:s};
  if(tot>=38)return {k:'busy', t:'立て込んでいます', s:'ひとつずつ片付けてまいりましょう',v:tot,p:s};
  return         {k:'hard', t:'だいぶお忙しいご様子', s:'まずは今日の一件だけ、と考えて',v:tot,p:s};
}

/* ========== みーの言葉 ========== */
function voice(){
  const h=new Date().getHours();const t=today();
  const ev=eventsOn(t).filter(e=>!e.done&&!e.cancelled);const people=ev.filter(e=>e.cat==='人');
  const reply=D.mails.filter(m=>m.status==='open'&&mailBucket(m)==='reply');
  const staleMail=reply.filter(m=>mailStaleDays(m)>=3);
  const due=openTasks().filter(x=>x.due&&x.due<=t);
  const stale=openTasks().filter(x=>staleDays(x)>=3);
  const L=[];
  // ① 挨拶（記念日があればそれを添える）
  const greet=h<11?'おはようございます。':h<17?'こんにちは。':'お疲れ様でございました。';
  const md=t.slice(5);
  const bd=D.staff.filter(p=>p.birthday&&p.birthday.slice(5)===md);
  L.push(bd.length?greet+'本日は'+bd.map(p=>p.name).join('さん、')+'さんのお誕生日です。':greet);
  // ② 今日のこと（予定＋急ぎを1行に）
  // 大事な順に並べ、多くても3つまで
  const a=[];
  if(due.length)a.push('本日中'+due.length+'件');
  if(staleMail.length)a.push('返信待ち'+staleMail.length+'件');
  if(people.length)a.push('人の枠'+people.length+'件');
  if(!due.length&&!staleMail.length&&reply.length)a.push('要返信'+reply.length+'件');
  if(ev.length)a.push('ご予定'+ev.length+'件');
  if(a.length<3&&stale.length)a.push('机に停滞'+stale.length+'件');
  L.push(a.length?a.slice(0,3).join('　'):'急ぎのものはございません。');
  // ③ 最も伝えたいこと（1つだけ）
  let last='';
  try{
    const mc=myCare();
    if(mc.say&&(mc.streak>=5||(mc.avg!==null&&mc.avg>=4)))last=mc.say;
  }catch(e){}
  try{
    if(last)throw 0;
    const tc=trendComment();
    const b=busyLevel();
    if(tc&&(new Date().getDay()===1||b.k==='busy'||b.k==='hard'))last=tc;
    else if(b.k==='hard'||b.k==='busy')last=b.s+'。';
    else{
      const cand=targetStaff().map(p=>({p,sc:staffScore(p)})).filter(x=>x.sc>=40).sort((x,y)=>y.sc-x.sc)[0];
      if(cand)last='今週は'+cand.p.name.split(' ')[0]+'さんにお声がけを。';
      else if(b.k==='calm')last='ゆとりがございます。人に時間を。';
    }
  }catch(e){}
  if(!last)last=dailyLine(t).split(' ').pop();
  L.push(last);
  return L.slice(0,3).join('\n');
}

  const badge=est.n?`<span class="stepbadge ${est.done===est.n?'all':''}">${show?'−':'＋'} ${est.done}/${est.n}</span>`:'';
  const tap=est.n&&(opt&&opt.check)
    ? ` onclick="toggleFold('s-${e.id}',false)" style="cursor:pointer"`
    : ` onclick="openEventModal(${JSON.stringify(e).replace(/"/g,'&quot;')})" style="cursor:pointer"`;
  return `<div class="row ${p?'person':''} ${eventDone(e)?'evfin':''} ${eventCancelled(e)?'evcancel':''}"><div class="time">${e.start||'終日'}${e.end?'<br>'+e.end:''}</div><div class="t"${tap}><div class="ttl">${eventCancelled(e)?`<span class="warnpill">${e.cancelBy==='self'?'キャンセル':'取り消し'}</span>`:''}${esc(e.title)}${badge}</div><div class="sub">${esc(e.type)}${e.place?'　'+esc(e.place):''}${e.party?'　'+esc(e.party):''}</div>${show?`<div onclick="event.stopPropagation()">${evStepsHtml(e)}</div>`:''}</div>${chk}</div>`;
}

/* --- DESK --- */
function vInbox(){
  const hasOrder=openTasks().some(t=>typeof t.order==='number');
  const open=hasOrder
    ? openTasks().sort((a,b)=>taskOrder(a)-taskOrder(b)||(a.createdAt||'').localeCompare(b.createdAt||''))
    : openTasks().sort((a,b)=>staleDays(b)-staleDays(a)||(a.due||'9').localeCompare(b.due||'9'));
  const deleg=D.tasks.filter(t=>t.status==='delegated');
  let h=`<h1>DESK</h1><p class="muted small">みーの机。出口は3つだけで、「後で」はありません。</p>`;
  h+=`<div class="tabs"><button class="${inboxTab==='open'?'on':''}" onclick="inboxTab='open';render()">未処理<span class="n">${open.length}</span></button><button class="${inboxTab==='deleg'?'on':''}" onclick="inboxTab='deleg';render()">依頼中<span class="n">${deleg.length}</span></button></div>`;
  if(inboxTab==='open'){
    if(open.length)h+=`<div class="toolbar"><span class="small muted">${hasOrder?'自分で決めた順':'止まっている順・期限順'}</span><span class="sp"></span>${hasOrder?`<button class="btn ghost small" onclick="resetTaskOrder()">自動の順に戻す</button>`:''}<button class="btn ${sortMode?'':'ghost'} small" onclick="sortMode=!sortMode;render()">${sortMode?'並べ替え終了':'並べ替え'}</button></div>`;
    h+=open.length?`<div class="draglist">${open.map(t=>rowTask(t)).join('')}</div>`:`<div class="empty"><b>机の上は空っぽです。</b><br>届いたものは右下の＋からどうぞ。</div>`;
  }else{
    h+=deleg.length?deleg.map(t=>rowDelegated(t)).join(''):`<div class="empty">人に振っている案件はありません。</div>`;
  }
  return h;
}
function rowTask(t,compact){
  const sd=staleDays(t);const due=t.due&&t.due<=today();
  const src={mail:'メール',meeting:'会議',shortcut:'ショートカット',manual:''}[t.source]||'';
  const st=stepStat(t);
  const show=st.n&&isOpen('s-'+t.id,false);
  const badge=(st.n?`<span class="stepbadge ${st.done===st.n?'all':''}">${show?'−':'＋'} ${st.done}/${st.n}</span>`:'')+((t.bundleNoteIds&&t.bundleNoteIds.length)?`<span class="pill" style="margin-left:5px">声 ${t.bundleNoteIds.length}件</span>`:'');
  // 手順があれば、行のどこを押しても開閉する
  const tap=st.n?` onclick="toggleFold('s-${t.id}',false)" style="cursor:pointer"`:'';
  const sortOn=sortMode&&!compact&&t.status==='open';
  const mv=sortOn?`<div class="mvbtns"><span class="grip big">≡</span></div>`:'';
  const dragAttr=sortOn?` data-drag="${t.id}" onmousedown="dragStart(event,'task','','${t.id}')" ontouchstart="dragStart(event,'task','','${t.id}')"`:'';
  return `<div class="row ${sd>=3?'stale':''} ${due?'due':''} ${sortMode?'sorting':''}"${dragAttr}>${mv}<div class="t"${tap}><div class="ttl">${esc(t.title)}${badge}</div><div class="sub">${src?src+'から　':''}${t.due?'期限 <span class="'+(due?'due-today':'')+'">'+fmtMD(t.due)+'</span>':'期限なし'}　${sd?sd+'日経過':'今日'}</div>
  ${show?`<div onclick="event.stopPropagation()">${stepsHtml(t)}</div>`:''}
  ${compact?'':bundledNotesHtml(t)}
  ${compact?'':`<div class="exits" onclick="event.stopPropagation()"><button class="btn small" onclick="taskDone('${t.id}')">${st.n?'まとめて完了':'今すぐ・完了'}</button><button class="btn small" onclick="taskToEvent('${t.id}')">予定にする</button><button class="btn small person" onclick="taskDelegate('${t.id}')">人に振る</button><button class="btn ghost small" onclick="openStepAdd('${t.id}')">手順を足す</button>${t.bundleTag?`<button class="btn ghost small person" onclick="openDraft('${t.id}')">返し文</button>`:''}<button class="btn ghost small" onclick="openTaskModal('${t.id}')">編集</button></div>`}
  </div>${compact?`<div class="acts mini" onclick="event.stopPropagation()"><button class="btn ghost xs" onclick="openStepAdd('${t.id}')" title="手順を足す">＋</button><button class="btn ghost xs" onclick="openTaskModal('${t.id}')" title="編集">✎</button><button class="btn small" onclick="taskDone('${t.id}')">${st.n?'まとめて':'完了'}</button></div>`:''}</div>`;
}
function taskDone(id){const t=D.tasks.find(x=>x.id===id);
  if(t.status==='delegated'&&t.delegId){const g=delegLog().find(x=>x.id===t.delegId);if(g&&!g.doneAt)g.doneAt=today()}
  closeBundle(t);
  t.status='done';t.doneAt=today();if(t.mailId){const m=D.mails.find(x=>x.id===t.mailId);if(m&&m.status==='tasked')m.status='replied'}store.save();render();toast('お見事です、完了しました')}
function taskReopen(id){const t=D.tasks.find(x=>x.id===id);t.status='open';t.assignee='';store.save();render()}
function taskToEvent(id){const t=D.tasks.find(x=>x.id===id);openEventModal({date:t.due||today(),title:t.title,type:'作業',taskId:id})}
function taskDelegate(id){
  const t=D.tasks.find(x=>x.id===id);
  // 直近の勤務表にいる人を先に、その他の在籍者を後に
  const act=targetStaff();

  const opt=p=>`<option value="${esc(p.name)}">${esc(p.name)}（${esc(p.kind)}）</option>`;
  openModal(`<h3>人にお任せする</h3><div class="hint">${esc(t.title)}</div>
  <div class="f"><label>誰に</label>
    <select id="dg-sel" onchange="dgPick(this.value)">
      <option value="">選んでください</option>

      ${rest.length?`<optgroup label="その他の在籍者">${rest.map(opt).join('')}</optgroup>`:''}
      ${past.length?`<optgroup label="他部署・社外（これまでの依頼先）">${past.map(n=>`<option value="${esc(n)}">${esc(n)}</option>`).join('')}</optgroup>`:''}
      <option value="__other">他部署・社外の方（新しく入力）</option>
    </select>
  </div>
  <div class="f" id="dg-otherbox" style="display:none"><label>お名前・部署</label><input id="dg-other" placeholder="例：技術部 鈴木"></div>
  <div id="dg-info"></div>
  <div class="f"><label>いつまでに</label><input id="dg-due" type="date" value="${t.due||addDays(today(),7)}"></div>
  <div class="foot"><button class="btn ghost" onclick="closeModal()">やめる</button><button class="btn solid" onclick="doDelegate('${id}')">お任せする</button></div>`);
}
function dgPick(v){
  const box=document.getElementById('dg-otherbox');
  const info=document.getElementById('dg-info');
  box.style.display=(v==='__other')?'':'none';
  if(v==='__other'){info.innerHTML='';setTimeout(()=>{const e=document.getElementById('dg-other');if(e)e.focus()},50);return}
  if(!v){info.innerHTML='';return}
  const p=resolveStaff(v);
  const o=delegStats(89).by[v];
  const bits=[];
  if(p){
    const c=(p.conditions||[]);
    if(c.length&&c[c.length-1].v>=4)bits.push('最近のコンディションが下がっています');
    if(!inRecentShift(p.name))bits.push('直近の勤務表に名前がありません');
  }
  if(o)bits.push(`これまで${o.n}件をお任せ（完了${o.done}${o.onTime!==null?'・期限内'+o.onTime+'％':''}）`);
  info.innerHTML=bits.length?`<div class="warn">${bits.map(esc).join('<br>')}</div>`:'';
}
function doDelegate(id){
  const sel=document.getElementById('dg-sel').value;
  const who=(sel==='__other')?document.getElementById('dg-other').value.trim():sel;
  if(!who){toast('お任せする方を選んでください');return}
  const t=D.tasks.find(x=>x.id===id);
  t.status='delegated';t.assignee=who;t.due=document.getElementById('dg-due').value;
  const p=resolveStaff(who);
  t.handoffs=t.handoffs||[];t.handoffs.push({from:'自分',to:(p?p.name:who),at:new Date().toISOString()});
  t.delegId=uid();
  delegLog().push({id:t.delegId,taskId:id,at:new Date().toISOString(),to:p?p.name:who,staffId:p?p.id:'',title:t.title,due:t.due,doneAt:''});
  closeModal();store.save();render();toast((p?p.name:who)+'さんにお任せしました');
}

function saveTask(id){
  const title=document.getElementById('tk-title').value.trim();if(!title){toast('内容を入れてください');return}
  const due=document.getElementById('tk-due').value,memo=document.getElementById('tk-memo').value;
  const lines=(document.getElementById('tk-steps')?.value||'').split(/\r?\n/).map(s=>s.trim()).filter(Boolean);
  if(id){
    const t0=D.tasks.find(x=>x.id===id);
    const prev=stepsOf(t0);
    // 同じ文言の手順は済みの印を引き継ぐ
    t0.steps=lines.map(s=>{const o=prev.find(p=>p.t===s);return o?o:{id:uid(),t:s,done:false}});
    Object.assign(t0,{title,due,memo});
  }
  else D.tasks.push({id:uid(),title,due,memo,steps:lines.map(s=>({id:uid(),t:s,done:false})),source:'manual',status:'open',createdAt:new Date().toISOString()});
  closeModal();store.save();render();toast(id?'承知しました':'お預かりしました');
}
function delTask(id){if(!confirm('削除しますか？'))return;D.tasks=D.tasks.filter(x=>x.id!==id);closeModal();store.save();render()}

/* --- 予定 --- */
function vCal(){
  let h=`<div class="cal-head"><h1>${calTitle()}</h1><div class="seg">${['day','week','month','shift'].map(m=>`<button class="${calMode===m?'on':''}" onclick="calMode='${m}';render()">${{day:'日',week:'週',month:'月',shift:'勤務'}[m]}</button>`).join('')}</div></div>`;
  h+=`<div class="toolbar"><button class="btn ghost small" onclick="calMove(-1)">‹ 前</button><button class="btn ghost small" onclick="calAnchor=today();render()">今日</button><button class="btn ghost small" onclick="calMove(1)">次 ›</button><span class="sp"></span><button class="btn ghost small" onclick="openQuickModal('morning')">まとめて</button><button class="btn ghost small" onclick="store.fetchEvents()">取り込む</button></div>`;
  if(calMode==='shift'){
    h+=`<div class="toolbar"><button class="btn ghost small" onclick="openShiftModal()">勤務表</button><button class="btn ghost small" onclick="openDutyModal()">当番表</button><span class="sp"></span><span class="small muted">タップで面談・長押しで話したいこと</span></div>`;
    h+=dutyChips(calAnchor);
    h+=`<h2>${fmtMD(calAnchor)} の出勤</h2>`+vShiftDay(calAnchor);
    const ms=shiftMonths();
    if(ms.length)h+=`<p class="small muted" style="margin-top:14px">取り込み済み：${ms.join('／')}</p>`;
    return h;
  }
  if(calMode==='day'){
    const ev=eventsOn(calAnchor);
    h+=dutyChips(calAnchor);
    // 予定
    h+=foldHead('d-ev','予定',ev.length);
    if(isOpen('d-ev'))h+=ev.length?ev.map(e=>rowEvent(e,{check:true})).join(''):`<div class="empty">予定はありません。<div style="margin-top:10px"><button class="btn small" onclick="openEventModal({date:'${calAnchor}'})">登録する</button></div></div>`;
    // その日が期限の案件
    const dayTasks=D.tasks.filter(t=>t.status==='open'&&t.due===calAnchor).sort((a,b)=>staleDays(b)-staleDays(a));
    const late=(calAnchor===today())?D.tasks.filter(t=>t.status==='open'&&t.due&&t.due<calAnchor):[];
    const dlg=D.tasks.filter(t=>t.status==='delegated'&&t.due===calAnchor);
    if(dayTasks.length||late.length){
      h+=foldHead('d-task','この日の案件',dayTasks.length+late.length);
      if(isOpen('d-task')){
        h+=dayTasks.map(t=>rowTask(t)).join('');
        if(late.length)h+=`<details><summary>期限が過ぎている案件 ${late.length}件</summary>${late.map(t=>rowTask(t)).join('')}</details>`;
      }
    }
    if(dlg.length){
      h+=foldHead('d-dlg','依頼中',dlg.length);
      if(isOpen('d-dlg'))h+=dlg.map(t=>`<div class="row person"><div class="t"><div class="ttl">${esc(t.title)}</div><div class="sub">${esc(t.assignee||'')}さんへ</div></div><div class="acts"><button class="btn small" onclick="taskDone('${t.id}')">完了</button></div></div>`).join('');
    }
    h+=`<div class="toolbar" style="margin-top:10px"><span class="sp"></span><button class="btn ghost small" onclick="openEventModal({date:'${calAnchor}'})">予定を足す</button><button class="btn ghost small" onclick="openTaskModal(null,{due:'${calAnchor}'})">案件を足す</button></div>`;
    const w=workingOn(calAnchor);
    if(w&&w.length){
      h+=foldHead('d-shift','この日の出勤',w.length,false);
      if(isOpen('d-shift',false))h+=vShiftDay(calAnchor);
    }
  }
  else if(calMode==='week'){
    const ws=weekStart(calAnchor);
    h+=`<div class="wk">`+[0,1,2,3,4,5,6].map(i=>{const dd=addDays(ws,i);const ev=eventsOn(dd);const isT=dd===today();
      const people=ev.filter(e=>e.cat==='人').length;
      return `<div class="wkday ${isT?'today':''} ${ev.length?'':'bare'}">
        <div class="wkhd"><span class="dn">${parse(dd).getDate()}</span><span class="dw">${dow(dd)}</span>${people?`<span class="pmark">人${people}</span>`:''}${ev.length?'':'<span class="wnone">予定なし</span>'}<span class="sp"></span><button class="btn ghost small" onclick="openEventModal({date:'${dd}'})">＋</button></div>
        ${ev.length?`<div class="wkev">${ev.map(e=>`<div class="wrow cat-${e.cat} ${eventDone(e)?'evfin':''}" onclick="openEventModal(${JSON.stringify(e).replace(/"/g,'&quot;')})"><span class="wt">${e.start||'終日'}</span><span class="wn">${esc(e.title)}</span><span class="wc">${esc(e.type)}</span></div>`).join('')}</div>`:''}
      </div>`}).join('')+`</div>`;
  }else{
    const first=addMonths(calAnchor,0);const fd=parse(first);const lead=(fd.getDay()+6)%7;const start=addDays(first,-lead);
    h+=`<div class="month">`+'月火水木金土日'.split('').map(d=>`<div class="dow">${d}</div>`).join('');
    for(let i=0;i<42;i++){
      const d=addDays(start,i);
      const other=d.slice(0,7)!==first.slice(0,7);
      const ev=eventsOn(d);
      const tasks=D.tasks.filter(x=>x.status==='open'&&x.due===d);
      const wk=workingOn(d);
      const wd=parse(d).getDay();
      const people=ev.filter(e=>e.cat==='人').length;
      const meet=ev.filter(e=>e.cat==='会議'||e.cat==='打合せ').length;
      const work=ev.length-people-meet;
      h+=`<div class="cell ${d===calAnchor?'sel':''} ${d===today()?'today':''} ${other?'other':''} ${wd===0?'sun':''} ${wd===6?'sat':''}" onclick="calAnchor='${d}';render()">
        <div class="d">${parse(d).getDate()}</div>
        <div class="dots2">
          ${people?`<i class="dp" title="人">${people>1?people:''}</i>`:''}
          ${meet?`<i class="dm">${meet>1?meet:''}</i>`:''}
          ${work?`<i class="dw2">${work>1?work:''}</i>`:''}
          ${tasks.length?`<i class="dt">${tasks.length>1?tasks.length:''}</i>`:''}
        </div>
        ${wk&&wk.length?`<div class="wn2">${wk.length}</div>`:''}
      </div>`;
    }
    h+=`</div>`;
    // 選んだ日の中身を下に出す
    const sd2=calAnchor;
    const sev=eventsOn(sd2), stk=D.tasks.filter(x=>x.status==='open'&&x.due===sd2), sdt=dutyOn(sd2), swk=workingOn(sd2);
    h+=`<div class="mpick"><div class="mpickhd"><b>${fmtMD(sd2)}</b>${swk&&swk.length?`<span class="pill">出勤 ${swk.length}名</span>`:''}<span class="sp"></span><button class="btn small" onclick="calMode='day';render()">この日を開く</button></div>`;
    if(sdt.length)h+=dutyChips(sd2);
    if(sev.length)h+=sev.map(e=>rowEvent(e,{check:true})).join('');
    if(stk.length)h+=stk.map(t=>rowTask(t,true)).join('');
    if(!sev.length&&!stk.length)h+=`<div class="empty">予定も案件もありません。<div style="margin-top:10px"><button class="btn small" onclick="openEventModal({date:'${sd2}'})">予定を足す</button> <button class="btn ghost small" onclick="openTaskModal(null,{due:'${sd2}'})">案件を足す</button></div></div>`;
    h+=`</div>`;
  }
  return h;
}
function calTitle(){const d=parse(calAnchor);if(calMode==='shift')return fmtMD(calAnchor)+' の勤務';if(calMode==='month')return d.getFullYear()+'年'+(d.getMonth()+1)+'月';if(calMode==='week'){const ws=weekStart(calAnchor);return fmtMD(ws)+' 〜 '+fmtMD(addDays(ws,6))}return fmtMD(calAnchor)}

function evCheck(){

function saveEvent(id,taskId){
  const g=i=>document.getElementById(i)?.value?.trim()||'';
  const type=g('ev-type');const title=g('ev-title')||type;const date=g('ev-date');if(!date){toast('日付を入れてください');return}
  const ev={id:id||uid(),type,cat:typeCat(type),title,date,start:g('ev-start'),end:g('ev-end'),memo:g('ev-memo'),series:g('ev-series'),agenda:g('ev-agenda'),party:g('ev-party'),place:g('ev-place'),staffName:g('ev-staff'),attendees:Number(g('ev-att'))||''};
  if(id){
    const i=D.events.findIndex(x=>x.id===id);
    const el=document.getElementById('ev-steps');
    if(el){
      const lines=el.value.split(/\r?\n/).map(s=>s.trim()).filter(Boolean);
      const prev=evSteps(D.events[i]);
      ev.steps=lines.map(s=>{const o=prev.find(p=>p.t===s);return o?o:{id:uid(),t:s,done:false}});
    }
    D.events[i]={...D.events[i],...ev};
  }else{
    const el0=document.getElementById('ev-steps');
    if(el0){
      const lines=el0.value.split(/\r?\n/).map(s=>s.trim()).filter(Boolean);
      if(lines.length)ev.steps=lines.map(s=>({id:uid(),t:s,done:false}));
    }
    D.events.push(ev);
  }
  if(taskId){const t=D.tasks.find(x=>x.id===taskId);if(t){t.status='scheduled';t.eventId=ev.id}}
  closeModal();store.save();render();toast(id?'保存しました':'登録しました');
}
function delEvent(id){
  if(!confirm('この予定を削除しますか？'))return;
  const e=D.events.find(x=>x.id===id);
  if(e&&e.gcalId){D.eventDeleted=D.eventDeleted||[];if(!D.eventDeleted.includes(e.gcalId))D.eventDeleted.push(e.gcalId)}

}

/** ファイル名から年月を読み取る（202609_勤務表.xlsx / 2026-09 / 9月度 など） */
function monthFromName(fn){
  fn=String(fn||'').normalize('NFKC');
  let m=fn.match(/(20\d{2})[-_.年]?\s*(\d{1,2})\s*月?/);
  if(m&&Number(m[2])>=1&&Number(m[2])<=12)return m[1]+'-'+String(m[2]).padStart(2,'0');
  m=fn.match(/(?:令和|R)\s*(\d{1,2})\s*[年\.\-_]?\s*(\d{1,2})\s*月/);
  if(m)return (2018+Number(m[1]))+'-'+String(m[2]).padStart(2,'0');
  m=fn.match(/(\d{1,2})\s*月/);
  if(m&&Number(m[1])>=1&&Number(m[1])<=12){
    const y=new Date().getFullYear();return y+'-'+String(m[1]).padStart(2,'0');
  }
  return '';
}

/* ===== 名前の照合 ===== */
function normName(s){
  return String(s||'').normalize('NFKC').replace(/[\s　]/g,'').trim();
}
/** 勤務表などの氏名を、名簿の誰かに結び付ける（完全一致か、登録済みの読み替えのみ） */
function resolveStaff(raw){
  const n=normName(raw);
  if(!n)return null;
  // 登録済みの読み替え
  const al=(D.settings.nameAliases||{})[n];
  if(al){const p=D.staff.find(x=>normName(x.name)===normName(al));if(p)return p}
  // 完全一致（空白・全角半角の違いは吸収）
  const p=D.staff.find(x=>normName(x.name)===n);
  if(p)return p;
  // 「石山」と「石山美」、「山下」と「山下智」のような別人がいるため、
  // 前方一致では自動で結び付けない。候補として照合画面に出す。
  return null;
}
/** 候補（同姓など）を返す */
function staffCandidates(raw){
  const n=normName(raw);
  if(!n)return [];
  const hit=D.staff.filter(x=>{
    const m=normName(x.name);
    return m.startsWith(n)||n.startsWith(m)||m.slice(0,2)===n.slice(0,2);
  });
  // 名前の近い順（文字数の差が小さい順）
  return hit.sort((a,b)=>Math.abs(normName(a.name).length-n.length)-Math.abs(normName(b.name).length-n.length));
}

}

  <div class="foot"><button class="btn ghost" onclick="UNK=[];renderMatch()">残りは無視して閉じる</button></div>`);
}

/* 向こう（シート／他端末）のデータを採用するとき、手元の印と削除記録を引き継ぐ */
function adoptRemote(remote,localSnap){
  const l=localSnap||D;
  const gas=D.settings.gasUrl;
  const localEv=(l&&l.events)||[];
  const merged={...D,...remote,settings:{...DEFAULT_SETTINGS,...(D.settings||{}),...(remote.settings||{}),gasUrl:gas}};
  (merged.events||[]).forEach(ev=>{
    const lv=localEv.find(x=>x.id===ev.id||(x.gcalId&&x.gcalId===ev.gcalId));
    if(!lv)return;
    if(lv.done&&!ev.done){ev.done=true;ev.doneAt=lv.doneAt}
    if(lv.cancelled&&!ev.cancelled){ev.cancelled=true;ev.cancelledAt=lv.cancelledAt}
  });
  // 声：こちらで付けた既読・対応済み・タグ・束ねを引き継ぐ
  const localNotes=(l&&l.notes)||[];
  (merged.notes||[]).forEach(n=>{
    const ln=localNotes.find(x=>x.id===n.id||(x.formKey&&x.formKey===n.formKey));
    if(!ln)return;
    if(ln.read&&!n.read)n.read=true;
    if(ln.done&&!n.done){n.done=true;n.doneAt=ln.doneAt;n.reply=n.reply||ln.reply}
    if(ln.reply&&!n.reply)n.reply=ln.reply;
    if(ln.tags&&ln.tags.length&&!(n.tags&&n.tags.length))n.tags=ln.tags.slice();
    if(ln.bundleId&&!n.bundleId)n.bundleId=ln.bundleId;
    if(ln.tasked&&!n.tasked)n.tasked=true;
  });
  // 案件：こちらで完了・委任にしたものを引き継ぐ
  const localTasks=(l&&l.tasks)||[];
  (merged.tasks||[]).forEach(t=>{
    const lt=localTasks.find(x=>x.id===t.id);
    if(!lt)return;
    if(lt.status==='done'&&t.status!=='done'){t.status='done';t.doneAt=lt.doneAt}
    if(lt.status==='delegated'&&t.status==='open'){t.status='delegated';t.assignee=lt.assignee;t.delegId=lt.delegId;t.handoffs=lt.handoffs}
    if(lt.steps&&t.steps){lt.steps.forEach(ls=>{const s=t.steps.find(y=>y.id===ls.id);if(s&&ls.done&&!s.done)s.done=true})}
  });
  // 話したいこと：こちらで足した・話した分を引き継ぐ
  const localStaff=(l&&l.staff)||[];
  (merged.staff||[]).forEach(p=>{
    const lp=localStaff.find(x=>x.id===p.id);
    if(!lp||!lp.talk)return;
    p.talk=p.talk||[];
    lp.talk.forEach(lt=>{
      const x=p.talk.find(y=>y.id===lt.id);
      if(!x)p.talk.push(lt);
      else if(lt.done&&!x.done){x.done=true;x.doneAt=lt.doneAt}
      else if(lt.t!==x.t&&lt.at===x.at)x.t=lt.t;
    });
  });
  merged.eventDeleted=[...new Set([...((l&&l.eventDeleted)||[]),...(remote.eventDeleted||[])])];
  merged.noteDeleted=[...new Set([...((l&&l.noteDeleted)||[]),...(remote.noteDeleted||[])])];
  merged.eventSeen=[...new Set([...((l&&l.eventSeen)||[]),...(remote.eventSeen||[])])];
  if(merged.eventDeleted.length)merged.events=(merged.events||[]).filter(ev=>!ev.gcalId||!merged.eventDeleted.includes(ev.gcalId));
  if(merged.noteDeleted.length)merged.notes=(merged.notes||[]).filter(n=>!n.formKey||!merged.noteDeleted.includes(n.formKey));
  return merged;
}

/** 振り返りの対象日（切り替え時刻より前なら前日） */
function reflectDate(){
  const [hh,mm]=String(D.settings.dayCutoff||'05:00').split(':').map(Number);
  const now=new Date();
  const cut=(hh||0)*60+(mm||0);
  if(now.getHours()*60+now.getMinutes()<cut)return addDays(today(),-1);
  return today();
}
function nudgeTimeToday(){
  const t=reflectDate();
  if(t!==today()){const d=new Date();d.setHours(0,0,0,0);return d}   // 日付をまたいでいる＝もう声かけの時間
  const [hh,mm]=String(D.settings.nudgeTime||'20:00').split(':').map(Number);
  let when=new Date();when.setHours(hh||20,mm||0,0,0);
  let last=null;
  eventsOn(t).forEach(e=>{
    if(e.cancelled||e.cat==='私用'||!e.end)return;
    const d=new Date();const p=e.end.split(':');d.setHours(+p[0],+p[1],0,0);
    if(!last||d>last)last=d;
  });
  if(last){const c=new Date(last.getTime()+15*60000);const f=new Date();f.setHours(17,0,0,0);if(c>=f)when=c}
  return when;
}

/* ===== 通信：時間がかかっても待ち、失敗したらやり直す ===== */
async function callGas(payload,opt){
  opt=opt||{};
  const url=D.settings.gasUrl;
  if(!url)throw new Error('シートの接続先が設定されていません');
  const tries=opt.tries||3;
  const waitMs=opt.timeout||120000;
  let lastErr=null;
  for(let i=0;i<tries;i++){
    try{
      const ctl=('AbortController' in window)?new AbortController():null;
      const timer=ctl?setTimeout(()=>ctl.abort(),waitMs):null;
      const r=await fetch(url,{method:'POST',redirect:'follow',body:JSON.stringify(payload),signal:ctl?ctl.signal:undefined});
      if(timer)clearTimeout(timer);
      const txt=await r.text();
      let j=null;
      try{j=JSON.parse(txt)}catch(e){throw new Error('応答を読み取れませんでした')}
      return j;
    }catch(e){
      lastErr=e;
      if(i<tries-1){
        if(opt.onRetry)opt.onRetry(i+2,tries);
        await new Promise(res=>setTimeout(res,1500*(i+1)));
      }
    }
  }
  throw lastErr||new Error('通信に失敗しました');
}

/* ===== ファイル読み取りの共通処理 ===== */
function decodeAuto(buf){
  const u=new Uint8Array(buf);
  try{return new TextDecoder('utf-8',{fatal:true}).decode(u)}       // 厳密UTF-8
  catch(e){
    try{return new TextDecoder('shift-jis').decode(u)}              // エクセル既定のSJIS
    catch(e2){return new TextDecoder('utf-8').decode(u)}
  }
}
function readTable(file,cb){
  const isCsv=/\.csv|\.txt$/i.test(file.name);
  const rd=new FileReader();
  rd.onerror=()=>cb({error:'ファイルを読めませんでした'});
  rd.onload=()=>{
    try{
      if(isCsv){
        let txt=decodeAuto(rd.result).replace(/^\uFEFF/,'');
        const sep=(txt.split('\t').length>txt.split(',').length)?'\t':',';
        const rows=txt.split(/\r?\n/).map(l=>splitCsv(l,sep));
        cb({rows,sheets:['(CSV)'],sheet:'(CSV)'});
      }else{
        if(!window.XLSX)return cb({error:'エクセルを読む部品が読み込めていません。ネット接続を確認するか、CSVで保存してお試しください。'});
        const wb=XLSX.read(rd.result,{type:'array',cellDates:false});
        cb({wb,sheets:wb.SheetNames,sheet:wb.SheetNames[0],rows:sheetRows(wb,wb.SheetNames[0])});
      }
    }catch(e){cb({error:e.message})}
  };
  rd.readAsArrayBuffer(file);
}
function sheetRows(wb,name){
  const sh=wb.Sheets[name];
  if(!sh)return [];
  // 結合セルを展開（左上の値を範囲全体に複写）
  const rows=XLSX.utils.sheet_to_json(sh,{header:1,defval:'',raw:false,blankrows:true});
  (sh['!merges']||[]).forEach(m=>{
    const v=(rows[m.s.r]||[])[m.s.c];
    if(v===''||v==null)return;
    for(let r=m.s.r;r<=m.e.r;r++){rows[r]=rows[r]||[];for(let c=m.s.c;c<=m.e.c;c++)if(!rows[r][c])rows[r][c]=v}
  });
  return rows.map(r=>(r||[]).map(c=>String(c==null?'':c).replace(/\u3000/g,' ').trim()));
}
function splitCsv(line,sep){
  const out=[];let cur='',q=false;
  for(let i=0;i<line.length;i++){
    const ch=line[i];
    if(q){ if(ch==='"'){ if(line[i+1]==='"'){cur+='"';i++} else q=false } else cur+=ch }
    else { if(ch==='"')q=true; else if(ch===sep){out.push(cur);cur=''} else cur+=ch }
  }
  out.push(cur);return out.map(s=>s.replace(/\u3000/g,' ').trim());
}

function tablePreview(rows,note){

/* ===== 勤務コードの解釈（勤務ボードと同じ規則） ===== */
function z2hX(s){return String(s||'').replace(/[〜～]/g,'-').replace(/時/g,'').replace(/Ｆ/g,'F').replace(/ＮＳ/g,'NS')}
function classifyShift(t){
  t=String(t||'').trim();
  if(isOffX(t))return null;
  const n=z2hX(t);
  if(/^9-1[89]$/.test(n))       return {s:'9:00', l:'メイン', p:''};
  if(/^10(:00)*$/.test(n))      return {s:'10:00',l:'メイン', p:''};
  if(n==='13-22'||n==='13-19')  return {s:'13:00',l:'メイン', p:''};
  if(n.startsWith('22-31'))     return {s:'22:00',l:'メイン', p:''};
  if(n.startsWith('23-32'))     return {s:'23:00',l:'メイン', p:''};
  if(n==='11-20')               return {s:'10:00',l:'メイン', p:''};
  if(/^NS研/.test(n))           return {s:'10:00',l:'NS',     p:'研修'};
  if(n==='NS')                  return {s:'10:00',l:'NS',     p:''};
  if(n==='N')                   return {s:'10:00',l:'N',      p:''};
  if(t==='夜勤')                return {s:'16:00',l:'夜勤',   p:''};
  if(/^A?F$/.test(n))           return {s:'',     l:'フリー', p:''};
  if(t==='早朝')                return {s:'4:00', l:'早朝',   p:''};
  if(t==='Viz'||t==='バ')       return {s:'10:00',l:'バーチャル',p:''};
  if(t==='出中')                return {s:'10:00',l:'出中',   p:''};
  return {s:'10:00',l:'編集室',p:t};
}
/** アルバイトの開始時刻（土日／平日で変わる） */
function baitoStart(date,kind){
  const w=parse(date).getDay();
  const wknd=(w===0||w===6);
  return wknd?(kind==='A'?'10:00':'16:30'):'17:00';
}
/** 保存値「場所|開始|番組」を分解 */
function splitCell(v){

  if(s.indexOf('|')<0)return {l:s,s:'',p:''};
  const a=s.split('|');
  return {l:a[0]||'',s:a[1]||'',p:a[2]||''};
}
function shiftInfo(name,date){

}

/* ===== 「名前行＋シフト行」形式の勤務表を読む（勤務ボードと同じ方式） ===== */
const OFF_X=new Set(['休','休み','★','有','有休','夏季有休','ぐ～休','ぐ〜休','CUE','cue','Cue','公','公休','年休','×','x','X','ー','-','―','']);
function isOffX(v){return OFF_X.has(String(v||'').trim())}
/**
 * 行の作り：A列に氏名 → その「次の行」に1日〜月末のシフト、さらに次に補足行が入ることがある。
 * アルバイトA／B／研修の行は、セルの中身が「その日に入る人の名前」。
 */
function rowsToShiftPaired(rows,ym,dayCol){
  rows=(rows||[]).map(r=>(r||[]).map(c=>String(c==null?'':c).replace(/\u3000/g,' ').trim()));
  dayCol=(dayCol==null?1:dayCol);
  const Y=ym?Number(ym.slice(0,4)):new Date().getFullYear();
  const M=ym?Number(ym.slice(5,7)):new Date().getMonth()+1;
  const dim=new Date(Y,M,0).getDate();
  const ymDate=ym||null;
  const at=(r,d)=>String((rows[r]||[])[dayCol+d-1]||'').trim();       // d=1..dim
  const filled=r=>{let k=0;for(let d=1;d<=dim;d++)if(at(r,d))k++;return k};
  const nameOf=r=>String((rows[r]||[])[0]||'').trim();
  const NGNAME=/^(氏名|名前|№|No\.?|合計|総計|小計|計|備考|日付|曜日|人数|以上)$/i;
  /** その行が日付・曜日の見出しか */
  const isHeadRow=r=>{
    let seq=0;for(let d=1;d<=10;d++){const v=at(r,d);const n=v&&v.match(/^(\d{1,2})/);if(n&&Number(n[1])===d)seq++;else break}
    if(seq>=7)return true;
    let dow=0;for(let d=1;d<=10;d++)if(/^[月火水木金土日]$/.test(at(r,d)))dow++;
    return dow>=7;
  };
  const map={};
  const put=(name,d,code)=>{if(!name||NGNAME.test(name))return;map[name]=map[name]||{};if(code)map[name][d]=code};
  const putCell=(name,d,info,detail,raw)=>{
    if(!info){put(name,d,'休');return}
    // 結合セルの複写で、補足がシフトと同じ値になることがある
    if(detail&&(detail===raw||detail===info.p||detail===info.l))detail='';
    let prog=info.p;
    if(detail){
      if(info.l==='編集室')prog=(info.p?info.p+' ':'')+detail;
      else prog=prog?prog+' '+detail:detail;
    }
    put(name,d,[info.l,info.s,prog].join('|'));
  };
  const usedRows=new Set();
  const baitoRows=[],kenshuRows=[];
  let cgRow=-1,blocks=0;
  // 1) 特別な行（アルバイト枠・研修・CG）を先に見つける
  for(let r=0;r<rows.length;r++){
    const nm=nameOf(r);
    if(!nm)continue;
    if(/^CGデザイン/.test(nm)){cgRow=r;usedRows.add(r);continue}
    if(/^アルバイト\s*A/.test(nm)){baitoRows.push({r,kind:'A'});usedRows.add(r);continue}
    if(/^アルバイト\s*B/.test(nm)){baitoRows.push({r,kind:'B'});usedRows.add(r);continue}
    if(/^アルバイト研修|^研修|ぐ[～〜]たく/.test(nm)){kenshuRows.push(r);usedRows.add(r);continue}
  }
  // 研修枠の続き行（名前が無く中身だけの行）
  if(kenshuRows.length){
    const looksKenshu=n=>{for(let d=1;d<=dim;d++){const v=at(n,d);if(v&&/[研：:]/.test(v))return true}return false};
    let r=kenshuRows[kenshuRows.length-1]+1;
    const kBase=nameOf(kenshuRows[0]);
    while(r<rows.length&&(!nameOf(r)||nameOf(r)===kBase)&&filled(r)>=1&&!isHeadRow(r)&&looksKenshu(r)){kenshuRows.push(r);usedRows.add(r);r++}
  }
  // 2) 名前のある行をすべて走査（見出し行の上下を問わない）
  const seen={};
  for(let r=0;r<rows.length;r++){
    if(usedRows.has(r))continue;
    const nm=nameOf(r);
    if(!nm||NGNAME.test(nm))continue;
    if(/^[\d\.\-\/\s]+$/.test(nm))continue;
    if(isHeadRow(r))continue;
    if(seen[nm])continue;              // 結合セルで同じ名前が続く場合は最初の1回だけ扱う
    // シフト行か補足行かは「休みが入っているか」で見分ける（補足行に休は入らない）
    const offs=n=>{let k=0;for(let d=1;d<=dim;d++)if(isOffX(at(n,d))&&at(n,d)!=='')k++;return k};
    const score=n=>(n<0||n>=rows.length)?-1:offs(n)*10+filled(n);
    const nxName=nameOf(r+1);
    const canNext=(r+1<rows.length&&(!nxName||nxName===nm)&&!isHeadRow(r+1));
    const s0=score(r), s1=canNext?score(r+1):-1;
    let sr=-1;
    if(s1>s0)sr=r+1; else if(s0>0)sr=r;
    if(sr<0||filled(sr)<3)continue;
    // シフト行の下が業務内容の補足行なら、番組名としてまとめる
    let dr=-1;
    {
      const k=sr+1;
      // 補足行にも「休」が入ることがあるので、休の有無では判定しない。
      // シフト行として選ばれなかった次の行＝業務内容の行とみなす。
      if(k<rows.length&&!isHeadRow(k)&&(!nameOf(k)||nameOf(k)===nm)&&!usedRows.has(k)&&filled(k)>=1&&score(k)<=score(sr))dr=k;
    }
    for(let d=1;d<=dim;d++){
      const v=at(sr,d);
      if(v==='')continue;
      putCell(nm,d,classifyShift(v),dr>=0?at(dr,d):'',v);
    }
    if(dr>=0)usedRows.add(dr);
    blocks++;seen[nm]=1;usedRows.add(r);if(sr!==r)usedRows.add(sr);
    // 結合セルで同名が続く行もまとめて使用済みにする
    for(let k=r+1;k<rows.length&&nameOf(k)===nm;k++)usedRows.add(k);
  }
  // 3) アルバイト枠：セルの中身が人名
  baitoRows.forEach(b=>{
    // 枠行そのものに人名がある形と、次の行にある形の両方に対応
    let src=b.r;
    if(filled(src)<1)src=b.r+1;
    else{const bn=nameOf(b.r);if(filled(b.r+1)>filled(b.r)&&(!nameOf(b.r+1)||nameOf(b.r+1)===bn))src=b.r+1}
    for(let d=1;d<=dim;d++){
      const v=at(src,d);
      if(!v||v==='★'||isOffX(v))continue;
      const bs2=ymDate?baitoStart(ymDate+'-'+String(d).padStart(2,'0'),b.kind):'';
      v.split(/[\/／・,、\s]+/).filter(Boolean).forEach(nm=>put(nm,d,['バイト'+b.kind,bs2,''].join('|')));
    }
  });
  // 4) 研修枠（勤務ボードと同じ規則：日曜は「ぐ～たく（Bサブ）」、それ以外は研修）
  kenshuRows.forEach(r=>{
    for(let d=1;d<=dim;d++){
      const t=at(r,d);
      if(!t)continue;
      const date=ymDate?ymDate+'-'+String(d).padStart(2,'0'):null;
      const sun=date?parse(date).getDay()===0:false;
      const sat=date?parse(date).getDay()===6:false;
      if(t==='★')continue;                                   // 欠員は誰も入っていない
      const m=t.match(/(.+?)[：:](.+)/);
      const bs=t.match(/^Bサブ(.+)$/);
      if(m){                                                 // 「☀研：中根」「夜研：近藤翔」
        const yoru=/夜/.test(m[1]);
        put(m[2].trim(),d,['バイト'+(yoru?'B':'A'),yoru?'16:30':(sat||sun?'10:00':'17:00'),'研修'].join('|'));
      }
      else if(bs)put(bs[1].trim(),d,['ぐ～たく','16:30',''].join('|'));
      else if(t.length<=6&&!/\d/.test(t)&&/[ぁ-んァ-ヶ一-龠]/.test(t)&&!/^[Ａ-Ｚａ-ｚA-Za-z]+$/.test(t)){
        if(sun)put(t,d,['ぐ～たく','16:30',''].join('|'));    // 日曜＝ぐ～たく（Bサブ）
        else put(t,d,['バイトA',(sat?'10:00':'17:00'),'研修'].join('|'));
      }
    }
  });
  const lines=Object.keys(map).filter(n=>Object.keys(map[n]).length).map(name=>{
    const cells=[];for(let d=1;d<=31;d++)cells.push(map[name][d]||'');
    return [name,...cells].join('\t');
  });
  return {lines,dim,blocks,baito:baitoRows.length,kenshu:kenshuRows.length,cgRow};
}
/** 「1行＝1人」か「名前行＋シフト行」かを自動で見分ける */
function detectShiftLayout(rows,dayCol){
  rows=(rows||[]).map(r=>(r||[]).map(c=>String(c==null?'':c).trim()));
  dayCol=(dayCol==null?1:dayCol);
  const nm=r=>String((rows[r]||[])[0]||'').trim();
  const cnt=r=>{let k=0;for(let d=1;d<=12;d++)if(String((rows[r]||[])[dayCol+d-1]||'').trim())k++;return k};
  const off=r=>{let k=0;for(let d=1;d<=12;d++){const v=String((rows[r]||[])[dayCol+d-1]||'').trim();if(v&&isOffX(v))k++}return k};
  let same=0,paired=0,merged=0;
  for(let r=0;r<rows.length-1;r++){
    const a=nm(r);
    if(!a||/^(氏名|名前|№|No\.?|合計|計|備考|日付|曜日)$/i.test(a))continue;
    if(/^[\d\.\-\/\s]+$/.test(a))continue;
    const b=nm(r+1);
    // 結合セルで同じ名前が続いている → 名前行＋シフト行の形
    if(b===a){
      merged++;
      if(cnt(r+1)>cnt(r)||off(r+1)>off(r))paired++;
      continue;
    }
    const c0=cnt(r), c1=b?0:cnt(r+1);
    // 自分の行に休みが入っていれば「1行＝1人」
    if(c0>=6&&off(r)>=1)same++;
    else if(c1>=6&&off(r+1)>=1)paired++;
    else if(c0>=6)same++;
    else if(c1>=6)paired++;
  }
  if(merged>=3)return 'paired';
  return paired>same?'paired':'same';
}

const COLDEF=[
  {k:'name',    label:'氏名',        re:/氏名|名前|スタッフ名|社員名|ｽﾀｯﾌ|従業員名|従業員|name/i, ng:/フリガナ|ふりがな|ﾌﾘｶﾞﾅ|カナ|ｶﾅ|kana/i},
  {k:'kind',    label:'区分',        re:/区分|雇用|形態|種別|契約区分|身分|職種|資格/i},
  {k:'dept',    label:'所属',        re:/所属|現場|部署|部門|拠点|事業所|チーム|課|グループ|配属/i},
  {k:'start',   label:'就業開始日',  re:/入社|就業|着任|配属日|勤務開始|開始日|採用/i},
  {k:'renewal', label:'次回更新日',  re:/更新日|次回更新|契約満了|満了|期限|終了日|契約終了/i},
  {k:'cycle',   label:'更新サイクル',re:/サイクル|更新周期|契約期間|周期|か月|ヶ月|期間/i},
  {k:'birth',   label:'誕生日',      re:/誕生|生年|birth/i}
];
function rowsToRoster(rows,override){
  rows=(rows||[]).map(r=>(r||[]).map(c=>String(c==null?'':c).replace(/\u3000/g,' ').trim()));
  // 1) 見出し行を探す（短いラベルが2種類以上そろう行）
  let headIx=-1,bestScore=1;
  for(let i=0;i<Math.min(rows.length,20);i++){
    const hit=new Set();
    rows[i].forEach(v=>{
      if(!v||v.length>12)return;
      for(const d of COLDEF){if(d.ng&&d.ng.test(v))continue;if(d.re.test(v))hit.add(d.k)}
    });
    if(hit.size>bestScore){bestScore=hit.size;headIx=i}
  }
  // 2) 列の対応づけ（見出しが2行に分かれている場合は上の行と連結）
  const col={};
  if(headIx>0){
    const merged=(rows[headIx]||[]).map((v,c)=>((rows[headIx-1]||[])[c]||'')+v);
    merged.forEach((v,c)=>{
      if(!v||v.length>14)return;
      for(const d of COLDEF){if(d.ng&&d.ng.test(v))continue;if(col[d.k]===undefined&&d.re.test(v)){col[d.k]=c;return}}
    });
  }
  if(headIx>=0){
    rows[headIx].forEach((v,c)=>{
      if(!v)return;
      for(const d of COLDEF){if(d.ng&&d.ng.test(v))continue;if(col[d.k]===undefined&&d.re.test(v)){col[d.k]=c;return}}
    });
  }
  // 3) 見出しから氏名列が取れないときは中身から推定
  if(col.name===undefined){
    const w=Math.max(...rows.map(r=>r.length),1);
    let best=-1,bestN=0;
    for(let c=0;c<Math.min(w,10);c++){
      let n=0;
      rows.forEach((r,i)=>{
        if(i===headIx)return;
        const v=r[c]||'';
        if(!v||v.length>14)return;
        if(/^\d/.test(v))return;                    // 数字始まりは除外
        if(/^[\d\/\-\.]+$/.test(v))return;          // 日付は除外
        if(/[ぁ-んァ-ヶ一-龠]/.test(v)||/^[A-Za-z\s]+$/.test(v))n++;
      });
      if(n>bestN){bestN=n;best=c}
    }
    if(best>=0&&bestN>=2)col.name=best;
  }
  if(col.name===undefined)col.name=0;
  // 4) 手動指定で上書き
  if(override)Object.keys(override).forEach(k=>{
    if(override[k]===null)delete col[k];else col[k]=override[k];
  });
  // 5) データ行
  const NG=/^(氏名|名前|スタッフ|スタッフ名|社員|社員名|従業員|№|No\.?|備考|以上|区分|所属|部署|課|部|フリガナ|ふりがな|ﾌﾘｶﾞﾅ|カナ)$/i;
  const NGP=/^\s*(合計|総計|小計|計|人数|以上|備考)/;
  const out=[];
  const start=headIx>=0?headIx+1:0;
  for(let i=start;i<rows.length;i++){
    const r=rows[i];
    let name=(r[col.name]||'').trim();
    if(!name||NG.test(name)||NGP.test(name))continue;
    if(/^[\d\.\-\/\s]+$/.test(name))continue;       // 数字・日付だけの行は除外
    const g=k=>col[k]!==undefined?(r[col[k]]||'').trim():'';
    out.push({name,kind:g('kind'),dept:g('dept'),start:g('start'),renewal:g('renewal'),cycle:g('cycle'),birth:g('birth')});
  }
  return {rows:out,col,headIx};
}

function normDate(s){
  s=String(s==null?'':s).trim();if(!s)return '';
  // エクセルの日付シリアル値
  if(/^\d{5}$/.test(s)){const n=Number(s);if(n>20000&&n<80000){const d=new Date(Date.UTC(1899,11,30)+n*86400000);return ymd(new Date(d.getUTCFullYear(),d.getUTCMonth(),d.getUTCDate()))}}
  // ISO/スラッシュ/ドット/漢数字区切り
  let m=s.match(/(\d{4})\s*[\/\-\.年]\s*(\d{1,2})\s*[\/\-\.月]\s*(\d{1,2})/);
  if(m)return m[1]+'-'+String(m[2]).padStart(2,'0')+'-'+String(m[3]).padStart(2,'0');
  // 8桁（20260401）
  m=s.match(/^(\d{4})(\d{2})(\d{2})$/);
  if(m)return m[1]+'-'+m[2]+'-'+m[3];
  // 和暦（令和6年4月1日 / R6.4.1）
  m=s.match(/(?:令和|R)\s*(\d{1,2})\s*[年\.\/\-]\s*(\d{1,2})\s*[月\.\/\-]\s*(\d{1,2})/);
  if(m)return (2018+Number(m[1]))+'-'+String(m[2]).padStart(2,'0')+'-'+String(m[3]).padStart(2,'0');
  m=s.match(/(?:平成|H)\s*(\d{1,2})\s*[年\.\/\-]\s*(\d{1,2})\s*[月\.\/\-]\s*(\d{1,2})/);
  if(m)return (1988+Number(m[1]))+'-'+String(m[2]).padStart(2,'0')+'-'+String(m[3]).padStart(2,'0');
  m=s.match(/(?:昭和|S)\s*(\d{1,2})\s*[年\.\/\-]\s*(\d{1,2})\s*[月\.\/\-]\s*(\d{1,2})/);
  if(m)return (1925+Number(m[1]))+'-'+String(m[2]).padStart(2,'0')+'-'+String(m[3]).padStart(2,'0');
  // 年なし（4/1）→ 今年
  m=s.match(/^(\d{1,2})\s*[\/\-\.月]\s*(\d{1,2})/);
  if(m)return new Date().getFullYear()+'-'+String(m[1]).padStart(2,'0')+'-'+String(m[2]).padStart(2,'0');
  // Date が解釈できる形
  const d=new Date(s);
  if(!isNaN(d.getTime())&&d.getFullYear()>1900&&d.getFullYear()<2100)return ymd(d);
  return '';
}

function guessKind(v){
  v=String(v||'');
  if(/派遣|ﾊｹﾝ/.test(v))return '派遣';           // 「派遣社員」を先に判定
  if(/パート|アルバイト|バイト|ﾊﾟｰﾄ|ｱﾙﾊﾞｲﾄ|非常勤|時給|ﾊﾟ|P|A/.test(v)&&!/正/.test(v))return 'バイト';
  if(/嘱託|再雇用|シニア|定年後/.test(v))return '嘱託';
  if(/正社員|正職|常勤|社員|職員/.test(v))return '社員';
  return '';
}
function normCycle(v){
  const s=String(v||'');
  const m=s.match(/(\d+)/);if(!m)return '';
  const n=Number(m[1]);
  if(/年/.test(s))return n*12;
  return n;
}

    const d=c[c.length-1].v-c[c.length-2].v;
    out.push(d>=2?'状態が急に変わった理由（何があったか）':'最近の変化について')}
  if(c.length&&c[c.length-1].v>=4)out.push('負担に感じていること／続けられるか');
  const gap=p.lastContact?diffDays(p.lastContact,t):null;
  if(gap===null)out.push('はじめての面談。これまでの経緯と希望');
  else if(gap>180)out.push('久しぶり（'+gap+'日ぶり）。この間の変化');
  if(p.homework)out.push('前回の課題：'+p.homework);
  if(p.birthday){const b=p.birthday.slice(5),tb=t.slice(5);if(b===tb)out.push('お誕生日')}
  const mine=(D.settings.themes||[]).filter(Boolean);
  if(!out.length&&!mine.length)out.push('最近の様子','シフトや働き方の希望','困っていること');
  return mine.concat(out).slice(0,6);
}

function meetingStats(from,to){

  const meet=D.events.filter(e=>(e.cat==='会議'||e.cat==='打合せ')&&e.date>=ws&&e.date<=we);

/* ========== 今週の作戦（みーの提案） ========== */
function freeSlots(date,need){
  need=need||60;
  const ev=eventsOn(date);
  const day=[['09:00','12:00'],['13:00','18:00']];
  const out=[];
  day.forEach(([s,e])=>{
    for(let m=mins(s);m+need<=mins(e);m+=30){
      const st=String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0');
      const en=m+need;
      const clash=ev.some(x=>x.start&&mins(x.start)<en&&m<mins(x.end||x.start)+1);
      if(!clash)out.push(st);
    }
  });
  return out;
}
function buildPlan(ws){
  ws=ws||weekStart(today());
  const we=addDays(ws,6);
  const goal=D.settings.weekGoals[ws]??D.settings.weeklyGoal;
  const already=D.events.filter(e=>e.cat==='人'&&e.date>=ws&&e.date<=we);
  const doneH=already.reduce((a,e)=>a+durH(e),0);
  const booked=new Set(already.map(e=>e.staffName).filter(Boolean));
  // 候補：浮上順、すでに予約済みの人は除く
  const cand=targetStaff().map(p=>({p,sc:staffScore(p)})).filter(x=>!booked.has(x.p.name)&&x.sc>=35&&staffWhy(x.p)).sort((a,b)=>b.sc-a.sc);
  const used={};
  const picks=[];
  const remain=Math.max(0,goal-doneH);
  const need=60;
  for(const c of cand){
    if(picks.length>=4)break;
    if(picks.length*1>=remain&&picks.length>=1)break;
    // 平日のうち、本人が出勤していて自分も空いている日を探す
    let found=null;
    for(let i=0;i<7;i++){
      const d=addDays(ws,i);
      if(d<today())continue;
      const code=shiftOf(c.p.name,d);
      const hasShift=!!(D.shifts||{})[d.slice(0,7)];
      if(hasShift&&(code===null||isOff(code)))continue;
      const slots=freeSlots(d,need).filter(s=>!(used[d]||[]).includes(s));
      if(slots.length){found={date:d,slot:slots[Math.min(1,slots.length-1)],code:hasShift?code:''};break}
    }
    if(found){
      (used[found.date]=used[found.date]||[]).push(found.slot);
      picks.push({...c,...found,why:staffWhy(c.p),ideas:askIdeas(c.p)});
    }
  }
  // 会議の見直し候補
  const audit=(()=>{
    const to=today(),from=addDays(to,-89);const map=meetingSeries();
    return Object.keys(map).map(k=>{
      const list=map[k].filter(e=>e.date>=from&&e.date<=to).sort((a,b)=>b.date.localeCompare(a.date));
      if(list.length<3)return null;
      const noTodo=list.slice(0,3).every(e=>!D.tasks.some(t=>t.meetingId===e.id));
      return noTodo?{k,h:(list.reduce((a,e)=>a+durH(e),0)/3)}:null;
    }).filter(Boolean).sort((a,b)=>b.h-a.h)[0];
  })();
  const stale=openTasks().filter(x=>staleDays(x)>=3);
  const mailStale=D.mails.filter(m=>m.status==='open'&&mailBucket(m)==='reply'&&mailStaleDays(m)>=3);
  const pend=pendingReports();
  const zero=targetStaff().filter(p=>!p.lastContact||diffDays(p.lastContact,today())>=120);
  const sig=(shiftSignals()||[]).filter(s=>s.sev>=50);
  return {ws,we,goal,doneH,remain,picks,audit,stale,mailStale,pend,zero,sig,booked:already.length};
}

  else L.push('今週は特に急ぎの方はおられません。');

/* ========== 2. 予兆の検知（勤務表から） ========== */
function monthKeys(n){
  const out=[];let ym=today().slice(0,7);
  for(let i=0;i<n;i++){out.push(ym);const d=parse(ym+'-01');d.setMonth(d.getMonth()-1);ym=ymd(d).slice(0,7)}
  return out;
}
function shiftProfile(name,ym){
  const m=(D.shifts||{})[ym];if(!m||!m[name])return null;
  const row=m[name];const codes={};let work=0,off=0,days=0;
  Object.keys(row).forEach(d=>{
    const c=splitCell(String(row[d]||'')).l.trim();
    if(!c)return;
    days++;
    if(isOff(c)){off++;codes['休']=(codes['休']||0)+1}
    else{work++;codes[c]=(codes[c]||0)+1}
  });
  return {work,off,days,codes};
}
/** 直近月と前月を比べて、変化のあった人を拾う */
function shiftSignals(){
  const ms=monthKeys(3);
  const cur=ms[0],prev=ms[1];
  if(!(D.shifts||{})[cur]||!(D.shifts||{})[prev])return null;
  const out=[];
  targetStaff().forEach(p=>{
    const a=shiftProfile(p.name,cur),b=shiftProfile(p.name,prev);
    if(!a||!b||!b.work)return;
    const reasons=[];let sev=0;
    // 出勤日数の減少
    const rate=a.work/Math.max(1,b.work);
    if(a.days>=15&&rate<=0.7){reasons.push('出勤が'+b.work+'日→'+a.work+'日に減少');sev+=Math.round((1-rate)*60)}
    // 休みの増加
    if(a.off-b.off>=3){reasons.push('休みが'+(a.off-b.off)+'日増加');sev+=25}
    // 勤務帯の変化（主たるシフトが変わった）
    const top=o=>Object.keys(o.codes).filter(k=>k!=='休').sort((x,y)=>o.codes[y]-o.codes[x])[0]||'';
    const ta=top(a),tb=top(b);
    if(ta&&tb&&ta!==tb){reasons.push('主な勤務が「'+tb+'」→「'+ta+'」に変化');sev+=20}
    // 勤務パターンのばらつき（種類が急に増えた）
    const va=Object.keys(a.codes).length,vb=Object.keys(b.codes).length;
    if(va-vb>=2){reasons.push('勤務の種類が増え不規則に');sev+=15}
    if(reasons.length)out.push({p,reasons,sev,cur:a,prev:b});
  });
  return out.sort((a,b)=>b.sev-a.sev);
}
function vSignal(){
  const sig=shiftSignals();
  let h=`<h2>勤務からの予兆</h2>`;
  if(sig===null)return h+`<div class="empty">2か月分以上の勤務表が必要です。<br><span class="small">SCHEDULE → 勤務 から先月分も取り込むと、変化を見つけられます。</span><div style="margin-top:10px"><button class="btn small" onclick="openShiftModal()">勤務表を貼り付ける</button></div></div>`;
  const ms=monthKeys(2);
  h+=`<p class="small muted">${ms[1]} と ${ms[0]} を比べています。面談の前に気づくための材料です。</p>`;
  if(!sig.length)return h+`<div class="empty">目立った変化のある方はいません。</div>`;

/* ========== 3. 面談の効き目（学習） ========== */
function meetingEffects(){
  const out=[];
  D.staff.forEach(p=>{
    const c=(p.conditions||[]).slice().sort((a,b)=>a.d.localeCompare(b.d));
    if(c.length<2)return;
    const ms=D.events.filter(e=>e.cat==='人'&&e.type==='面談'&&e.report&&(e.staffId===p.id||e.staffName===p.name)).sort((a,b)=>a.date.localeCompare(b.date));
    ms.forEach(e=>{
      const before=c.filter(x=>x.d<e.date).pop();
      const after=c.filter(x=>x.d>e.date)[0];
      if(!before||!after)return;
      out.push({p,e,before:before.v,after:after.v,delta:before.v-after.v});
    });
  });
  return out;
}
function vEffect(){
  const ef=meetingEffects();
  let h=`<h2>面談の効き目</h2>`;
  if(ef.length<5)return h+`<div class="empty">まだ判断できません。<br><span class="small">面談を記録し、その後のコンディションが記録されると、効いた面談の傾向が見えてきます。<br>現在 ${ef.length} 件（5件から表示）</span></div>`;
  const up=ef.filter(x=>x.delta>0),flat=ef.filter(x=>x.delta===0),down=ef.filter(x=>x.delta<0);
  h+=`<div class="condbox"><div class="cnums">
    <div><b>${up.length}</b><span>改善した</span></div>
    <div><b>${flat.length}</b><span>変わらず</span></div>
    <div><b>${down.length}</b><span>悪化した</span></div>
  </div><div class="clegend" style="margin-top:10px"><span>面談後にコンディションがどう動いたか（${ef.length}件）</span></div></div>`;
  // テーマ別の傾向
  const words={};
  ef.forEach(x=>{
    const src=((x.e.theme||'')+' '+(x.e.report||'')).replace(/\s+/g,' ');
    ['契約更新','シフト','家庭','体調','人間関係','仕事量','評価','将来','異動','残業','休み','give','感謝','相談'].forEach(w=>{
      if(src.includes(w)){words[w]=words[w]||{n:0,d:0};words[w].n++;words[w].d+=x.delta}
    });
  });
  const list=Object.keys(words).filter(w=>words[w].n>=2).sort((a,b)=>(words[b].d/words[b].n)-(words[a].d/words[a].n));
  if(list.length){
    h+=`<h2>話題ごとの傾向</h2>`;
    h+=list.map(w=>{const o=words[w];const avg=o.d/o.n;
      return `<div class="row"><div class="t"><div class="ttl">${esc(w)}<span class="pill">${o.n}件</span></div><div class="sub">${avg>0.2?'その後よくなる傾向':avg<-0.2?'その後下がる傾向':'変化なし'}（平均 ${avg>0?'+':''}${avg.toFixed(1)}）</div></div></div>`}).join('');
    h+=`<p class="small muted" style="margin-top:10px">件数が少ないうちは偶然の可能性が高いです。傾向として眺める程度に。</p>`;
  }
  // 効いた面談・効かなかった面談
  const best=up.slice().sort((a,b)=>b.delta-a.delta).slice(0,3);
  const worst=down.slice().sort((a,b)=>a.delta-b.delta).slice(0,3);
  if(best.length){h+=`<h2>その後よくなった面談</h2>`+best.map(x=>`<div class="row person" onclick="openReport('${x.e.id}')"><div class="time">${fmtMD(x.e.date).replace(/（.）/,'')}</div><div class="t"><div class="ttl">${esc(x.p.name)}　${x.before}→${x.after}</div><div class="sub">${esc((x.e.theme||x.e.report||'').slice(0,50))}</div></div></div>`).join('')}
  if(worst.length){h+=`<h2>その後下がった面談</h2>`+worst.map(x=>`<div class="row due" onclick="openReport('${x.e.id}')"><div class="time">${fmtMD(x.e.date).replace(/（.）/,'')}</div><div class="t"><div class="ttl">${esc(x.p.name)}　${x.before}→${x.after}</div><div class="sub">${esc((x.e.theme||x.e.report||'').slice(0,50))}</div></div></div>`).join('')}
  return h;
}


/* ========== G. 引き算の提案 ========== */
function subtractIdeas(){
  const t=today();const out=[];
  // 1. 成果の出ていない定例
  const map=meetingSeries();const from=addDays(t,-89);
  Object.keys(map).forEach(k=>{
    const list=map[k].filter(e=>e.date>=from&&e.date<=t).sort((a,b)=>b.date.localeCompare(a.date));
    if(list.length<3)return;
    const noTodo=list.slice(0,3).every(e=>!D.tasks.some(x=>x.meetingId===e.id));
    const hrs=list.reduce((a,e)=>a+durH(e),0)/3;
    const att=list.reduce((a,e)=>a+(Number(e.attendees)||1),0)/list.length;
    if(noTodo)out.push({t:'meeting',w:hrs*10,title:'「'+k+'」をやめる・隔週にする',
      why:'直近3回、ToDoが1件も出ていません。月'+hrs.toFixed(1)+'時間（延べ人時 '+(hrs*att).toFixed(1)+'h）',
      act:'見直す',go:()=>{repTab='audit';go('report')}});
  });
  // 2. 何も起きていない放置メール
  D.mails.filter(m=>m.status==='open'&&mailStaleDays(m)>=21&&!m.flagged).forEach(m=>{
    out.push({t:'mail',w:5,title:'「'+(m.subject||'').slice(0,24)+'」を対応不要にする',
      why:mailStaleDays(m)+'日放置されていますが、何も起きていません',act:'対応不要',id:m.id});
  });
  // 3. ずっと動かない案件
  openTasks().filter(x=>staleDays(x)>=21).forEach(x=>{
    out.push({t:'task',w:6,title:'「'+x.title.slice(0,24)+'」を手放す',
      why:staleDays(x)+'日動いていません。本当に必要ですか',act:'削除',id:x.id});
  });
  // 4. 出席しなくてよいかもしれない会議（自分のToDoが出ていない参加）
  const mine=D.events.filter(e=>e.cat==='会議'&&e.date>=addDays(t,-29)&&e.date<=t);
  if(mine.length>=6)out.push({t:'load',w:mine.reduce((a,e)=>a+durH(e),0),
    title:'今月の会議は'+mine.length+'件・'+mine.reduce((a,e)=>a+durH(e),0).toFixed(1)+'時間',
    why:'1件でも代理出席や欠席にできるものはありませんか',act:'一覧',go:()=>{repTab='audit';go('report')}});
  // 5. 定型作業の肥大
  const rt=routineStats();
  rt.filter(r=>r.hrs>=4).forEach(r=>out.push({t:'routine',w:r.hrs*2,
    title:'「'+r.k+'」に月'+r.hrs.toFixed(1)+'時間',why:'手順を減らすか、人に振れませんか',act:'DESKへ',go:()=>go('inbox')}));
  return out.sort((a,b)=>b.w-a.w).slice(0,8);
}
function subtractDo(x){
  if(x.t==='mail'){const m=D.mails.find(y=>y.id===x.id);if(m)m.status='ignored';store.save();render();toast('以後このメールは追いません')}
  else if(x.t==='task'){if(!confirm('この案件を削除しますか？'))return;D.tasks=D.tasks.filter(y=>y.id!==x.id);store.save();render();toast('手放しました')}
}
let SUB=[];
function vSubtract(){
  SUB=subtractIdeas();

}

/* ========== H. 定型作業にかかっている時間 ========== */
function routineStats(){
  const t=today(),from=addDays(t,-89);
  const evs=D.events.filter(e=>e.cat==='作業'&&e.date>=from&&e.date<=t);
  const map={};
  evs.forEach(e=>{
    // タイトルの数字や日付を落として同じ作業をまとめる
    const k=String(e.title||'作業').replace(/[（(][^）)]*[）)]/g,'').replace(/[0-9０-９]+/g,'').replace(/\s+/g,' ').trim()||'作業';
    (map[k]=map[k]||[]).push(e);
  });
  return Object.keys(map).map(k=>({k,n:map[k].length,hrs:map[k].reduce((a,e)=>a+durH(e),0)/3}))
    .filter(x=>x.n>=2).sort((a,b)=>b.hrs-a.hrs);
}
function vRoutine(){
  const rt=routineStats();
  const t=today(),from=addDays(t,-89);
  const all=D.events.filter(e=>e.date>=from&&e.date<=t&&e.cat!=='私用');
  const byCat={};all.forEach(e=>{byCat[e.cat]=(byCat[e.cat]||0)+durH(e)});
  const total=Object.values(byCat).reduce((a,b)=>a+b,0)/3;
  let h=`<h2>時間の使い先（月あたり）</h2>`;
  if(!total)return h+`<div class="empty">予定の記録がまだありません。</div>`;
  h+=`<div class="condbox">${CATS.map(c=>{
    const v=(byCat[c]||0)/3;const pct=total?Math.round(v/total*100):0;
    return v?`<div class="biasrow"><div class="bk">${c}</div><div class="bbar"><div class="bfill" style="width:${pct}%;${c==='人'?'':'background:var(--gray)'}"></div></div><div class="bnum">${v.toFixed(1)}h<span>${pct}%</span></div></div>`:''
  }).join('')}<div class="clegend" style="margin-top:8px"><span>合計 月${total.toFixed(1)}時間</span></div></div>`;
  h+=`<h2>くり返している作業</h2>`;
  if(!rt.length)return h+`<div class="empty">同じ作業が2回以上記録されると、ここに出ます。</div>`;
  h+=rt.slice(0,10).map(r=>`<div class="row ${r.hrs>=4?'due':''}"><div class="t"><div class="ttl">${esc(r.k)}${r.hrs>=4?'<span class="pill warnpill">要検討</span>':''}</div><div class="sub">月 ${r.hrs.toFixed(1)}時間　／　90日で${r.n}回　／　1回あたり ${(r.hrs*3/r.n).toFixed(1)}時間</div></div></div>`).join('');
  h+=`<p class="small muted" style="margin-top:12px">「作業」の型で登録した予定を、タイトルごとにまとめています。月4時間を超えるものは、手順を減らすか人に振る候補です。</p>`;
  return h;
}

/* ========== I. 沈黙の可視化 ========== */
function silenceBuckets(){
  const t=today();
  const B=[{k:'7日以内',max:7,n:[],c:'c1'},{k:'8〜30日',max:30,n:[],c:'c2'},{k:'31〜60日',max:60,n:[],c:'c3'},{k:'61〜90日',max:90,n:[],c:'c4'},{k:'91日以上',max:1e9,n:[],c:'c5'}];
  targetStaff().forEach(p=>{
    const g=p.lastContact?diffDays(p.lastContact,t):99999;
    (B.find(b=>g<=b.max)||B[4]).n.push({p,g});
  });
  B.forEach(b=>b.n.sort((a,b2)=>b2.g-a.g));
  return B;
}
function vSilence(){
  const B=silenceBuckets();const total=targetStaff().length;
  let h=`<h2>沈黙の分布</h2>`;
  if(!total)return h+`<div class="empty">名簿がまだありません。</div>`;
  const max=Math.max(...B.map(b=>b.n.length));
  h+=`<div class="condbox"><div class="silence">${B.map(b=>`<div class="sbar"><div class="scol"><div class="sfill ${b.c}" style="height:${max?Math.round(b.n.length/max*100):0}%"></div></div><div class="snum">${b.n.length}</div><div class="slbl">${b.k}</div></div>`).join('')}</div>
  <div class="clegend" style="margin-top:10px"><span>合計 ${total}名</span><span class="sp"></span>60日超 ${B[3].n.length+B[4].n.length}名（${Math.round((B[3].n.length+B[4].n.length)/total*100)}%）</div></div>`;
  const long=[...B[4].n,...B[3].n];
  if(long.length){
    h+=`<h2>長く話せていない方</h2>`;
    h+=long.slice(0,12).map(x=>`<div class="row ${x.g>=120?'due':''}" onclick="openStaffDetail('${x.p.id}')"><div class="time">${x.g>9000?'未':x.g+'日'}</div><div class="t"><div class="ttl">${esc(x.p.name)}<span class="pill">${esc(x.p.kind)}</span></div><div class="sub">${x.p.lastContact?'最後にお話ししたのは '+fmtMD(x.p.lastContact):'まだ記録がありません'}</div></div></div>`).join('');
  }
  h+=`<p class="small muted" style="margin-top:12px">平均では見えないものが、分布だと見えます。右側（濃い色）に人が溜まっていないかを見てください。</p>`;
  return h;
}

function isActive(p){return !p.retiredAt}
function isSelf(p){return !!(p&&p.self)}
function selfStaff(){return D.staff.find(isSelf)||null}
function setSelf(id){
  D.staff.forEach(p=>{if(p.id===id)p.self=true;else delete p.self});
  store.save();render();
  const p=D.staff.find(x=>x.id===id);
  toast((p?p.name:'')+'さんを「自分」として登録しました');
}
function clearSelf(id){
  const p=D.staff.find(x=>x.id===id);if(p)delete p.self;
  store.save();render();toast('「自分」の登録を外しました');
}
/** 面談などの対象になる人（退職者と自分を除く） */
function targetStaff(){return D.staff.filter(p=>isActive(p)&&!isSelf(p))}
function activeStaff(){return D.staff.filter(isActive)}
function retiredStaff(){return D.staff.filter(p=>!isActive(p))}
/** 勤務表に名前があるか（直近2か月） */
function inRecentShift(name){
  const ms=monthKeys(2);
  return ms.some(ym=>{
    const m=(D.shifts||{})[ym];
    if(!m)return false;
    const n=normName(name);
    return Object.keys(m).some(k=>normName(k)===n);
  });
}
function askRetire(id){
  const p=D.staff.find(x=>x.id===id);if(!p)return;
  openModal('<h3>退職として記録</h3>'
   +'<div class="hint">'+esc(p.name)+' さんを退職として記録します。<br>'
   +'名簿からは消えません。面談の記録も残ります。以後、提案や集計の対象から外れます。</div>'
   +'<div class="f"><label>最終出勤日（分かれば）</label><input id="rt-date" type="date" value="'+today()+'"></div>'
   +'<div class="foot"><button class="btn ghost" onclick="openStaffDetail(\''+id+'\')">やめる</button>'
   +'<button class="btn solid" onclick="doRetire(\''+id+'\')">記録する</button></div>');
}
function doRetire(id){
  const d=document.getElementById('rt-date').value||today();
  setRetired(id,d);closeModal();
}
function setRetired(id,date){
  const p=D.staff.find(x=>x.id===id);if(!p)return;
  p.retiredAt=date||today();
  store.save();render();toast(p.name+'さんを退職として記録しました');
}
function setReturned(id){
  const p=D.staff.find(x=>x.id===id);if(!p)return;
  delete p.retiredAt;
  store.save();render();toast(p.name+'さんを在籍に戻しました');
}
/** 勤務表から消えた人を見つける */
function goneFromShift(){
  const ms=monthKeys(3);
  if(!ms.slice(0,2).some(ym=>(D.shifts||{})[ym]))return [];
  return targetStaff().filter(p=>{
    // 3か月前にはいたのに、直近2か月にいない
    const old=(D.shifts||{})[ms[2]];
    if(!old)return false;
    const n=normName(p.name);
    const wasThere=Object.keys(old).some(k=>normName(k)===n);
    return wasThere&&!inRecentShift(p.name);
  });
}

/* ========== 話したいこと（スタッフごとのリスト） ========== */
function talkList(p){if(!p)return [];p.talk=p.talk||[];return p.talk}
function talkOpen(p){return talkList(p).filter(x=>!x.done)}
function addTalk(pid,text,src){
  const p=D.staff.find(x=>x.id===pid);if(!p)return;
  const v=String(text||'').trim();if(!v)return;
  v.split(/\r?\n/).map(s=>s.trim()).filter(Boolean).forEach(s=>{
    if(talkList(p).some(x=>!x.done&&x.t===s))return;
    talkList(p).push({id:uid(),t:s,at:new Date().toISOString(),src:src||'',done:false});
  });
  store.save();
}
function addTalkFromInput(pid){
  const el=document.getElementById('tk-new');
  if(!el||!el.value.trim()){toast('話したいことを入れてください');return}
  addTalk(pid,el.value);el.value='';
  const box=document.getElementById('talk-box');if(box)box.innerHTML=talkHtml(pid,true);
  toast('足しました');
}
function editTalk(pid,tid,ev){
  if(ev&&ev.stopPropagation)ev.stopPropagation();
  const p=D.staff.find(x=>x.id===pid);if(!p)return;
  const x=talkList(p).find(y=>y.id===tid);if(!x)return;
  const box=document.getElementById('talk-box');if(!box)return;
  const el=box.querySelector('[data-talk="'+tid+'"]');if(!el)return;
  el.innerHTML='<input class="tkedit" value="'+esc(x.t)+'" onkeydown="if(event.key===\'Enter\'){saveTalk(\''+pid+'\',\''+tid+'\',this.value)}if(event.key===\'Escape\'){renderTalkBox(\''+pid+'\')}" onblur="saveTalk(\''+pid+'\',\''+tid+'\',this.value)">';
  const inp=el.querySelector('input');inp.focus();inp.select();
}
function saveTalk(pid,tid,v){
  const p=D.staff.find(x=>x.id===pid);if(!p)return;
  const x=talkList(p).find(y=>y.id===tid);if(!x)return;
  v=String(v||'').trim();
  if(v&&v!==x.t){x.t=v;store.save()}
  renderTalkBox(pid);
}
function renderTalkBox(pid){const box=document.getElementById('talk-box');if(box)box.innerHTML=talkHtml(pid,true)}
function delTalk(pid,tid,ev){
  if(ev&&ev.stopPropagation)ev.stopPropagation();
  const p=D.staff.find(x=>x.id===pid);if(!p)return;
  p.talk=talkList(p).filter(x=>x.id!==tid);store.save();
  const box=document.getElementById('talk-box');if(box)box.innerHTML=talkHtml(pid,true);else render();
}
function talkHtml(pid,editable){
  const p=D.staff.find(x=>x.id===pid);if(!p)return '';
  const open=talkOpen(p);
  const done=talkList(p).filter(x=>x.done).slice(-5).reverse();
  let h='';
  if(open.length){
    h+=`<div class="stlist">${open.map(x=>`<div class="stitem talk" data-talk="${x.id}" ${editable?`onclick="editTalk('${pid}','${x.id}',event)" style="cursor:text"`:''}><span><b>${esc(x.t)}</b><small>${x.at?fmtMD(x.at.slice(0,10)).replace(/（.）/,''):''}${x.src?'　'+esc(x.src):''}${editable?'　タップで書き換え':''}</small></span>${editable?`<b class="tx" onclick="delTalk('${pid}','${x.id}',event)">×</b>`:''}</div>`).join('')}</div>`;
  }else h+=`<div class="empty small">まだありません。気づいたときに書き留めてください。</div>`;
  if(editable)h+=`<div class="thadd"><input id="tk-new" placeholder="話したいことを足す" onkeydown="if(event.key==='Enter'){addTalkFromInput('${pid}');event.preventDefault()}"><button class="btn small" onclick="addTalkFromInput('${pid}')">＋</button></div>`;
  if(done.length)h+=`<details style="margin-top:8px"><summary class="small muted">話した ${talkList(p).filter(x=>x.done).length}件</summary>${done.map(x=>`<div class="row" style="opacity:.6"><div class="time">${x.doneAt?fmtMD(x.doneAt.slice(0,10)).replace(/（.）/,''):''}</div><div class="t"><div class="sub">${esc(x.t)}</div></div></div>`).join('')}</details>`;
  return h;
}

/* 長押しの共通処理：カードを長押ししたら小窓を開く */
function bindLongPress(el,fn){
  let t=null,moved=false;
  const start=e=>{moved=false;t=setTimeout(()=>{t=null;if(!moved){
    window._suppressClick=true;setTimeout(()=>{window._suppressClick=false},900);   // 直後のタップを無効に
    if(navigator.vibrate)navigator.vibrate(15);fn()}},450)};
  const cancel=()=>{if(t){clearTimeout(t);t=null}};
  el.addEventListener('touchstart',start,{passive:true});
  el.addEventListener('touchmove',()=>{moved=true;cancel()},{passive:true});
  el.addEventListener('touchend',cancel);el.addEventListener('touchcancel',cancel);
  el.addEventListener('mousedown',e=>{if(e.button!==0)return;start(e)});
  el.addEventListener('mouseup',cancel);el.addEventListener('mouseleave',cancel);
  el.addEventListener('contextmenu',e=>{e.preventDefault();cancel();fn()});   // 右クリックでも
}
// 長押しの直後に来るクリックは飲み込む（小窓が別の画面に置き換わるのを防ぐ）
document.addEventListener('click',e=>{if(window._suppressClick){e.stopPropagation();e.preventDefault();window._suppressClick=false}},true);
function bindTalkLongPress(){
  document.querySelectorAll('[data-talk-pid]').forEach(el=>{
    if(el._lp)return;el._lp=true;
    bindLongPress(el,()=>openQuickTalk(el.dataset.talkPid));
  });
}

/* ========== 委任の記録と分析 ========== */
function delegLog(){D.delegations=D.delegations||[];return D.delegations}
function delegOf(name,days){
  const from=days?addDays(today(),-days):'';
  return delegLog().filter(x=>x.to===name&&(!from||(x.at||'').slice(0,10)>=from));
}
function delegStats(days){
  days=days||89;
  const from=addDays(today(),-days);
  const a=delegLog().filter(x=>(x.at||'').slice(0,10)>=from);
  const by={};
  a.forEach(x=>{
    const k=x.to||'（不明）';
    by[k]=by[k]||{n:0,done:0,late:0,days:[],outside:!resolveStaff(k)};
    by[k].n++;
    if(x.doneAt){
      by[k].done++;
      if(x.due&&x.doneAt>x.due)by[k].late++;
      if(x.due)by[k].days.push(diffDays(x.at.slice(0,10),x.doneAt));
    }
  });
  Object.keys(by).forEach(k=>{
    const o=by[k];
    o.rate=o.n?Math.round(o.done/o.n*100):0;
    o.onTime=o.done?Math.round((o.done-o.late)/o.done*100):null;
    o.avgDays=o.days.length?(o.days.reduce((s,v)=>s+v,0)/o.days.length):null;
  });
  return {list:a,by};
}
/** 任せていない人（社内のみ） */
function neverDelegated(days){
  const s=delegStats(days);
  return targetStaff().filter(p=>!s.by[p.name]);
}
function vDeleg(){
  const s=delegStats(89);
  const names=Object.keys(s.by).sort((a,b)=>s.by[b].n-s.by[a].n);
  const inside=names.filter(n=>!s.by[n].outside);
  const outside=names.filter(n=>s.by[n].outside);
  const tot=s.list.length;
  const done=s.list.filter(x=>x.doneAt).length;
  const open=D.tasks.filter(t=>t.status==='delegated').length;
  let h=`<h2>お任せした記録（90日）</h2>`;
  if(!tot)return h+`<div class="empty">まだ記録がありません。<br><span class="small">DESKで案件を「人に振る」と、ここに溜まります。</span></div>`;
  h+=`<div class="condbox"><div class="cnums">
    <div><b>${tot}</b><span>お任せした件数</span></div>
    <div><b>${inside.length}</b><span>お任せした人数</span></div>
    <div><b>${open}</b><span>いま依頼中</span></div>
  </div>
  <div class="clegend" style="margin-top:10px"><span>戻ってきた ${done}件（${tot?Math.round(done/tot*100):0}％）${D.staff.length?`　／　名簿 ${D.staff.length}名のうち ${inside.length}名に`:''}</span></div></div>`;
  const row=(n,o)=>{
    const pct=Math.max(4,Math.min(100,o.n*12));
    return `<div class="row ${o.outside?'':'person'}" ${(()=>{const p=resolveStaff(n);return p?`onclick="openStaffDetail('${p.id}')"`:''})()}>
      <div class="t"><div class="ttl">${esc(n)}${o.outside?'<span class="pill">社外・他部署</span>':''}<span class="pill">${o.n}件</span></div>
      <div class="dbar"><span style="width:${pct}%"></span></div>
      <div class="sub">${o.done}件が完了${o.onTime!==null?`　期限内 ${o.onTime}％`:''}${o.avgDays!==null?`　平均 ${o.avgDays.toFixed(1)}日`:''}</div></div></div>`;
  };
  if(inside.length){h+=`<h2>スタッフ</h2>`+inside.map(n=>row(n,s.by[n])).join('')}
  if(outside.length){h+=`<h2>他部署・社外</h2>`+outside.map(n=>row(n,s.by[n])).join('')}
  // 偏りの指摘
  if(inside.length&&D.staff.length){
    const top=inside[0];
    const share=s.by[top]?Math.round(s.by[top].n/tot*100):0;
    if(share>=40&&tot>=5)h+=`<div class="warn"><b>${esc(top)}さんに${share}％が集まっています。</b><br>負担が偏っていないか、他に任せられる方がいないかご確認を。</div>`;
    const never=neverDelegated(89);
    if(never.length)h+=`<div class="warn"><b>90日間、一度もお任せしていない方が${never.length}名</b><br>${never.slice(0,8).map(p=>esc(p.name)).join('　')}${never.length>8?' ほか':''}<br><span class="small">任せることは、信頼を示すことでもあります。</span></div>`;
  }
  h+=`<h2>これまでの記録</h2>`;
  h+=s.list.slice().reverse().slice(0,12).map(x=>`<div class="row ${x.doneAt?'':'due'}"><div class="time">${fmtMD(x.at.slice(0,10)).replace(/（.）/,'')}</div><div class="t"><div class="ttl">${esc(x.title)}</div><div class="sub">${x.handoffFrom?esc(x.handoffFrom)+'さんから ':''}${esc(x.to)}さんへ${x.due?'　期限 '+fmtMD(x.due).replace(/（.）/,''):''}${x.handedOff?'　→ '+esc(x.handedOff)+'さんへ引き継ぎ':x.takenBack?'　→ 引き取り':x.doneAt?'　→ 完了 '+fmtMD(x.doneAt).replace(/（.）/,''):'　→ 依頼中'}</div></div></div>`).join('');
  return h;
}


/* ===== 予定の削除・キャンセル（理由つきで記録） ===== */
const CANCEL_REASONS={
  cancel:['相手の都合','会議が中止・延期','急な割り込み','体調・気力','優先度が下がった','その他'],
  delete:['重複・入力ミス','不要になった','自分でやめた','その他']
};
function cancelLog(){D.cancels=D.cancels||[];return D.cancels}
function openCancelEvent(id,kind){
  const e=D.events.find(x=>x.id===id);if(!e)return;
  const isDel=kind==='delete';
  openModal('<h3>'+(isDel?'予定を削除する':'予定をキャンセルする')+'</h3>'
   +'<div class="hint">'+esc(e.title)+'　'+fmtMD(e.date)+(e.start?' '+e.start:'')+'<br>'
   +(isDel?'記録からも消えます。理由だけ残ります。':'予定は「キャンセル」として残ります。')+'</div>'
   +'<div class="f"><label>理由</label><div class="rsreason">'+CANCEL_REASONS[kind].map(r=>'<button class="btn ghost small" onclick="pickCancelReason(this)">'+esc(r)+'</button>').join('')+'</div></div>'
   +'<div class="f"><label>ひとこと（任意）</label><input id="cx-note" placeholder="補足があれば"></div>'
   +'<div class="foot"><button class="btn ghost" onclick="closeModal()">やめる</button><button class="btn solid" onclick="doCancelEvent(\''+id+'\',\''+kind+'\')">'+(isDel?'削除する':'キャンセルにする')+'</button></div>');
  window._cxReason='';
}
function pickCancelReason(b){window._cxReason=b.textContent;document.querySelectorAll('.rsreason .btn').forEach(x=>x.classList.toggle('on',x===b))}
function doCancelEvent(id,kind){
  const e=D.events.find(x=>x.id===id);if(!e)return;
  const reason=window._cxReason||'';
  if(!reason){toast('理由を選んでください');return}
  const note=(document.getElementById('cx-note')||{}).value||'';
  cancelLog().push({id:uid(),at:new Date().toISOString(),kind,reason,note:note.trim(),
    title:e.title,cat:e.cat,date:e.date,staffName:e.staffName||'',lead:diffDays(today(),e.date)});
  if(kind==='delete'){
    if(e.gcalId){D.eventDeleted=D.eventDeleted||[];if(!D.eventDeleted.includes(e.gcalId))D.eventDeleted.push(e.gcalId)}
    D.events=D.events.filter(x=>x.id!==id);
  }else{
    e.cancelled=true;e.cancelledAt=new Date().toISOString();e.cancelReason=reason;e.cancelBy='self';
  }
  closeModal();store.save();render();toast(kind==='delete'?'削除しました':'キャンセルにしました');
}
/* 分析：直近の削除・キャンセルの傾向 */
function cancelStats(days){
  const from=addDays(today(),-(days||29));
  const a=cancelLog().filter(x=>(x.at||'').slice(0,10)>=from);
  const cancel=a.filter(x=>x.kind==='cancel'), del=a.filter(x=>x.kind==='delete');
  const byReason={};a.forEach(x=>{byReason[x.reason]=(byReason[x.reason]||0)+1});
  const self=a.filter(x=>/体調|気力|自分でやめた|優先度/.test(x.reason)).length;   // 自分側の理由
  const people=a.filter(x=>x.cat==='人').length;                                    // 人の枠を消した数
  return {all:a,cancel:cancel.length,del:del.length,byReason,self,people};
}

/* ===== リスケ（予定の組み直し） ===== */
const RS_REASONS={

function rescheduleLog(){D.reschedule=D.reschedule||[];return D.reschedule}
function openReschedule(kind,id){

}
function doReschedule(kind,id){

/* ===== リスケの傾向 ===== */
function rsStats(days){
  const from=addDays(today(),-(days||29));
  const a=rescheduleLog().filter(x=>x.at&&x.at.slice(0,10)>=from);
  const plus=a.filter(x=>x.kind==='plus'), minus=a.filter(x=>x.kind==='minus');
  const byReason={};
  minus.forEach(x=>{if(x.reason)byReason[x.reason]=(byReason[x.reason]||0)+1});

}
/** 面談を何度も動かされている人 */
function movedOften(name){
  const a=rescheduleLog().filter(x=>x.staffName===name&&x.kind==='minus');
