}
function vResched(){
  const s=rsStats(60);
  let h=`<h2>組み直しの記録（60日）</h2>`;
  if(!s.all.length&&!cancelLog().length)return h+`<div class="empty">まだ記録がありません。<br><span class="small">予定や案件を組み直すと、理由とあわせて残ります。</span></div>`;
  if(!s.all.length){h=`<h2>組み直しの記録（60日）</h2><div class="empty">組み直しはまだありません。</div>`;}
  const tot=s.plus+s.minus;
  const pp=tot?Math.round(s.plus/tot*100):0;
  h+=`<div class="condbox"><div class="cnums">
    <div><b>${tot}</b><span>組み直し</span></div>
    <div><b>${s.plus}</b><span>前向き</span></div>
    <div><b>${s.minus}</b><span>やむを得ず</span></div>
  </div><div class="cbar" style="margin-top:10px">${s.plus?`<div class="cseg c1" style="flex:${s.plus}"><span>${pp}%</span></div>`:''}${s.minus?`<div class="cseg c5" style="flex:${s.minus}"><span>${100-pp}%</span></div>`:''}</div>
  <div class="clegend" style="margin-top:8px"><span><i class="c1"></i>前向き</span><span><i class="c5"></i>やむを得ず</span></div></div>`;
  const rs=Object.keys(s.byReason).sort((a,b)=>s.byReason[b]-s.byReason[a]);
  if(rs.length){

    h+=rs.map(r=>`<div class="row"><div class="t"><div class="ttl">${esc(r)}<span class="pill">${s.byReason[r]}回</span></div></div></div>`).join('');
    const top=rs[0];

  }
  const st=Object.keys(s.byStaff).filter(k=>s.byStaff[k]>=2).sort((a,b)=>s.byStaff[b]-s.byStaff[a]);
  if(st.length){
    h+=`<h2>予定を動かしてしまった方</h2><p class="small muted">こちらの都合で面談を動かすと、相手は「後回しにされた」と感じることがあります。</p>`;
    h+=st.map(n=>{const p=resolveStaff(n);return `<div class="row person" ${p?`onclick="openStaffDetail('${p.id}')"`:''}><div class="t"><div class="ttl">${esc(n)}<span class="pill">${s.byStaff[n]}回</span></div><div class="sub">次はこちらから日を合わせにいきましょう</div></div></div>`}).join('');
  }
  {
    const cx=cancelStats(60);
    if(cx.all.length){
      h+=`<h2>取りやめた予定（60日）</h2>`;
      h+=cx.all.slice().reverse().slice(0,10).map(x=>`<div class="row ${x.kind==='delete'?'':'due'}"><div class="time">${fmtMD(x.at.slice(0,10)).replace(/（.）/,'')}</div><div class="t"><div class="ttl">${x.kind==='delete'?'削除':'キャンセル'}　${esc(x.title)}</div><div class="sub">${esc(x.reason)}${x.note?'　'+esc(x.note):''}${x.staffName?'　'+esc(x.staffName)+'さん':''}</div></div></div>`).join('');
    }
  }
  h+=`<h2>これまでの記録</h2>`;
  h+=s.all.slice().reverse().slice(0,12).map(x=>`<div class="row ${x.kind==='minus'?'due':''}"><div class="time">${fmtMD(x.at.slice(0,10)).replace(/（.）/,'')}</div><div class="t"><div class="ttl">${x.kind==='plus'?'＋':'−'} ${esc(x.title)}</div><div class="sub">${esc(x.reason||'')}${x.note?'　'+esc(x.note):''}　${x.from?fmtMD(x.from).replace(/（.）/,'')+' → '+fmtMD(x.to).replace(/（.）/,''):''}</div></div></div>`).join('');
  return h;
}

}
function themeStat(e){const a=themeList(e);return {n:a.length,done:a.filter(x=>x.done).length}}
function ensureThemes(e){if(!Array.isArray(e.themes))e.themes=themeList(e);return e.themes}

/** 文章からチェックリストを拾う（☑ ・ - [ ] □ 1. など） */
function extractChecks(text){
  const out=[];
  String(text||'').split(/\r?\n/).forEach(line=>{
    const s=line.trim();
    if(!s)return;
    // 行頭の印を見て、箇条書きだけを拾う
    // 行頭の印（-, ・, ☑, [x], 1. など。組み合わせにも対応）
    const m=s.match(/^(?:(?:[-–—*・●○]|\d+[\.)、])\s*)?(?:([☑☐✓✔□■◻◼])|\[([ xX]?)\])?\s*(.+)$/);
    if(!m)return;
    const mark=m[1]||'', box=m[2], body=(m[3]||'').trim();
    const hadMark=!!(m[1]||m[2]!==undefined)||/^(?:[-–—*・●○]|\d+[\.)、])/.test(s);
    if(!hadMark||body.length<2)return;
    out.push({t:body,done:/[☑✓✔■◼]/.test(mark)||/[xX]/.test(box||'')});
  });
  return out;
}

  const e=D.events.find(x=>x.id===evId);if(!e)return;
  const found=extractChecks(e.memo||'');
  openModal('<h3>手順を足す</h3><div class="hint">'+esc(e.title)+'<br>1行に1つ。まとめて書けます。</div>'
   +(found.length?'<div class="warn">メモの中に'+found.length+'件のリストが見つかりました。<div style="margin-top:8px"><button class="btn small" onclick="useMemoChecks(\''+evId+'\')">メモから取り込む</button></div></div>':'')
   +'<div class="f"><textarea id="ep-t" style="min-height:120px" placeholder="例：\n資料を印刷する\n前回の議事録を確認\n会議室の鍵を借りる"></textarea></div>'

function useMemoChecks(evId){
  const e=D.events.find(x=>x.id===evId);if(!e)return;

}



/* ===== ドラッグで並べ替え（つまみを長押し→上下に動かす） ===== */
let DRAG=null;
function dragStart(ev,kind,ownerId,itemId){
  const el=ev.currentTarget.closest('[data-drag]');
  if(!el)return;
  const list=el.parentElement;
  const start=()=>{
    DRAG={kind,ownerId,itemId,el,list,y:0};
    el.classList.add('dragging');
    document.body.classList.add('nodrag-scroll');
    const r=el.getBoundingClientRect();DRAG.h=r.height;DRAG.y0=(ev.touches?ev.touches[0].clientY:ev.clientY);
  };
  if(ev.touches){
    // 長押し（250ms）で開始。指が動いたら普通のスクロールとして扱う
    let moved=false;
    const t0=setTimeout(()=>{if(!moved)start()},250);
    const mv=e=>{if(!DRAG){if(Math.abs((e.touches[0].clientY)-(ev.touches[0].clientY))>8){moved=true;clearTimeout(t0)}}else{e.preventDefault();dragMove(e)}};
    const up=()=>{clearTimeout(t0);document.removeEventListener('touchmove',mv);document.removeEventListener('touchend',up);dragEnd()};
    document.addEventListener('touchmove',mv,{passive:false});
    document.addEventListener('touchend',up);
  }else{
    ev.preventDefault();start();
    const mv=e=>dragMove(e);
    const up=()=>{document.removeEventListener('mousemove',mv);document.removeEventListener('mouseup',up);dragEnd()};
    document.addEventListener('mousemove',mv);
    document.addEventListener('mouseup',up);
  }
}
function dragMove(e){
  if(!DRAG)return;
  const y=(e.touches?e.touches[0].clientY:e.clientY);
  DRAG.el.style.transform='translateY('+(y-DRAG.y0)+'px)';
  // 隣の要素の中心を越えたら入れ替える
  const items=[...DRAG.list.children].filter(x=>x.dataset&&x.dataset.drag);
  const idx=items.indexOf(DRAG.el);
  const r=DRAG.el.getBoundingClientRect();
  const cy=r.top+r.height/2;
  if(idx>0){const p=items[idx-1].getBoundingClientRect();if(cy<p.top+p.height/2){DRAG.list.insertBefore(DRAG.el,items[idx-1]);DRAG.y0=y;DRAG.el.style.transform='';return}}
  if(idx<items.length-1){const n=items[idx+1].getBoundingClientRect();if(cy>n.top+n.height/2){DRAG.list.insertBefore(items[idx+1],DRAG.el);DRAG.y0=y;DRAG.el.style.transform='';return}}
}
function dragEnd(){
  if(!DRAG)return;
  const {kind,ownerId,list}=DRAG;
  DRAG.el.classList.remove('dragging');DRAG.el.style.transform='';
  document.body.classList.remove('nodrag-scroll');
  const ids=[...list.children].filter(x=>x.dataset&&x.dataset.drag).map(x=>x.dataset.drag);
  DRAG=null;
  // 画面の並びをデータに反映
  if(kind==='task'){
    ids.forEach((id,i)=>{const t=D.tasks.find(x=>x.id===id);if(t)t.order=i});
  }else if(kind==='step'){
    const t=D.tasks.find(x=>x.id===ownerId);if(t&&t.steps)t.steps.sort((a,b)=>ids.indexOf(a.id)-ids.indexOf(b.id));
  }else if(kind==='evstep'){
    const e=D.events.find(x=>x.id===ownerId);if(e&&e.steps)e.steps.sort((a,b)=>ids.indexOf(a.id)-ids.indexOf(b.id));
  }
  store.save();render();
}
function grip(kind,ownerId,itemId){
  return `<span class="grip" title="長押しして動かす" onmousedown="dragStart(event,'${kind}','${ownerId}','${itemId}')" ontouchstart="dragStart(event,'${kind}','${ownerId}','${itemId}')" onclick="event.stopPropagation()">≡</span>`;
}

/* ===== 並べ替え（案件・手順） ===== */
function moveInArray(arr,idx,dir){
  const j=idx+dir;
  if(idx<0||j<0||j>=arr.length)return false;
  const t=arr[idx];arr[idx]=arr[j];arr[j]=t;return true;
}
/* 案件の順番：手動の並び順を持つ（無ければ従来どおり） */
function taskOrder(t){return typeof t.order==='number'?t.order:1e9}
function resetTaskOrder(){D.tasks.forEach(t=>delete t.order);sortMode=false;store.save();render();toast('自動の順に戻しました')}
function moveTask(id,dir,ev){
  if(ev&&ev.stopPropagation)ev.stopPropagation();
  const list=openTasks().slice().sort((a,b)=>taskOrder(a)-taskOrder(b)||(a.createdAt||'').localeCompare(b.createdAt||''));
  list.forEach((t,i)=>t.order=i);          // いったん現在の並びを確定
  const i=list.findIndex(t=>t.id===id);
  if(!moveInArray(list,i,dir))return;
  list.forEach((t,k)=>t.order=k);
  store.save();render();
}
/* 手順の順番 */
function moveStep(taskId,sid,dir,ev){
  if(ev&&ev.stopPropagation)ev.stopPropagation();
  const t=D.tasks.find(x=>x.id===taskId);if(!t||!t.steps)return;
  const i=t.steps.findIndex(s=>s.id===sid);
  if(!moveInArray(t.steps,i,dir))return;
  store.save();render();
}
function moveEvStep(evId,sid,dir,ev){
  if(ev&&ev.stopPropagation)ev.stopPropagation();
  const e=D.events.find(x=>x.id===evId);if(!e||!e.steps)return;
  const i=e.steps.findIndex(s=>s.id===sid);
  if(!moveInArray(e.steps,i,dir))return;
  store.save();render();
}

function saveReport(evId){
  const e=D.events.find(x=>x.id===evId);
  const body=document.getElementById('rp-body').value.trim();
  let next=document.getElementById('rp-next').value.trim();
  // 話せたテーマは「話したいこと」から消す（記録には残す）
  {
    const p0=D.staff.find(x=>x.id===e.staffId)||(e.staffName?resolveStaff(e.staffName):null);
    if(p0){
      themeList(e).forEach(x=>{
        const tk=talkList(p0).find(y=>(x.talkId&&y.id===x.talkId)||(!y.done&&y.t===x.t));
        if(tk){ if(x.done){tk.done=true;tk.doneAt=new Date().toISOString();tk.evId=e.id} }
        else if(!x.done){ talkList(p0).push({id:uid(),t:x.t,at:new Date().toISOString(),src:'話せなかった',done:false}) }
      });
    }
  }
  // 話せなかったテーマは次回へ持ち越す
  const rest=themeList(e).filter(x=>!x.done).map(x=>x.t);
  e.carryOver=rest;
  if(rest.length){
    const add=rest.map(s=>'（持ち越し）'+s).join('\n');
    next=next?next+'\n'+add:add;
  }
  e.report=body;e.nextTask=next;e.cond=window._cond||e.cond||0;e.reportedAt=new Date().toISOString();
  const p=D.staff.find(x=>x.id===e.staffId)||D.staff.find(x=>x.name===e.staffName);
  if(p){
    p.lastContact=e.date>today()?p.lastContact:e.date;
    if(!p.lastContact||e.date>p.lastContact)p.lastContact=e.date<=today()?e.date:p.lastContact;
    p.homework=next;
    if(e.cond){p.conditions=p.conditions||[];
      const ix=p.conditions.findIndex(c=>c.d===e.date);
      const rec={d:e.date,v:e.cond,note:body.slice(0,120)};
      if(ix>=0)p.conditions[ix]=rec;else{p.conditions.push(rec);p.conditions.sort((a,b)=>a.d.localeCompare(b.d))}}
  }
  closeModal();store.save();render();
  toast(rest.length?'記録しました（'+rest.length+'件を次回へ持ち越し）':'面談を記録しました');
}

function rowsToDuty(rows){
  rows=(rows||[]).map(r=>(r||[]).map(c=>String(c==null?'':c).trim()));
  // 見出し行＝日付らしい語を含む行、なければ1行目
  let head=0;
  for(let i=0;i<Math.min(rows.length,5);i++){if((rows[i][0]||'').match(/日付|日にち|date/i)){head=i;break}}
  const labels=(rows[head]||[]).slice(1).map((v,i)=>v||('枠'+(i+1)));
  const map={};let count=0;
  for(let i=head+1;i<rows.length;i++){
    const r=rows[i];const key=normDate(r[0]);
    if(!key)continue;
    const o={};let any=false;
    labels.forEach((lb,j)=>{const v=(r[j+1]||'').trim();if(v){o[lb]=v;any=true}});
    if(any){map[key]=o;count++}
  }
  return {map,count,slots:labels.filter(Boolean)};
}

const OFF_CODES=['休','休み','★','有','有休','夏季有休','ぐ～休','ぐ〜休','CUE','cue','Cue','公','公休','年休','×','x','X','ー','-','―','','法','明'];

function shiftRaw(name,date){
  const ym=date.slice(0,7);const d=String(Number(date.slice(8,10)));

function colName(c){return c<26?String.fromCharCode(65+c):String.fromCharCode(64+Math.floor(c/26))+String.fromCharCode(65+c%26)}
/** 表の行データから「氏名＋1日〜31日」の形を探し出す */
function rowsToShift(rows,override){
  rows=(rows||[]).map(r=>(r||[]).map(c=>String(c==null?'':c).replace(/\u3000/g,' ').trim()));
  // 1) 日付の見出し行を探す（1,2,3… が並ぶ行。1〜31の連番であればよい）
  let headIx=-1,dayCol=-1,bestRun=0;
  for(let i=0;i<Math.min(rows.length,20);i++){
    const r=rows[i];
    for(let c=0;c<Math.min(r.length,10);c++){
      let ok=0;
      for(let k=0;k<12;k++){
        const v=r[c+k];if(v===undefined)break;
        const n=String(v).match(/(\d{1,2})/);
        if(n&&Number(n[1])===k+1)ok++;else break;
      }
      if(ok>bestRun&&ok>=7){bestRun=ok;headIx=i;dayCol=c}
    }
  }
  // 2) 氏名の列を推定
  let nameCol=0;
  {
    const limit=dayCol>0?dayCol:Math.min(6,Math.max(...rows.map(r=>r.length),1));
    let best=-1,bestN=0;
    for(let c=0;c<limit;c++){
      let n=0;
      rows.forEach((r,i)=>{
        if(i===headIx)return;
        const v=r[c]||'';
        if(!v||v.length>14)return;
        if(/^[\d\.\-\/\s]+$/.test(v))return;
        if(/[ぁ-んァ-ヶ一-龠]/.test(v)||/^[A-Za-z\s]+$/.test(v))n++;
      });
      if(n>bestN){bestN=n;best=c}
    }
    if(best>=0&&bestN>=2)nameCol=best;
  }
  if(dayCol<0)dayCol=nameCol+1;
  // 3) 手動指定で上書き
  if(override){
    if(override.nameCol!=null)nameCol=override.nameCol;
    if(override.dayCol!=null)dayCol=override.dayCol;
    if(override.headIx!==undefined)headIx=override.headIx===null?-1:override.headIx;
  }
  // 4) 月の推定
  let ym=null;
  outer:for(let i=0;i<Math.min(rows.length,12);i++){
    for(const v0 of rows[i]){
      const v=String(v0||'').normalize('NFKC');
      let m=v.match(/(20\d{2})\s*[年\/\-\.]\s*(\d{1,2})/);
      if(m){ym=m[1]+'-'+String(m[2]).padStart(2,'0');break outer}
      m=v.match(/(?:令和|R)\s*(\d{1,2})\s*[年\.\/\-]\s*(\d{1,2})\s*月?/);
      if(m){ym=(2018+Number(m[1]))+'-'+String(m[2]).padStart(2,'0');break outer}
      m=v.match(/^(\d{1,2})\s*月/);
      if(m){const y=new Date().getFullYear();ym=y+'-'+String(m[1]).padStart(2,'0');break outer}
    }
  }
  // 5) データ行を抽出
  const NG=/^(氏名|名前|スタッフ|社員|従業員|№|No\.?|備考|区分|所属|曜日|日付)$/i;
  const NGP=/^\s*(合計|総計|小計|計|人数|以上)/;
  const lines=[];
  const start=headIx>=0?headIx+1:0;
  for(let i=start;i<rows.length;i++){
    const r=rows[i];
    const name=(r[nameCol]||'').trim();
    if(!name||NG.test(name)||NGP.test(name))continue;
    if(/^[\d\.\-\/\s]+$/.test(name))continue;
    const cells=[];
    for(let d=0;d<31;d++)cells.push((r[dayCol+d]||'').trim());
    if(cells.filter(Boolean).length<3)continue;
    lines.push([name,...cells].join('\t'));
  }
  return {lines,ym,headIx,nameCol,dayCol};
}

function doShiftImport(){
  const ym=document.getElementById('sh-ym').value;
  if(!ym){toast('対象の月を選んでください');return}
  const raw=document.getElementById('sh-text').value.split(/\r?\n/).filter(l=>l.trim());
  const parsed=rowsToShift(raw.map(l=>l.split(/\t|,/)));
  const lines=parsed.lines.length?parsed.lines:raw;
  const map={};let n=0,unknown=[];
  lines.forEach(l=>{
    const c=l.split(/\t|,/);
    const name=(c[0]||'').trim();
    if(!name||/^(氏名|名前|スタッフ|№|No)$/i.test(name))return;
    const row={};
    for(let i=1;i<c.length&&i<=31;i++)row[String(i)]=(c[i]||'').trim();
    map[name]=row;n++;
    if(!resolveStaff(name))unknown.push(name);
  });
  if(!n){toast('読み取れる行がありませんでした');return}
  // 名簿と照合して、可能なものは名簿の表記に揃える
  const fixed={},unresolved=[];
  Object.keys(map).forEach(k=>{
    const p=resolveStaff(k);
    if(p)fixed[p.name]=Object.assign(fixed[p.name]||{},map[k]);
    else{fixed[k]=map[k];unresolved.push(k)}
  });
  D.shifts=D.shifts||{};D.shifts[ym]=fixed;
  store.save({silent:true});render();
  if(unresolved.length){toast(n+'名分を取り込みました');openMatchModal(unresolved,()=>{
    // 別名が決まったら、その月のデータを名簿の表記に付け替える
    const m2=D.shifts[ym],out={};

function vShiftDay(date){
  const w=workingOn(date);
  if(w===null)return `<div class="empty">${date.slice(0,7)}の勤務表がまだありません。<div style="margin-top:10px"><button class="btn small" onclick="openShiftModal()">勤務表を取り込む</button></div></div>`;
  if(!w.length)return `<div class="empty">この日の出勤者はいません。</div>`;
  const t=today();
  const info=x=>{
    const gap=x.p.lastContact?diffDays(x.p.lastContact,t):null;
    const target=x.p.contactDays||KIND_DAYS[x.p.kind]||90;
    return {gap,over:gap===null||gap>target,sc:staffScore(x.p)};
  };
  const list=w.map(x=>({...x,...info(x)}));
  const over=list.filter(x=>x.over).length;
  const me0=selfStaff();
  const myInfo=me0?shiftInfo(me0.name,date):null;
  const myRaw=me0?shiftRaw(me0.name,date):null;
  let h='';
  const sum=`<span class="wsum2"><span class="wsn"><b>${w.length}</b>名出勤</span>${over?`<span class="wso"><b>${over}</b>名と未接触</span>`:''}</span>`;
  if(me0&&myRaw!==null){
    const off0=isOff(myInfo?myInfo.l:'');
    h+=`<div class="myshift ${off0?'off':''}"><span class="ml">自分の勤務</span><b>${off0?'お休み':esc(myInfo.l||'')}</b>${!off0&&myInfo.s?`<span class="mt">${esc(myInfo.s)}</span>`:''}${!off0&&myInfo.p?`<span class="mp2">${esc(myInfo.p)}</span>`:''}${sum}</div>`;
  }else{
    h+=`<div class="myshift"><span class="sp"></span>${sum}</div>`;
  }
  h+=`<div class="toolbar"><span class="sp"></span><span class="sp"></span>
    <div class="seg"><button class="${shiftView==='pri'?'on':''}" onclick="shiftView='pri';render()">優先順</button><button class="${shiftView==='code'?'on':''}" onclick="shiftView='code';render()">区分順</button></div></div>`;
  const chip=x=>{
    const inf=shiftInfo(x.p.name,date)||{l:x.code,s:'',p:''};
    return `<button class="wchip ${x.over?'over':''} ${isSelf(x.p)?'self':''}" data-talk-pid="${x.p.id}" onclick="onCardTap('${x.p.id}','${date}')">
    <span class="wtxt"><span class="wn">${isSelf(x.p)?'<i class="mytag">自分</i>':''}${esc(x.p.name)}</span>${inf.p?`<span class="wp">${esc(inf.p)}</span>`:''}</span>
    <span class="wcol"><span class="wc">${esc(inf.l||x.code)}</span>${inf.s?`<span class="ws">${esc(inf.s)}</span>`:''}</span>
    ${x.over?`<span class="wg">${x.gap===null?'未':x.gap+'日'}</span>`:''}
    ${talkOpen(x.p).length?`<span class="wt">話${talkOpen(x.p).length}</span>`:''}
  </button>`};
  if(shiftView==='pri'){
    list.sort((a,b)=>{
      if(isSelf(a.p))return -1;            // 自分はいつでも先頭
      if(isSelf(b.p))return 1;
      return b.sc-a.sc;
    });
    h+=`<div class="wgrid">${list.map(chip).join('')}</div>`;
  }else{
    const me=list.find(x=>isSelf(x.p));
    if(me)h+=`<div class="wgrp"><div class="wghd">自分<span>1</span></div><div class="wgrid">${chip(me)}</div></div>`;
    const by={};list.filter(x=>!isSelf(x.p)).forEach(x=>{(by[x.code]=by[x.code]||[]).push(x)});
    h+=Object.keys(by).sort((a,b)=>by[b].length-by[a].length||a.localeCompare(b))
      .map(code=>`<div class="wgrp"><div class="wghd">${esc(code)}<span>${by[code].length}</span></div><div class="wgrid">${by[code].map(chip).join('')}</div></div>`).join('');
  }
  return h;
}

/* ========== コンディションの見える化 ========== */
function condSpark(p,w,hh){
  const c=(p.conditions||[]).slice(-8);
  if(c.length<2)return '';
  w=w||120;hh=hh||30;
  const step=c.length>1?w/(c.length-1):w;
  const y=v=>hh-2-((5-v)/4)*(hh-6);
  const pts=c.map((x,i)=>`${(i*step).toFixed(1)},${y(x.v).toFixed(1)}`).join(' ');
  const dots=c.map((x,i)=>`<circle cx="${(i*step).toFixed(1)}" cy="${y(x.v).toFixed(1)}" r="${i===c.length-1?3.2:2}" fill="var(--c${x.v})"/>`).join('');
  return `<svg class="spark" viewBox="0 0 ${w} ${hh}" preserveAspectRatio="none"><polyline points="${pts}" fill="none" stroke="var(--rule)" stroke-width="1.5"/>${dots}</svg>`;
}
function condStats(){
  const n=[0,0,0,0,0,0];let rec=0;
  targetStaff().forEach(p=>{const v=lastCond(p);if(v){n[v]++;rec++}});
  return {n,rec,total:targetStaff().length};
}
function condBar(){
  const s=condStats();if(!s.rec)return '';
  const seg=[1,2,3,4,5].map(v=>s.n[v]?`<div class="cseg c${v}" style="flex:${s.n[v]}" title="${v}：${s.n[v]}名"><span>${s.n[v]}</span></div>`:'').join('');
  const cov=Math.round(s.rec/Math.max(1,s.total)*100);
  const t=today();
  const long=targetStaff().filter(p=>!p.lastContact||diffDays(p.lastContact,t)>=90).length;
  const down=D.staff.filter(p=>{const c=p.conditions||[];return c.length>=2&&c[c.length-1].v>c[c.length-2].v}).length;
  return `<div class="condbox">
    <div class="cbar">${seg}</div>
    <div class="clegend"><span><i class="c1"></i>良好</span><span><i class="c3"></i>ふつう</span><span><i class="c5"></i>要注意</span><span class="sp"></span>記録あり ${s.rec}/${s.total}名（${cov}%）</div>
    <div class="cnums">
      <div><b>${down}</b><span>下降中</span></div>
      <div><b>${long}</b><span>90日以上未接触</span></div>
      <div><b>${D.staff.filter(p=>{const r=p.renewalDate?diffDays(t,p.renewalDate):null;return r!==null&&r>=0&&r<=renewalLead(p)}).length}</b><span>更新が近い</span></div>
    </div></div>`;
}

  try{
    const j=await store.checkForm();
    if(!j.ok){box.innerHTML='<div class="warn"><b>つながりません</b><br>'+esc(j.error||'')+'</div>';return}
    box.innerHTML='<div class="warn"><b>'+esc(j.title)+'</b><br>'+
      j.sheets.map(s=>esc(s.name)+'：'+s.rows+'行 × '+s.cols+'列').join('<br>')+
      '<br><span class="small">回答が入っているシートの行数が2以上あれば取り込めます</span></div>';
  }catch(e){box.innerHTML='<div class="warn"><b>確認できませんでした</b><br>'+esc(e.message)+'</div>'}
}
function saveSettings(){
  const g=i=>document.getElementById(i).value;const lines=i=>g(i).split(/\r?\n/).map(x=>x.trim()).filter(Boolean);
  Object.assign(D.settings,{gasUrl:g('s-gas').trim(),myEmail:g('s-me').trim(),vip:lines('s-vip'),exclude:lines('s-ex'),deadlineWords:lines('s-dw'),icsUrls:lines('s-ics'),formSheetUrl:g('s-fsheet').trim(),forwardTo:g('s-fwd').trim(),forwardLabel:g('s-flabel').trim(),roomTo:g('s-rto').trim(),roomCc:g('s-rcc').trim(),roomSubject:g('s-rsub'),roomBody:g('s-rbody'),fetchDays:Number(g('s-fd'))||2,calDays:Number(g('s-cd2'))||30,weeklyGoal:Number(g('s-goal'))||0});
  store.save();
}
function exportData(){const b=new Blob([JSON.stringify(D,null,1)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='mii-'+today()+'.json';a.click()}
function importData(){const i=document.createElement('input');i.type='file';i.accept='.json';i.onchange=()=>{const f=i.files[0];const r=new FileReader();r.onload=()=>{try{const j=JSON.parse(r.result);D={...D,...j,settings:{...DEFAULT_SETTINGS,...(j.settings||{})}};store.save();render();toast('読み込みました')}catch(e){toast('読み込めませんでした')}};r.readAsText(f)};i.click()}
function resetData(){if(!confirm('すべてのデータを消します。よろしいですか？'))return;if(!confirm('本当に消しますか？この操作は戻せません。'))return;const gas=D.settings.gasUrl;D={events:[],tasks:[],mails:[],staff:[],shifts:{},duty:{},settings:{...DEFAULT_SETTINGS,gasUrl:gas},meta:{updatedAt:0}};store.save();render()}

/* ========== モーダル ========== */
function openModal(html){const m=document.getElementById('modal');m.innerHTML=html;m.scrollTop=0;document.getElementById('modal-bg').classList.add('on');document.getElementById('fab').style.visibility='hidden'}
function closeModal(){document.getElementById('modal-bg').classList.remove('on');document.getElementById('fab').style.visibility=''}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
// 通知メールのリンクから開いたとき
if(/[?&]ask=me\b/.test(location.search)){
  setTimeout(()=>{if(!myToday())openReflect()},1200);
  try{history.replaceState(null,'',location.pathname)}catch(e){}
}
// 画面を離れるときは、保存待ちがあればすぐに保存する
function flushSave(){
  if(store._t){clearTimeout(store._t);store._t=null;store.local.set(D);if(D.settings.gasUrl)store._push()}
}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')flushSave()});
window.addEventListener('pagehide',flushSave);
// 画面に戻ってきたら、編集中でなければ静かに最新を読み直す
document.addEventListener('visibilitychange',()=>{
  if(document.visibilityState!=='visible')return;
  if(window._edited)return;
  if(!D.settings.gasUrl)return;
  const last=Number(sessionStorage.getItem('mii-refresh')||0);
  if(Date.now()-last<60000)return;
  sessionStorage.setItem('mii-refresh',String(Date.now()));
  store.load().then(()=>render());
});

/* ========== 起動 ========== */
const miiHdr=document.getElementById('mii-hdr');
miiHdr.dataset.state='idle';
miiHdr.onerror=()=>{miiHdr.dataset.list='[]';miiFall(miiHdr)};
miiHdr.src='mii.png';
(async()=>{render();await store.load();render();})();
</script>
