<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light only">
<meta name="supported-color-schemes" content="light">
<meta name="theme-color" content="#D5D2C6">
<title>しツジの「みー」さん</title>
<script src="vendor/xlsx.js"></script>
<script>if(!window.XLSX)document.write('<script src="https:\/\/unpkg.com\/xlsx@0.18.5\/dist\/xlsx.full.min.js"><\/script>');</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:light only;
  forced-color-adjust:none;
  /* 筐体（コンソール本体） */
  --bg:#D5D2C6; --panel:#EDEBE2; --panel2:#E2DFD4; --ink:#22241F; --gray:#6C6E63; --rule:#B4B2A5;
  /* 画面（ゲームボーイの発光する緑） */
  --screen:#DDE6C4; --screen-dark:#33461C; --screen-line:#A9BC7E;
  /* みーが話す窓＝レトロRPGの黒窓 */
  --win:#14150F; --win-line:#F0F0E6;
  /* 人 */
  --person:#4A7A24; --person-tint:#E3EBCE; --person-deep:#2B4A12;
  /* 今日中 */
  --today:#B23A22; --today-tint:#EFD6CF;
  /* コンディション5段階 */
  --c1:#4A7A24; --c2:#7C9E33; --c3:#C4A32A; --c4:#D2762A; --c5:#B23A22;
  --pix:"DotGothic16","Zen Kaku Gothic New",monospace;
  --sans:"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN","Yu Gothic UI","Meiryo",system-ui,sans-serif;
  --nav:66px; --sh:3px 3px 0 rgba(34,36,31,.85);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;color-scheme:light only}
html{background:var(--bg)}
@media (prefers-color-scheme:dark){:root{color-scheme:light only}}
body{font-family:var(--sans);color:var(--ink);background:var(--bg);font-size:15px;line-height:1.7;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,select,textarea{font:inherit;color:inherit;width:100%;border:2px solid var(--ink);background:var(--panel);padding:8px 10px;border-radius:0;outline:none;box-shadow:inset 2px 2px 0 rgba(34,36,31,.12)}
input:focus,select:focus,textarea:focus{background:#fff;box-shadow:inset 2px 2px 0 rgba(61,107,30,.25)}
textarea{resize:vertical;min-height:72px}
a{color:inherit;text-decoration:none}
:focus-visible{outline:3px solid var(--person);outline-offset:2px}
img{image-rendering:pixelated}
/* レトロRPGの二重角丸枠 */
.frame{border:3px solid var(--ink);border-radius:10px;box-shadow:inset 0 0 0 3px var(--panel),inset 0 0 0 5px var(--ink)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* frame */
#app{display:grid;grid-template-rows:auto 1fr auto;min-height:100vh;min-height:100dvh}
header{position:relative;z-index:2;display:flex;align-items:center;justify-content:space-between;padding:14px 18px 0;background:var(--bg)}
header .mark{display:flex;align-items:center;gap:8px;font-family:var(--pix);font-size:14px;letter-spacing:.02em}
header .mark img{width:26px;height:26px;object-fit:contain}
header .mark span{color:var(--gray);font-size:11px;margin-left:2px}
header .right{display:flex;gap:10px;align-items:center;font-size:10px;color:var(--gray);font-family:var(--pix);flex:none}
header .mark span{display:none}
@media(min-width:480px){header .mark span{display:inline}}
#savestate{display:inline-flex;align-items:center;gap:6px}
#savestate i{width:8px;height:8px;background:var(--rule);display:inline-block}
#savestate.ok i{background:var(--person)}
#savestate.err i{background:var(--today)}
#savestate.busy i{background:var(--gray)}
main{position:relative;z-index:1;padding:8px 18px calc(var(--nav) + 64px);max-width:720px;width:100%;margin:0 auto}

/* nav：筐体のボタン列 */
nav{position:fixed;z-index:100;isolation:isolate;left:0;right:0;bottom:0;height:var(--nav);background:var(--panel2);border-top:2px solid var(--ink);display:flex;padding:8px;padding-bottom:calc(8px + env(safe-area-inset-bottom));gap:6px}
nav button{flex:1;display:flex;align-items:center;justify-content:center;font-family:var(--pix);font-size:10px;padding:0 2px;color:var(--gray);position:relative;border:2px solid var(--rule);border-radius:8px;background:var(--panel)}
nav button b{display:none}
nav button.on{color:var(--panel);background:var(--ink);border-color:var(--ink)}
nav button .badge{position:absolute;top:-8px;right:-6px;min-width:18px;height:18px;padding:0 4px;background:var(--ink);color:var(--panel);font-size:10px;line-height:18px;text-align:center;border:2px solid var(--panel2);border-radius:9px;font-family:var(--pix)}
nav button .badge.today{background:var(--today)}
@media(min-width:900px){
  #app{grid-template-rows:auto 1fr;grid-template-columns:210px 1fr}
  header{grid-column:1/-1}
  nav{position:sticky;top:0;left:auto;right:auto;bottom:auto;height:auto;border:0;background:transparent;flex-direction:column;align-self:start;padding:24px 0 0 18px;gap:6px}
  nav button{flex:0;justify-content:flex-start;padding:11px 14px;font-size:13px}
  nav button .badge{position:static;margin-left:auto;border:0}
  main{padding:8px 30px 48px}
}

/* type */
h1{font-family:var(--pix);font-weight:400;font-size:20px;margin:18px 0 6px;letter-spacing:.04em}
h2{font-family:var(--pix);font-size:12px;color:var(--gray);margin:24px 0 8px;letter-spacing:.08em}
.date-big{font-family:var(--pix);font-size:46px;line-height:1;margin-top:18px;letter-spacing:.02em}
.date-big small{font-size:13px;margin-left:10px;color:var(--gray)}
.muted{color:var(--gray)}
.small{font-size:12px}
.empty{color:var(--screen-dark);padding:20px;font-size:14px;background:var(--screen);text-align:center;border:3px solid var(--ink);border-radius:10px;box-shadow:inset 0 0 0 3px var(--screen),inset 0 0 0 5px var(--ink)}
.empty b{color:var(--screen-dark)}

/* みーの窓＝ゲームボーイの画面 */
.bubble{display:flex;gap:14px;align-items:flex-start;margin:16px 0 8px;background:var(--win);padding:18px 16px;
  border:3px solid var(--win-line);border-radius:12px;box-shadow:inset 0 0 0 3px var(--win),inset 0 0 0 5px var(--win-line)}
.bubble img{width:56px;height:56px;flex:none;margin-top:2px}
.bubble p{font-family:var(--pix);font-size:14px;line-height:2.05;color:var(--win-line);max-width:30em;letter-spacing:.04em}

/* rows */
.row{display:flex;align-items:flex-start;gap:12px;padding:13px;background:var(--panel);margin-bottom:12px;border:3px solid var(--ink);border-radius:10px;box-shadow:inset 0 0 0 3px var(--panel),inset 0 0 0 4px var(--rule)}
.row .t{flex:1;min-width:0}
.row .t .ttl{font-weight:700}
.row .t .sub{font-size:12px;color:var(--gray);margin-top:3px}
.row .time{width:52px;flex:none;font-family:var(--pix);color:var(--gray);font-size:12px;padding-top:3px;line-height:1.5}
.row .acts{display:flex;gap:6px;flex:none}
.row.person{background:var(--person-tint);border-color:var(--person-deep);box-shadow:inset 0 0 0 3px var(--person-tint),inset 0 0 0 4px var(--person)}
.row.person .time,.row.person .sub{color:var(--person-deep)}
.row.stale .ttl::before{content:"STOP";font-family:var(--pix);font-size:9px;background:var(--ink);color:var(--panel);padding:2px 5px;margin-right:7px;vertical-align:2px}
.due-today{color:var(--today);font-weight:700}
.row.due{background:var(--today-tint);border-color:var(--today);box-shadow:inset 0 0 0 3px var(--today-tint),inset 0 0 0 4px var(--today)}

/* buttons：押し込むボタン */
.btn{padding:7px 14px;border:2px solid var(--ink);border-radius:8px;background:var(--panel);font-size:13px;font-weight:700;line-height:1.4;white-space:nowrap;box-shadow:2px 2px 0 var(--ink);transition:none}
.btn:hover{background:var(--ink);color:var(--panel)}
.btn:active{transform:translate(2px,2px);box-shadow:none}
.btn.ghost{border-color:var(--rule);box-shadow:2px 2px 0 var(--rule);color:var(--gray)}
.btn.ghost:hover{background:var(--rule);color:var(--ink)}
.btn.person{border-color:var(--person-deep);color:var(--person-deep);background:var(--person-tint);box-shadow:2px 2px 0 var(--person-deep)}
.btn.person:hover{background:var(--person);color:#fff}
.btn.solid{background:var(--ink);color:var(--panel)}
.btn.small{padding:4px 10px;font-size:12px}
.exits{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.toolbar{display:flex;gap:8px;align-items:center;margin:6px 0 12px;flex-wrap:wrap}
.toolbar .sp{flex:1}
.seg{display:inline-flex;gap:6px}
.seg{flex-wrap:wrap}
.seg button{padding:5px 12px;font-family:var(--pix);font-size:12px;color:var(--gray);border:2px solid var(--rule);border-radius:8px;background:var(--panel);white-space:nowrap}
.seg button.on{background:var(--ink);color:var(--panel);border-color:var(--ink)}
.fab{position:fixed;z-index:90;right:18px;bottom:calc(var(--nav) + 18px);width:56px;height:56px;background:var(--win);color:var(--win-line);font-family:var(--pix);font-size:26px;line-height:1;display:flex;align-items:center;justify-content:center;border:3px solid var(--win-line);border-radius:12px;box-shadow:0 0 0 3px var(--ink)}
.fab:active{transform:translate(3px,3px);box-shadow:none}
@media(min-width:900px){.fab{bottom:30px;right:30px}}

/* meter：体力ゲージ風 */
.meter{margin:12px 0 4px;background:var(--person-tint);padding:14px;border:3px solid var(--person-deep);border-radius:10px;box-shadow:inset 0 0 0 3px var(--person-tint),inset 0 0 0 5px var(--person-deep)}
.meter .track{height:16px;border:2px solid var(--person-deep);
  background-image:repeating-linear-gradient(90deg,var(--person) 0 6px,var(--person-deep) 6px 8px),linear-gradient(var(--panel),var(--panel));
  background-repeat:no-repeat,no-repeat;
  background-size:var(--p,0%) 100%,100% 100%}
.meter .lbl{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--person-deep);margin-top:9px}
.meter .lbl b{font-family:var(--pix);font-size:16px}

/* calendar */
.cal-head{display:flex;align-items:center;gap:8px;margin:6px 0}
.cal-head h1{margin:0;flex:1;font-size:16px}
.month{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.month .dow{font-family:var(--pix);font-size:11px;color:var(--gray);text-align:center;padding:4px 0}
.month .cell{min-height:62px;background:var(--panel);border:2px solid var(--rule);border-radius:6px;padding:4px;font-size:11px;cursor:pointer}
.month .cell .d{font-family:var(--pix);color:var(--gray)}
.month .cell.today{background:var(--screen);border-color:var(--ink)}
.month .cell.today .d{color:var(--screen-dark)}
.month .cell.other{background:transparent;border-color:transparent;color:var(--rule)}
.month .cell .ev{display:block;height:5px;margin-top:3px;background:var(--gray)}
.month .cell .ev.cat-会議{background:var(--ink)}
.month .cell .ev.cat-作業,.month .cell .ev.cat-移動{background:var(--rule)}
.month .cell .ev.cat-打合せ{background:var(--gray)}
.month .cell .ev.cat-人{background:var(--person)}
/* 週＝縦積み */
.wk{display:flex;flex-direction:column;gap:10px}
.wkday{background:var(--panel);border:3px solid var(--rule);border-radius:10px;padding:8px 10px 10px}
.wkday.bare{padding:4px 10px;background:transparent;border-color:var(--rule);opacity:.75}
.wkday.bare .wkhd{border-bottom:0;padding-bottom:0}
.wkday.bare .dn{font-size:17px}
.wkday.today{border-color:var(--ink);background:var(--screen)}
.wkhd{display:flex;align-items:baseline;gap:8px;padding-bottom:6px;border-bottom:2px solid var(--rule)}
.wkday.today .wkhd{border-bottom-color:var(--screen-line)}
.wkhd .dn{font-family:var(--pix);font-size:22px;line-height:1}
.wkhd .dw{font-family:var(--pix);font-size:12px;color:var(--gray)}
.wkday.today .wkhd .dw{color:var(--screen-dark)}
.wkhd .pmark{font-family:var(--pix);font-size:10px;background:var(--person);color:#fff;padding:1px 6px;border-radius:6px}
.wkhd .sp{flex:1}
.wkev{margin-top:8px;display:flex;flex-direction:column;gap:6px}
.wrow{display:flex;align-items:baseline;gap:10px;padding:7px 9px;background:var(--panel2);border:2px solid var(--rule);border-radius:7px;cursor:pointer}
.wkday.today .wrow{background:var(--panel)}
.wrow .wt{font-family:var(--pix);font-size:11px;color:var(--gray);width:44px;flex:none}
.wrow .wn{font-weight:700;font-size:14px;flex:1;min-width:0;word-break:break-all}
.wrow .wc{font-family:var(--pix);font-size:10px;color:var(--gray);flex:none}
.wrow.cat-人{background:var(--person-tint);border-color:var(--person)}
.wrow.cat-人 .wt,.wrow.cat-人 .wc{color:var(--person-deep)}
.wrow.cat-会議{border-color:var(--ink)}
.wnone{font-family:var(--pix);font-size:11px;color:var(--gray);margin-left:4px}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.week .col{background:var(--panel);border:2px solid var(--rule);border-radius:8px;padding:5px 4px 10px;min-height:180px}
.week .col.today{background:var(--screen);border-color:var(--ink)}
.week .col h4{font-family:var(--pix);font-size:11px;color:var(--gray);margin-bottom:6px;text-align:center;line-height:1.3}
.week .col.today h4{color:var(--screen-dark)}
.week .chip{font-size:11px;padding:4px 5px;margin-bottom:4px;background:var(--panel2);border:1px solid var(--rule);line-height:1.35;cursor:pointer;word-break:break-all}
.week .chip.cat-会議{background:var(--ink);color:var(--panel);border-color:var(--ink)}
.week .chip.cat-会議 .tm{color:var(--rule)}
.week .chip.cat-人{background:var(--person);color:#fff;border-color:var(--person-deep)}
.week .chip.cat-人 .tm{color:var(--person-tint)}
.chip .tm{color:var(--gray);display:block;font-family:var(--pix);font-size:10px}

/* 区分の一括変更 */
.bulklist{display:flex;flex-direction:column;gap:6px;margin:10px 0}
.bkrow{display:flex;align-items:center;gap:8px;background:var(--panel2);border:2px solid var(--rule);border-radius:8px;padding:7px 9px}
.bkname{flex:1;min-width:0;font-weight:700;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bkpick{display:flex;gap:3px;flex:none}
.bkbtn{font-family:var(--pix);font-size:10px;padding:5px 7px;border:2px solid var(--rule);border-radius:6px;background:var(--panel);color:var(--gray);white-space:nowrap}
.bkbtn.on{background:var(--ink);color:var(--panel);border-color:var(--ink)}
/* 顔写真 */
.ava{width:26px;height:26px;border-radius:4px;object-fit:cover;flex:none;border:2px solid var(--rule);background:var(--panel2)}
.ava.ph{display:inline-flex;align-items:center;justify-content:center;font-family:var(--pix);font-size:13px;color:var(--gray)}
.ava.big{width:46px;height:46px}
.nmrow{display:flex;align-items:center;gap:7px;margin-top:8px}
.nmrow .nm{margin-top:0;font-weight:700;font-size:15px;word-break:break-all}
.hdrow{display:flex;align-items:center;gap:10px}
/* staff：カートリッジ風カード */
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media(min-width:600px){.grid{grid-template-columns:repeat(4,1fr)}}
.card{padding:11px;position:relative;cursor:pointer;background:var(--panel);border:3px solid var(--ink);border-radius:10px;box-shadow:inset 0 0 0 3px var(--panel),inset 0 0 0 4px var(--rule)}
.card::before{content:"";position:absolute;left:12px;top:-3px;width:32px;height:6px;background:var(--rule);border-radius:0 0 3px 3px;z-index:1}
.card.cond1::before{background:var(--c1)}.card.cond2::before{background:var(--c2)}.card.cond3::before{background:var(--c3)}.card.cond4::before{background:var(--c4)}.card.cond5::before{background:var(--c5)}
.card:active{opacity:.75}
.card .nm{font-weight:700;font-size:15px;margin-top:8px;word-break:break-all}
.card .kd{font-family:var(--pix);font-size:10px;color:var(--gray);border:1px solid var(--rule);padding:0 5px;display:inline-block;margin-top:4px}
.card .dots{display:flex;gap:4px;align-items:flex-end;margin-top:9px;height:14px}
.card .dots i{display:block;background:var(--rule)}
.card .dots i.c1{background:var(--c1)}.card .dots i.c2{background:var(--c2)}.card .dots i.c3{background:var(--c3)}.card .dots i.c4{background:var(--c4)}.card .dots i.c5{background:var(--c5)}
.card .last{font-family:var(--pix);font-size:10px;color:var(--gray);margin-top:7px}
.card .last.over{color:var(--person-deep)}
.card .ren{position:absolute;right:6px;top:6px;font-family:var(--pix);font-size:9px;color:#fff;background:var(--person);padding:1px 5px}
.card.big{background:var(--person-tint);border-color:var(--person-deep);box-shadow:inset 0 0 0 3px var(--person-tint),inset 0 0 0 5px var(--person-deep)}
.card.big .why{font-size:12px;color:var(--person-deep);margin-top:7px;line-height:1.55}
.cond-pick{display:flex;gap:8px;margin:10px 0;align-items:center;flex-wrap:wrap}
.cond-pick button{width:42px;height:42px;background:var(--panel);border:2px solid var(--ink);border-radius:10px;font-family:var(--pix);font-size:15px;box-shadow:2px 2px 0 var(--ink)}
.cond-pick button:active{transform:translate(2px,2px);box-shadow:none}
.cond-pick button.on{color:#fff}
.cond-pick button.c1.on{background:var(--c1)}.cond-pick button.c2.on{background:var(--c2)}.cond-pick button.c3.on{background:var(--c3)}.cond-pick button.c4.on{background:var(--c4)}.cond-pick button.c5.on{background:var(--c5)}

/* 沈黙の分布 */
.silence{display:flex;gap:6px;align-items:flex-end;height:120px}
.sbar{flex:1;display:flex;flex-direction:column;align-items:center;height:100%}
.scol{flex:1;width:100%;display:flex;align-items:flex-end;background:var(--panel2);border:2px solid var(--rule)}
.sfill{width:100%;min-height:3px}
.sfill.c1{background:var(--c1)}.sfill.c2{background:var(--c2)}.sfill.c3{background:var(--c3)}.sfill.c4{background:var(--c4)}.sfill.c5{background:var(--c5)}
.snum{font-family:var(--pix);font-size:14px;margin-top:4px}
.slbl{font-size:9px;color:var(--gray);text-align:center;line-height:1.3}
.tabs.wrap{flex-wrap:wrap}
.tabs.wrap button{flex:0 0 auto;padding:7px 11px}
/* 今週の作戦 */
.plancard{background:var(--person-tint);border:3px solid var(--person-deep);border-radius:10px;box-shadow:inset 0 0 0 3px var(--person-tint),inset 0 0 0 5px var(--person-deep);padding:13px;margin-bottom:12px}
.plancard .ph{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.plancard .pn{font-weight:700;font-size:16px}
.plancard .pwhy{font-size:12px;color:var(--person-deep);margin-top:6px;line-height:1.6}
.plancard .pidea{margin-top:8px;font-size:12px;color:var(--ink);background:var(--panel);border:2px solid var(--person);padding:7px 9px}
.plancard .pidea span{display:block;line-height:1.7}
.plancard .pact{display:flex;align-items:center;gap:8px;margin-top:10px;flex-wrap:wrap}
.plancard .pslot{font-family:var(--pix);font-size:13px;color:var(--person-deep);flex:1;min-width:110px}
/* 分析 */
.biasrow{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.biasrow .bk{width:74px;flex:none;font-size:13px;font-weight:700}
.biasrow .bk span{display:block;font-family:var(--pix);font-size:10px;color:var(--gray);font-weight:400}
.biasrow .bbar{flex:1;height:14px;background:var(--panel2);border:2px solid var(--rule)}
.biasrow .bfill{height:100%;background:var(--person)}
.biasrow .bnum{width:70px;flex:none;text-align:right;font-family:var(--pix);font-size:13px}
.biasrow .bnum span{display:block;font-size:10px;color:var(--gray)}
.cnums i{font-style:normal;font-size:10px;margin-left:3px}
.cnums i.up{color:var(--person)}.cnums i.down{color:var(--today)}
.ideas{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.ideas .btn{text-align:left;font-weight:400}
.ideas .btn.used{opacity:.4}
/* PEOPLEの日付バー・勤務バッジ */
.daybar{display:flex;align-items:center;gap:8px;background:var(--panel);border:3px solid var(--ink);border-radius:10px;box-shadow:inset 0 0 0 3px var(--panel),inset 0 0 0 4px var(--rule);padding:8px 10px;margin:10px 0}
.daybar .dlabel{font-family:var(--pix);font-size:15px;display:flex;align-items:baseline;gap:6px}
.daybar .dlabel span{font-size:10px;background:var(--ink);color:var(--panel);padding:1px 6px;border-radius:5px}
.daybar .sp{flex:1}

<script>
/* ========== 基盤 ========== */
function miiState(){
  const t=today();
  const due=openTasks().filter(x=>x.due&&x.due<=t).length;
  const reply=D.mails.filter(m=>m.status==='open'&&mailBucket(m)==='reply');
  const stale=openTasks().filter(x=>staleDays(x)>=3).length;
  const people=eventsOn(t).filter(e=>e.cat==='人').length;
  if(stale>=3||reply.some(m=>mailStaleDays(m)>=7))return 'alert';
  if(due>0||reply.length>0||stale>0)return 'busy';
  if(people>0)return 'people';
  return 'happy';
}
const MII_ORDER={alert:['mii-alert.gif','mii-alert.png'],busy:['mii-busy.gif','mii-busy.png'],people:['mii-people.gif','mii-people.png'],happy:['mii-happy.gif','mii-happy.png']};
function miiFall(img){
  const list=JSON.parse(img.dataset.list||'[]');
  if(list.length){img.src=list.shift();img.dataset.list=JSON.stringify(list);return}
  img.onerror=null;img.src='data:image/svg+xml;utf8,'+encodeURIComponent(MII_FALLBACK);
}
function miiTag(cls){
  const st=miiState();
  const list=[...(MII_ORDER[st]||[]),'mii.gif','mii.png'];
  const first=list.shift();
  return `<img class="${cls||'mii'} mii-${st}" src="${first}" alt="みー" data-list='${JSON.stringify(list)}' onerror="miiFall(this)">`;

function today(){const d=new Date();return ymd(d)}
function ymd(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function parse(s){const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)}
function addDays(s,n){const d=parse(s);d.setDate(d.getDate()+n);return ymd(d)}
function addMonths(s,n){const d=parse(s);d.setDate(1);d.setMonth(d.getMonth()+n);return ymd(d)}
function diffDays(a,b){return Math.round((parse(b)-parse(a))/86400000)}
function dow(s){return '日月火水木金土'[parse(s).getDay()]}
function fmtMD(s){const d=parse(s);return (d.getMonth()+1)+'/'+d.getDate()+'（'+dow(s)+'）'}
function weekStart(s){const d=parse(s);const w=(d.getDay()+6)%7;d.setDate(d.getDate()-w);return ymd(d)}
function mins(t){if(!t)return 0;const [h,m]=t.split(':').map(Number);return h*60+m}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}

function eventsOn(date){return D.events.filter(e=>e.date===date).sort((a,b)=>mins(a.start)-mins(b.start))}
function overlaps(a,b){return a.date===b.date&&mins(a.start)<mins(b.end||b.start)+1&&mins(b.start)<mins(a.end||a.start)+1&&a.id!==b.id}
function durH(e){return Math.max(0,(mins(e.end)-mins(e.start))/60)}
function weekKey(s){return weekStart(s)}
function weekGoal(s){return D.settings.weekGoals[weekKey(s)]??D.settings.weeklyGoal}
function weekPeopleHours(s){const ws=weekStart(s),we=addDays(ws,6);return D.events.filter(e=>e.cat==='人'&&e.date>=ws&&e.date<=we).reduce((a,e)=>a+durH(e),0)}
function openTasks(){return D.tasks.filter(t=>t.status==='open')}
function staleDays(t){return diffDays(t.createdAt.slice(0,10),today())}
function mailScore(m){
  const s=D.settings;let sc=0;const from=(m.from||'').toLowerCase();
  if(s.vip.some(v=>v&&from.includes(v.toLowerCase())))sc+=30;
  if(m.to==='TO')sc+=15;
  const txt=(m.subject||'')+' '+(m.snippet||'');
  if(s.deadlineWords.some(w=>w&&txt.includes(w)))sc+=20;
  if(m.needsReply)sc+=25;
  if(m.flagged)sc+=40;
  if(m.hasAttach)sc+=5;
  if(m.external)sc+=10;
  if(/no-?reply|noreply|newsletter|magazine|mailmag|info@|news@/.test(from))sc-=30;
  if(s.exclude.some(v=>v&&from.includes(v.toLowerCase())))sc-=50;
  return sc;
}
function mailBucket(m){if(m.needsReply)return 'reply';return mailScore(m)>=50?'read':'other'}
function mailStaleDays(m){return m.lastActivity?Math.floor((Date.now()-new Date(m.lastActivity))/86400000):0}
function staffScore(p){
  let sc=0;const t=today();
  const last=p.lastContact||p.startDate||t;const gap=diffDays(last,t);const target=p.contactDays||KIND_DAYS[p.kind]||90;
  sc+=Math.min(3,gap/target)*40;
  if(p.renewalDate){const r=diffDays(t,p.renewalDate);const lead=renewalLead(p);if(r>=0&&r<=lead)sc+=80+ (lead-r);}
  const c=p.conditions||[];if(c.length>=2&&c[c.length-1].v>c[c.length-2].v)sc+=35;if(c.length&&c[c.length-1].v>=5)sc+=40;
  if(p.startDate&&diffDays(p.startDate,t)<=90)sc+=20;
  if(p.flag)sc+=50;
  if(window._sigMap&&window._sigMap[p.name])sc+=window._sigMap[p.name];
  if(p.birthday){const b=p.birthday.slice(5);const tb=t.slice(5);const d=diffDays(t.slice(0,4)+'-'+tb,t.slice(0,4)+'-'+b);if(d>=0&&d<=7)sc+=10}
  return sc;
}
function renewalLead(p){return Math.min(60,(p.cycleMonths||12)*7)}
function staffWhy(p){
  const t=today();const w=[];
  if(p.renewalDate){const r=diffDays(t,p.renewalDate);if(r>=0&&r<=renewalLead(p))w.push('契約更新まで'+r+'日')}
  const gap=diffDays(p.lastContact||p.startDate||t,t);const target=p.contactDays||KIND_DAYS[p.kind]||90;
  if(!p.lastContact)w.push('まだ接触記録がありません');else if(gap>target)w.push('最後に話してから'+gap+'日');
  const c=p.conditions||[];if(c.length>=2&&c[c.length-1].v>c[c.length-2].v)w.push('コンディションが下降');
  if(p.startDate&&diffDays(p.startDate,t)<=90)w.push('就業'+diffDays(p.startDate,t)+'日目');
  if(p.flag)w.push('気になる印あり');
  return w.join('／');
}

/* ========== ざっくりメモの解釈 ========== */
const WD={'日':0,'月':1,'火':2,'水':3,'木':4,'金':5,'土':6};
function nextWeekday(from,w,nextWeek){
  const d=parse(from);let cur=d.getDay();let add=(w-cur+7)%7;
  if(nextWeek){add=add+((w-cur+7)%7===0?7:0);add+=7-((add>=7)?7:0);add=((w-cur+7)%7)+7}
  else if(add===0)add=7;
  return addDays(from,add);
}
function parseLine(line,baseDate){
  let s=line.trim();if(!s)return null;
  const t=baseDate||today();const tt=today();let date=null,start=null,end=null,place='';
  // 場所 @〜
  s=s.replace(/[@＠]\s*([^\s、,]+)/,(m,p)=>{place=p;return ' '});
  // 日付
  const rep=(re,fn)=>{const m=s.match(re);if(m){date=fn(m);s=s.replace(m[0],' ')}};
  rep(/(\d{1,2})[\/月](\d{1,2})日?/,m=>{const y=parse(tt).getFullYear();const c=y+'-'+String(+m[1]).padStart(2,'0')+'-'+String(+m[2]).padStart(2,'0');return c<tt?(y+1)+c.slice(4):c});
  if(!date)rep(/今日|本日|きょう/,()=>tt);
  if(!date)rep(/明後日|あさって/,()=>addDays(tt,2));
  if(!date)rep(/明日|あした|あす/,()=>addDays(tt,1));
  if(!date)rep(/来週\s*([日月火水木金土])曜?日?/,m=>nextWeekday(tt,WD[m[1]],true));
  if(!date)rep(/今週\s*([日月火水木金土])曜?日?/,m=>{const d=parse(tt);const add=(WD[m[1]]-d.getDay()+7)%7;return addDays(tt,add)});
  if(!date)rep(/([日月火水木金土])曜日?/,m=>nextWeekday(tt,WD[m[1]]));
  // 時刻（範囲対応）
  const tm=s.match(/(午前|午後|朝|夕方|夜)?\s*(\d{1,2})\s*(?:時(?!間)|:|：)\s*(半|\d{1,2})?分?\s*(?:(?:[〜~\-ー–]|から|より)\s*(?:午前|午後)?\s*(\d{1,2})\s*(?:時(?!間)|:|：)\s*(半|\d{1,2})?分?(?:まで)?)?/);
  if(tm){
    let hh=+tm[2];const ap=tm[1];
    if((ap==='午後'||ap==='夕方'||ap==='夜')&&hh<12)hh+=12;
    if(ap==='午前'&&hh===12)hh=0;
    if(!ap&&hh<=7)hh+=12;
    const mm=tm[3]==='半'?30:(+tm[3]||0);
    start=String(hh).padStart(2,'0')+':'+String(mm).padStart(2,'0');
    if(tm[4]){let eh=+tm[4];if(hh>=12&&eh<hh)eh+=12;const em=tm[5]==='半'?30:(+tm[5]||0);end=String(Math.min(23,eh)).padStart(2,'0')+':'+String(em).padStart(2,'0')}
    s=s.replace(tm[0],' ');
  }
  // 所要時間
  const du=s.match(/(\d+(?:\.\d+)?)\s*時間(半)?|(\d+)\s*分/);
  if(du){const add=du[1]?Math.round(parseFloat(du[1])*60)+(du[2]?30:0):+du[3];if(start&&!end){const m0=mins(start)+add;end=String(Math.floor(m0/60)%24).padStart(2,'0')+':'+String(m0%60).padStart(2,'0')}s=s.replace(du[0],' ')}
  let title=s.replace(/\s+/g,' ').trim();
  title=title.replace(/^(から|より|まで|に|で|は|を|の|、|,|・|[〜~\-ー–])+\s*/,'').replace(/\s*(から|より|、|,|・)+$/,'').trim();
  if(!title)return null;
  // 型の推定
  let type='作業';
  if(/面談|1on1|ワンオンワン/.test(title))type='面談';
  else if(/定例/.test(title))type='定例会議';
  else if(/会議|ミーティング|MTG|mtg/.test(title))type='臨時会議';
  else if(/打合|打ち合わ|来社|訪問|商談/.test(title))type='社外打合せ';
  else if(/移動|出発|直行|直帰/.test(title))type='移動';
  return {kind:start?'event':'task',title,date:date||t,start:start||'',end:end||(start?addMin(start,60):''),type,place,use:true};
}
function addMin(t0,n){const m0=mins(t0)+n;return String(Math.floor(m0/60)%24).padStart(2,'0')+':'+String(m0%60).padStart(2,'0')}

/** 画像を96px四方に切り詰めて軽くする */
function fileToAvatar(file,size){
  size=size||96;
  return new Promise((res,rej)=>{
    const rd=new FileReader();
    rd.onload=()=>{
      const img=new Image();
      img.onload=()=>{
        const c=document.createElement('canvas');c.width=size;c.height=size;
        const ctx=c.getContext('2d');
        const m=Math.min(img.width,img.height);
        ctx.drawImage(img,(img.width-m)/2,(img.height-m)/2,m,m,0,0,size,size);
        res(c.toDataURL('image/jpeg',0.78));
      };
      img.onerror=rej;img.src=rd.result;
    };
    rd.onerror=rej;rd.readAsDataURL(file);
  });
}

/* ========== B. 日替わりの一言 ========== */
const DAY_FACTS={'01-01':'元日','01-07':'七草','02-03':'節分','02-14':'バレンタイン','03-03':'ひなまつり','03-14':'ホワイトデー','04-01':'エイプリルフール','05-05':'こどもの日','06-01':'写真の日','06-10':'時の記念日','07-07':'七夕','08-11':'山の日','09-09':'重陽の節句','09-20':'空の日','10-01':'コーヒーの日','10-31':'ハロウィン','11-01':'紅茶の日','11-03':'文化の日','11-11':'ポッキーの日','11-15':'七五三','12-24':'クリスマスイブ','12-25':'クリスマス','12-31':'大晦日','02-22':'猫の日'};
const DAILY_TIPS=[
 '本日もご無理のないように。','水分補給をお忘れなく。','ひと呼吸おいてから、まいりましょう。',
 '迷ったときは、まず一件片付けてしまうのが早道でございます。','こまめな休息が、集中の元でございます。',
 '本日のご自身にも、おつかれさまを。','小さな確認が、大きな手戻りを防ぎます。',
 '任せられることは、任せてしまいましょう。','急がば回れ。丁寧が近道でございます。',
 '誰かひとりに「ありがとう」を。','背筋をのばして、まいりましょう。','始めよければ半ば成功、と申します。',
 'できなかったことより、できたことを。','よい引き継ぎが、よい明日をつくります。'];
function dailyLine(dateKey,hours){
  const md=dateKey.slice(5);
  const n=Number(dateKey.replace(/-/g,''));
  const tip=DAILY_TIPS[n%DAILY_TIPS.length];
  const fact=DAY_FACTS[md];
  const bd=D.staff.filter(p=>p.birthday&&p.birthday.slice(5)===md);
  const anniv=D.staff.filter(p=>p.startDate&&p.startDate.slice(5)===md&&p.startDate.slice(0,4)!==dateKey.slice(0,4));
  const out=[];
  if(bd.length)out.push('本日は'+bd.map(p=>p.name).join('さん、')+'さんのお誕生日でございます。');
  else if(anniv.length)out.push('本日は'+anniv.map(p=>p.name+'さん（'+(Number(dateKey.slice(0,4))-Number(p.startDate.slice(0,4)))+'年目）').join('、')+'の就業記念日でございます。');
  else if(fact)out.push('本日は'+fact+'でございます。');
  out.push(tip);
  return out.join(' ');
}

function voice(){
  const h=new Date().getHours();const t=today();
  const ev=eventsOn(t);const people=ev.filter(e=>e.cat==='人');
  const reply=D.mails.filter(m=>m.status==='open'&&mailBucket(m)==='reply');
  const staleMail=reply.filter(m=>mailStaleDays(m)>=3);
  const due=openTasks().filter(x=>x.due&&x.due<=t);
  const stale=openTasks().filter(x=>staleDays(x)>=3);
  const L=[];
  L.push(h<11?'おはようございます。':h<17?'こんにちは。':'お疲れ様でございました。');
  if(people.length)L.push('人に向き合う枠が'+people.length+'件、ご予定は全'+ev.length+'件。');
  else if(ev.length)L.push('本日のご予定は'+ev.length+'件でございます。');
  else L.push('本日、ご予定はございません。');
  const a=[];
  if(reply.length)a.push('要返信'+reply.length+'件'+(staleMail.length?'（'+staleMail.length+'件は3日以上）':''));
  if(due.length)a.push('本日中'+due.length+'件');
  if(stale.length)a.push('机に停滞'+stale.length+'件');
  if(a.length)L.push(a.join('　'));else L.push('急ぎのものはございません。');
  const cand=D.staff.map(p=>({p,sc:staffScore(p)})).filter(x=>x.sc>=40).sort((a,b)=>b.sc-a.sc).slice(0,2);
  if(cand.length)L.push('今週は'+cand.map(x=>x.p.name.split(' ')[0]+'さん').join('と')+'にお声がけを。');
  L.push(dailyLine(t));
  return L.slice(0,5).join('\n');
}

function evTypeChange(){

function evCheck(){
  const g=id=>document.getElementById(id)?.value;
  const cand={id:window._evExtra?.id,date:g('ev-date'),start:g('ev-start'),end:g('ev-end')};const type=g('ev-type');const cat=TYPES[type].cat;
  const dup=D.events.filter(x=>overlaps(x,cand));let w='';
  const personHit=dup.filter(x=>x.cat==='人');const otherHit=dup.filter(x=>x.cat!=='人');
  if(cat!=='人'&&personHit.length)w+=`<div class="warn person">人の枠「${esc(personHit[0].title)}」に重なります。この枠を潰しますか？</div>`;
  if(otherHit.length)w+=`<div class="warn">同じ時間帯に「${esc(otherHit[0].title)}」があります。</div>`;
  const cat2=TYPES[type].cat;
  if(cat2==='人'){
    const wk=workingOn(cand.date);
    if(wk&&wk.length)w+=`<div class="warn person">この日の出勤：${wk.slice(0,12).map(x=>esc(x.p.name)+'('+esc(x.code)+')').join('　')}${wk.length>12?' ほか':''}</div>`;
    else if(wk)w+=`<div class="warn">この日の出勤者はいません。</div>`;
  }
  const sn=document.getElementById('ev-staff')?.value;
  if(sn&&cand.date){const c=shiftOf(sn,cand.date);if(c!==null&&isOff(c))w+=`<div class="warn">${esc(sn)}さんはこの日おやすみです。</div>`}
  document.getElementById('ev-warn').innerHTML=w;
}
function saveEvent(id,taskId){
  const g=i=>document.getElementById(i)?.value?.trim()||'';

  if(id){const i=D.events.findIndex(x=>x.id===id);D.events[i]={...D.events[i],...ev}}else D.events.push(ev);

}

function vMail(){
  const open=D.mails.filter(m=>m.status==='open');
  const b={reply:[],read:[],other:[]};open.forEach(m=>b[mailBucket(m)].push(m));
  b.reply.sort((a,c)=>mailStaleDays(c)-mailStaleDays(a));b.read.sort((a,c)=>mailScore(c)-mailScore(a));
  const tasked=D.mails.filter(m=>m.status==='tasked');
  const lastF=Number(localStorage.getItem('mii-mailfetch')||0);
  let h=`<h1>MAIL</h1><div class="toolbar"><span class="small muted">${D.settings.gasUrl?(lastF?'最終取り込み '+new Date(lastF).toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit'}):'この画面を開くと自動で取り込みます'):'シート接続後、Gmailから自動で取り込めます'}</span><span class="sp"></span><button class="btn small" onclick="localStorage.removeItem('mii-mailfetch');store.fetchMails()">いま取り込む</button></div>`;
  h+=`<div class="tabs"><button class="${mailTab==='reply'?'on':''}" onclick="mailTab='reply';render()">要返信<span class="n">${b.reply.length}</span></button><button class="${mailTab==='read'?'on':''}" onclick="mailTab='read';render()">今日読む<span class="n">${b.read.length}</span></button><button class="${mailTab==='other'?'on':''}" onclick="mailTab='other';render()">その他<span class="n">${b.other.length}</span></button></div>`;
  const list=b[mailTab];
  if(list.length)h+=list.map(m=>rowMail(m)).join('');
  else h+=`<div class="empty">${{reply:'返信待ちのメールはありません。',read:'今日読むべきメールはありません。',other:'その他はありません。'}[mailTab]}</div>`;
  if(tasked.length)h+=`<details><summary>タスク化して待機中 ${tasked.length}件</summary>${tasked.map(m=>`<div class="row"><div class="t"><div class="ttl">${esc(m.subject)}</div><div class="sub">${esc(m.from)}</div></div><div class="acts"><button class="btn ghost small" onclick="mailExit('${m.id}','replied')">返信済</button></div></div>`).join('')}</details>`;
  return h;

function rowMail(m,compact){
  const sd=mailStaleDays(m);const rep=m.needsReply;
  return `<div class="row ${rep?'due':''} ${sd>=3&&rep?'stale':''}"><div class="t"><div class="ttl">${m.flagged?'<span class="fwd">自分で送信</span>':''}${esc(m.subject||'（件名なし）')}</div><div class="sub">${esc(m.from)}${m.to==='CC'?'<span class="pill">CC</span>':''}　${m.date?fmtMD(m.date.slice(0,10)):''}${rep?'　<span class="'+(sd>=3?'due-today':'')+'">'+(sd?sd+'日返信なし':'返信待ち')+'</span>':''}　<span class="score">${mailScore(m)}点</span></div>
  ${m.snippet?`<div class="sub" style="margin-top:4px;color:var(--ink)">${esc(m.snippet.slice(0,120))}</div>`:''}
  ${compact?'':`<div class="exits"><button class="btn small" onclick="mailExit('${m.id}','replied')">返信した</button><button class="btn small" onclick="mailToTask('${m.id}')">タスク化</button><button class="btn ghost small" onclick="mailExit('${m.id}','ignored')">対応不要</button>${m.link?`<a class="btn ghost small" href="${esc(m.link)}" target="_blank" rel="noopener">Gmailで開く</a>`:''}</div>`}
  </div>${compact?`<div class="acts"><button class="btn small" onclick="mailExit('${m.id}','replied')">返信した</button></div>`:''}</div>`;
}

function vPeople(){
  const pd=peopleDate||today();
  const all=D.staff.map(p=>({p,sc:staffScore(p)}));
  const pick=all.filter(x=>x.sc>=40).sort((a,b)=>b.sc-a.sc).slice(0,5);
  let list=peopleFilter==='全'?all:peopleFilter==='要'?all.filter(x=>x.sc>=40):peopleFilter==='出'?all.filter(x=>{const c=shiftOf(x.p.name,pd);return c!==null&&!isOff(c)}):all.filter(x=>x.p.kind===peopleFilter);
  list.sort((a,b)=>b.sc-a.sc);
  let h=`<h1>PEOPLE</h1>`;
  if(!D.staff.length)return h+`<div class="empty"><b>まだ名簿がありません。</b><br>エクセルファイルを選ぶだけで一括登録できます。<div style="margin-top:10px"><button class="btn" onclick="openImportModal()">名簿を取り込む</button> <button class="btn ghost" onclick="openStaffModal()">1人ずつ登録</button></div></div>`;

    <button class="btn ghost small" onclick="peopleDate='${addDays(pd,1)}';render()">›</button>

  h+=condBar();
  h+=`<h2>今週、お声がけを</h2>`;

  h+=`<h2>全員</h2><div class="toolbar"><div class="seg">${['全','要','出',...KINDS].map(k=>`<button class="${peopleFilter===k?'on':''}" onclick="peopleFilter='${k}';render()">${k==='全'?'全員':k==='要'?'要対応':k==='出'?'出勤者':k}</button>`).join('')}</div><span class="sp"></span><button class="btn ghost small" onclick="openBulkKind()">区分を直す</button><button class="btn ghost small" onclick="openImportModal()">名簿を取り込む</button></div>`;
  h+=`<div class="grid">${list.map(x=>cardStaff(x.p,false,pd)).join('')}</div>`;

function cardStaff(p,big,pd){
  pd=pd||today();
  const c=(p.conditions||[]).slice(-3);const lc=lastCond(p);const t=today();
  const gap=p.lastContact?diffDays(p.lastContact,t):null;const target=p.contactDays||KIND_DAYS[p.kind]||90;
  const r=p.renewalDate?diffDays(t,p.renewalDate):null;const ren=r!==null&&r>=0&&r<=renewalLead(p);
  const code=shiftOf(p.name,pd);const off=code!==null&&isOff(code);const work=code!==null&&!off;
  const dots=[0,1,2].map(i=>{const v=c[i-(3-c.length)];const sz=i===2?14:i===1?10:7;return v?`<i class="c${v.v}" style="width:${sz}px;height:${sz}px"></i>`:`<i style="width:${sz}px;height:${sz}px"></i>`}).join('');
  const shiftTag=code===null?'':(off?`<span class="shbadge off">休</span>`:`<span class="shbadge on">${esc(code)}</span>`);
  return `<div class="card cond${lc} ${big?'big':''} ${off?'isoff':''} ${work?'iswork':''}" onclick="onCardTap('${p.id}','${pd}')">${ren?`<span class="ren">更新 ${r}日前</span>`:''}<div class="nmrow">${avatarTag(p)}<span class="nm">${esc(p.name)}</span></div><span class="kd">${esc(p.kind)}</span>${shiftTag}<div class="dots">${dots}</div>${condSpark(p)}<div class="last ${gap!==null&&gap>target?'over':''}">${gap===null?'未接触':gap+'日前に接触'}</div>${big?`<div class="why">${esc(staffWhy(p))}</div>`:''}</div>`;
}
function onCardTap(id,pd){
  const p=D.staff.find(x=>x.id===id);
  const code=shiftOf(p.name,pd);const work=code!==null&&!isOff(code);
  if(work)openMeetingPicker(id,pd);else openStaffDetail(id);
}


/* ===== 個人の月間勤務ビュー ===== */
function staffMonthShift(name,ym,staffId){
  const m=(D.shifts||{})[ym];
  if(!m||!m[name])return `<div class="empty small">${ym} の勤務表がありません。</div>`;
  const row=m[name];
  const first=ym+'-01';
  const lastDay=new Date(Number(ym.slice(0,4)),Number(ym.slice(5,7)),0).getDate();
  const lead=(parse(first).getDay()+6)%7;
  const t=today();
  const prof=shiftProfile(name,ym);
  let cells='';
  for(let i=0;i<lead;i++)cells+=`<div class="sc other"></div>`;
  for(let d=1;d<=lastDay;d++){
    const date=ym+'-'+String(d).padStart(2,'0');
    const c=String(row[String(d)]||'').trim();
    const off=isOff(c);
    const has=D.events.some(e=>e.date===date&&e.cat==='人'&&(e.staffName===name));
    cells+=`<div class="sc ${off?'off':'on'} ${date===t?'today':''} ${date<t?'past':''}" ${!off&&date>=t?`onclick="closeModal();openMeetingPicker('${staffId}','${date}')"`:''}>
      <span class="sd">${d}</span><span class="sv">${off?'休':esc(c||'-')}</span>${has?'<i class="sm"></i>':''}</div>`;
  }
  return `<div class="smon">
    <div class="smhd">${'月火水木金土日'.split('').map(x=>`<span>${x}</span>`).join('')}</div>
    <div class="smgrid">${cells}</div>
    <div class="smft">出勤 ${prof.work}日 ／ 休み ${prof.off}日${Object.keys(prof.codes).filter(k=>k!=='休').map(k=>`　${esc(k)} ${prof.codes[k]}`).join('')}</div>
    <div class="smnote">出勤日をタップすると、その日の面談を登録できます</div>
  </div>`;
}

/** ファイル名から年月を読み取る（202609_勤務表.xlsx / 2026-09 / 9月度 など） */
function monthFromName(fn){
  fn=String(fn||'').normalize('NFKC');
  let m=fn.match(/(20\d{2})[-_.年]?\s*(\d{1,2})\s*月?/);
  if(m&&Number(m[2])>=1&&Number(m[2])<=12)return m[1]+'-'+String(m[2]).padStart(2,'0');
  m=fn.match(/(?:令和|R)\s*(\d{1,2})\s*[年\.\-_]?\s*(\d{1,2})\s*月/);
  if(m)return (2018+Number(m[1]))+'-'+String(m[2]).padStart(2,'0');
  m=fn.match(/(\d{1,2})\s*月/);
  if(m&&Number(m[1])>=1&&Number(m[1])<=12){
    const y=new Date().getFullYear();return y+'-'+String(m[1]).padStart(2,'0');
  }
  return '';
}

function normName(s){
  return String(s||'').normalize('NFKC').replace(/[\s　]/g,'').trim();

/** 勤務表などの氏名を、名簿の誰かに結び付ける */
function resolveStaff(raw){
  const n=normName(raw);
  if(!n)return null;
  const al=(D.settings.nameAliases||{})[n];
  if(al){const p=D.staff.find(x=>normName(x.name)===normName(al));if(p)return p}
  let p=D.staff.find(x=>normName(x.name)===n);
  if(p)return p;
  // 姓だけの表記：その姓の人が1人だけなら結び付ける
  const pre=D.staff.filter(x=>normName(x.name).startsWith(n));
  if(pre.length===1&&n.length>=2)return pre[0];
  const suf=D.staff.filter(x=>n.startsWith(normName(x.name)));
  if(suf.length===1&&normName(suf[0].name).length>=2)return suf[0];
  return null;
}

/* ===== ファイル読み取りの共通処理 ===== */
function decodeAuto(buf){
  const u=new Uint8Array(buf);
  try{return new TextDecoder('utf-8',{fatal:true}).decode(u)}       // 厳密UTF-8
  catch(e){
    try{return new TextDecoder('shift-jis').decode(u)}              // エクセル既定のSJIS
    catch(e2){return new TextDecoder('utf-8').decode(u)}
  }
}
function readTable(file,cb){
  const isCsv=/\.csv|\.txt$/i.test(file.name);
  const rd=new FileReader();
  rd.onerror=()=>cb({error:'ファイルを読めませんでした'});
  rd.onload=()=>{
    try{
      if(isCsv){
        let txt=decodeAuto(rd.result).replace(/^\uFEFF/,'');
        const sep=(txt.split('\t').length>txt.split(',').length)?'\t':',';
        const rows=txt.split(/\r?\n/).map(l=>splitCsv(l,sep));
        cb({rows,sheets:['(CSV)'],sheet:'(CSV)'});
      }else{
        if(!window.XLSX)return cb({error:'エクセルを読む部品が読み込めていません。ネット接続を確認するか、CSVで保存してお試しください。'});
        const wb=XLSX.read(rd.result,{type:'array',cellDates:false});
        cb({wb,sheets:wb.SheetNames,sheet:wb.SheetNames[0],rows:sheetRows(wb,wb.SheetNames[0])});
      }
    }catch(e){cb({error:e.message})}
  };
  rd.readAsArrayBuffer(file);
}
function sheetRows(wb,name){
  const sh=wb.Sheets[name];
  if(!sh)return [];
  // 結合セルを展開（左上の値を範囲全体に複写）
  const rows=XLSX.utils.sheet_to_json(sh,{header:1,defval:'',raw:false,blankrows:true});
  (sh['!merges']||[]).forEach(m=>{
    const v=(rows[m.s.r]||[])[m.s.c];
    if(v===''||v==null)return;
    for(let r=m.s.r;r<=m.e.r;r++){rows[r]=rows[r]||[];for(let c=m.s.c;c<=m.e.c;c++)if(!rows[r][c])rows[r][c]=v}
  });
  return rows.map(r=>(r||[]).map(c=>String(c==null?'':c).replace(/\u3000/g,' ').trim()));
}
function splitCsv(line,sep){
  const out=[];let cur='',q=false;
  for(let i=0;i<line.length;i++){
    const ch=line[i];
    if(q){ if(ch==='"'){ if(line[i+1]==='"'){cur+='"';i++} else q=false } else cur+=ch }
    else { if(ch==='"')q=true; else if(ch===sep){out.push(cur);cur=''} else cur+=ch }
  }
  out.push(cur);return out.map(s=>s.replace(/\u3000/g,' ').trim());
}
/** シートの中身を人が見て分かる形で表示 */
function tablePreview(rows,note){

  for(let i=0;i<max;i++){
    h+=`<tr><th>${i+1}</th>${Array.from({length:wide},(_,c)=>`<td>${esc((rows[i]||[])[c]||'')}</td>`).join('')}</tr>`;

  return h;
}


/* ===== 「名前行＋シフト行」形式の勤務表を読む（勤務ボードと同じ方式） ===== */
const OFF_X=new Set(['休','休み','★','有','有休','夏季有休','ぐ～休','ぐ〜休','CUE','cue','Cue','公','公休','年休','×','x','X','ー','-','―','']);
function isOffX(v){return OFF_X.has(String(v||'').trim())}
/**
 * 行の作り：A列に氏名 → その「次の行」に1日〜月末のシフト、さらに次に補足行が入ることがある。
 * アルバイトA／B／研修の行は、セルの中身が「その日に入る人の名前」。
 */
function rowsToShiftPaired(rows,ym,dayCol){
  rows=(rows||[]).map(r=>(r||[]).map(c=>String(c==null?'':c).replace(/\u3000/g,' ').trim()));
  dayCol=(dayCol==null?1:dayCol);
  const Y=ym?Number(ym.slice(0,4)):new Date().getFullYear();
  const M=ym?Number(ym.slice(5,7)):new Date().getMonth()+1;
  const dim=new Date(Y,M,0).getDate();
  const at=(r,d)=>String((rows[r]||[])[dayCol+d-1]||'').trim();       // d=1..dim
  const filled=r=>{let k=0;for(let d=1;d<=dim;d++)if(at(r,d))k++;return k};
  const nameOf=r=>String((rows[r]||[])[0]||'').trim();
  const NGNAME=/^(氏名|名前|№|No\.?|合計|総計|小計|計|備考|日付|曜日|人数|以上)$/i;
  /** その行が日付・曜日の見出しか */
  const isHeadRow=r=>{
    let seq=0;for(let d=1;d<=10;d++){const v=at(r,d);const n=v&&v.match(/^(\d{1,2})/);if(n&&Number(n[1])===d)seq++;else break}
    if(seq>=7)return true;
    let dow=0;for(let d=1;d<=10;d++)if(/^[月火水木金土日]$/.test(at(r,d)))dow++;
    return dow>=7;
  };
  const map={};
  const put=(name,d,code)=>{if(!name||NGNAME.test(name))return;map[name]=map[name]||{};if(code)map[name][d]=code};
  const usedRows=new Set();
  const baitoRows=[],kenshuRows=[];
  let cgRow=-1,blocks=0;
  // 1) 特別な行（アルバイト枠・研修・CG）を先に見つける
  for(let r=0;r<rows.length;r++){
    const nm=nameOf(r);
    if(!nm)continue;
    if(/^CGデザイン/.test(nm)){cgRow=r;usedRows.add(r);continue}
    if(/^アルバイト\s*A/.test(nm)){baitoRows.push({r,kind:'A'});usedRows.add(r);continue}
    if(/^アルバイト\s*B/.test(nm)){baitoRows.push({r,kind:'B'});usedRows.add(r);continue}
    if(/^アルバイト研修|^研修|ぐ[～〜]たく/.test(nm)){kenshuRows.push(r);usedRows.add(r);continue}
  }
  // 研修枠の続き行（名前が無く中身だけの行）
  if(kenshuRows.length){
    const looksKenshu=n=>{for(let d=1;d<=dim;d++){const v=at(n,d);if(v&&/[研：:]/.test(v))return true}return false};
    let r=kenshuRows[kenshuRows.length-1]+1;
    const kBase=nameOf(kenshuRows[0]);
    while(r<rows.length&&(!nameOf(r)||nameOf(r)===kBase)&&filled(r)>=1&&!isHeadRow(r)&&looksKenshu(r)){kenshuRows.push(r);usedRows.add(r);r++}
  }
  // 2) 名前のある行をすべて走査（見出し行の上下を問わない）
  const seen={};
  for(let r=0;r<rows.length;r++){
    if(usedRows.has(r))continue;
    const nm=nameOf(r);
    if(!nm||NGNAME.test(nm))continue;
    if(/^[\d\.\-\/\s]+$/.test(nm))continue;
    if(isHeadRow(r))continue;
    if(seen[nm])continue;              // 結合セルで同じ名前が続く場合は最初の1回だけ扱う
    // シフト行か補足行かは「休みが入っているか」で見分ける（補足行に休は入らない）
    const offs=n=>{let k=0;for(let d=1;d<=dim;d++)if(isOffX(at(n,d))&&at(n,d)!=='')k++;return k};
    const score=n=>(n<0||n>=rows.length)?-1:offs(n)*10+filled(n);
    const nxName=nameOf(r+1);
    const canNext=(r+1<rows.length&&(!nxName||nxName===nm)&&!isHeadRow(r+1));
    const s0=score(r), s1=canNext?score(r+1):-1;
    let sr=-1;
    if(s1>s0)sr=r+1; else if(s0>0)sr=r;
    if(sr<0||filled(sr)<3)continue;
    for(let d=1;d<=dim;d++){
      const v=at(sr,d);
      if(v==='')continue;
      put(nm,d,isOffX(v)?'休':v);
    }
    blocks++;seen[nm]=1;usedRows.add(r);if(sr!==r)usedRows.add(sr);
    // 結合セルで同名が続く行もまとめて使用済みにする
    for(let k=r+1;k<rows.length&&nameOf(k)===nm;k++)usedRows.add(k);
  }
  // 3) アルバイト枠：セルの中身が人名
  baitoRows.forEach(b=>{
    // 枠行そのものに人名がある形と、次の行にある形の両方に対応
    let src=b.r;
    if(filled(src)<1)src=b.r+1;
    else{const bn=nameOf(b.r);if(filled(b.r+1)>filled(b.r)&&(!nameOf(b.r+1)||nameOf(b.r+1)===bn))src=b.r+1}
    for(let d=1;d<=dim;d++){
      const v=at(src,d);
      if(!v||v==='★'||isOffX(v))continue;
      v.split(/[\/／・,、\s]+/).filter(Boolean).forEach(nm=>put(nm,d,'バイト'+b.kind));
    }
  });
  // 4) 研修枠
  kenshuRows.forEach(r=>{
    for(let d=1;d<=dim;d++){
      const t=at(r,d);
      if(!t||t==='★'||isOffX(t))continue;
      const m=t.match(/(.+?)[：:](.+)/);
      const bs=t.match(/^Bサブ(.+)$/);
      if(m)put(m[2].trim(),d,/夜/.test(m[1])?'バイトB研修':'バイトA研修');
      else if(bs)put(bs[1].trim(),d,'ぐ〜たく');
      else if(t.length<=5&&!/\d/.test(t)&&/[ぁ-んァ-ヶ一-龠]/.test(t)&&!/^[Ａ-Ｚａ-ｚA-Za-z]+$/.test(t))put(t,d,'研修');
    }
  });
  const lines=Object.keys(map).filter(n=>Object.keys(map[n]).length).map(name=>{
    const cells=[];for(let d=1;d<=31;d++)cells.push(map[name][d]||'');
    return [name,...cells].join('\t');
  });
  return {lines,dim,blocks,baito:baitoRows.length,kenshu:kenshuRows.length,cgRow};
}
/** 「1行＝1人」か「名前行＋シフト行」かを自動で見分ける */
function detectShiftLayout(rows,dayCol){
  rows=(rows||[]).map(r=>(r||[]).map(c=>String(c==null?'':c).trim()));
  dayCol=(dayCol==null?1:dayCol);
  const nm=r=>String((rows[r]||[])[0]||'').trim();
  const cnt=r=>{let k=0;for(let d=1;d<=12;d++)if(String((rows[r]||[])[dayCol+d-1]||'').trim())k++;return k};
  const off=r=>{let k=0;for(let d=1;d<=12;d++){const v=String((rows[r]||[])[dayCol+d-1]||'').trim();if(v&&isOffX(v))k++}return k};
  let same=0,paired=0,merged=0;
  for(let r=0;r<rows.length-1;r++){
    const a=nm(r);
    if(!a||/^(氏名|名前|№|No\.?|合計|計|備考|日付|曜日)$/i.test(a))continue;
    if(/^[\d\.\-\/\s]+$/.test(a))continue;
    const b=nm(r+1);
    // 結合セルで同じ名前が続いている → 名前行＋シフト行の形
    if(b===a){
      merged++;
      if(cnt(r+1)>cnt(r)||off(r+1)>off(r))paired++;
      continue;
    }
    const c0=cnt(r), c1=b?0:cnt(r+1);
    // 自分の行に休みが入っていれば「1行＝1人」
    if(c0>=6&&off(r)>=1)same++;
    else if(c1>=6&&off(r+1)>=1)paired++;
    else if(c0>=6)same++;
    else if(c1>=6)paired++;
  }
  if(merged>=3)return 'paired';
  return paired>same?'paired':'same';
}

const COLDEF=[
  {k:'name',    label:'氏名',        re:/氏名|名前|スタッフ名|社員名|ｽﾀｯﾌ|従業員名|従業員|name/i, ng:/フリガナ|ふりがな|ﾌﾘｶﾞﾅ|カナ|ｶﾅ|kana/i},
  {k:'kind',    label:'区分',        re:/区分|雇用|形態|種別|契約区分|身分|職種|資格/i},
  {k:'dept',    label:'所属',        re:/所属|現場|部署|部門|拠点|事業所|チーム|課|グループ|配属/i},
  {k:'start',   label:'就業開始日',  re:/入社|就業|着任|配属日|勤務開始|開始日|採用/i},
  {k:'renewal', label:'次回更新日',  re:/更新日|次回更新|契約満了|満了|期限|終了日|契約終了/i},
  {k:'cycle',   label:'更新サイクル',re:/サイクル|更新周期|契約期間|周期|か月|ヶ月|期間/i},
  {k:'birth',   label:'誕生日',      re:/誕生|生年|birth/i}
];
function rowsToRoster(rows,override){
  rows=(rows||[]).map(r=>(r||[]).map(c=>String(c==null?'':c).replace(/\u3000/g,' ').trim()));
  // 1) 見出し行を探す（短いラベルが2種類以上そろう行）
  let headIx=-1,bestScore=1;
  for(let i=0;i<Math.min(rows.length,20);i++){
    const hit=new Set();
    rows[i].forEach(v=>{
      if(!v||v.length>12)return;
      for(const d of COLDEF){if(d.ng&&d.ng.test(v))continue;if(d.re.test(v))hit.add(d.k)}
    });
    if(hit.size>bestScore){bestScore=hit.size;headIx=i}
  }
  // 2) 列の対応づけ（見出しが2行に分かれている場合は上の行と連結）
  const col={};
  if(headIx>0){
    const merged=(rows[headIx]||[]).map((v,c)=>((rows[headIx-1]||[])[c]||'')+v);
    merged.forEach((v,c)=>{
      if(!v||v.length>14)return;
      for(const d of COLDEF){if(d.ng&&d.ng.test(v))continue;if(col[d.k]===undefined&&d.re.test(v)){col[d.k]=c;return}}
    });
  }
  if(headIx>=0){
    rows[headIx].forEach((v,c)=>{
      if(!v)return;
      for(const d of COLDEF){if(d.ng&&d.ng.test(v))continue;if(col[d.k]===undefined&&d.re.test(v)){col[d.k]=c;return}}
    });
  }
  // 3) 見出しから氏名列が取れないときは中身から推定
  if(col.name===undefined){
    const w=Math.max(...rows.map(r=>r.length),1);
    let best=-1,bestN=0;
    for(let c=0;c<Math.min(w,10);c++){
      let n=0;
      rows.forEach((r,i)=>{
        if(i===headIx)return;
        const v=r[c]||'';
        if(!v||v.length>14)return;
        if(/^\d/.test(v))return;                    // 数字始まりは除外
        if(/^[\d\/\-\.]+$/.test(v))return;          // 日付は除外
        if(/[ぁ-んァ-ヶ一-龠]/.test(v)||/^[A-Za-z\s]+$/.test(v))n++;
      });
      if(n>bestN){bestN=n;best=c}
    }
    if(best>=0&&bestN>=2)col.name=best;
  }
  if(col.name===undefined)col.name=0;
  // 4) 手動指定で上書き
  if(override)Object.keys(override).forEach(k=>{
    if(override[k]===null)delete col[k];else col[k]=override[k];
  });
  // 5) データ行
  const NG=/^(氏名|名前|スタッフ|スタッフ名|社員|社員名|従業員|№|No\.?|備考|以上|区分|所属|部署|課|部|フリガナ|ふりがな|ﾌﾘｶﾞﾅ|カナ)$/i;
  const NGP=/^\s*(合計|総計|小計|計|人数|以上|備考)/;
  const out=[];
  const start=headIx>=0?headIx+1:0;
  for(let i=start;i<rows.length;i++){
    const r=rows[i];
    let name=(r[col.name]||'').trim();
    if(!name||NG.test(name)||NGP.test(name))continue;
    if(/^[\d\.\-\/\s]+$/.test(name))continue;       // 数字・日付だけの行は除外
    const g=k=>col[k]!==undefined?(r[col[k]]||'').trim():'';
    out.push({name,kind:g('kind'),dept:g('dept'),start:g('start'),renewal:g('renewal'),cycle:g('cycle'),birth:g('birth')});
  }
  return {rows:out,col,headIx};
}

function normDate(s){
  s=String(s==null?'':s).trim();if(!s)return '';
  // エクセルの日付シリアル値
  if(/^\d{5}$/.test(s)){const n=Number(s);if(n>20000&&n<80000){const d=new Date(Date.UTC(1899,11,30)+n*86400000);return ymd(new Date(d.getUTCFullYear(),d.getUTCMonth(),d.getUTCDate()))}}
  // ISO/スラッシュ/ドット/漢数字区切り
  let m=s.match(/(\d{4})\s*[\/\-\.年]\s*(\d{1,2})\s*[\/\-\.月]\s*(\d{1,2})/);
  if(m)return m[1]+'-'+String(m[2]).padStart(2,'0')+'-'+String(m[3]).padStart(2,'0');
  // 8桁（20260401）
  m=s.match(/^(\d{4})(\d{2})(\d{2})$/);
  if(m)return m[1]+'-'+m[2]+'-'+m[3];
  // 和暦（令和6年4月1日 / R6.4.1）
  m=s.match(/(?:令和|R)\s*(\d{1,2})\s*[年\.\/\-]\s*(\d{1,2})\s*[月\.\/\-]\s*(\d{1,2})/);
  if(m)return (2018+Number(m[1]))+'-'+String(m[2]).padStart(2,'0')+'-'+String(m[3]).padStart(2,'0');
  m=s.match(/(?:平成|H)\s*(\d{1,2})\s*[年\.\/\-]\s*(\d{1,2})\s*[月\.\/\-]\s*(\d{1,2})/);
  if(m)return (1988+Number(m[1]))+'-'+String(m[2]).padStart(2,'0')+'-'+String(m[3]).padStart(2,'0');
  m=s.match(/(?:昭和|S)\s*(\d{1,2})\s*[年\.\/\-]\s*(\d{1,2})\s*[月\.\/\-]\s*(\d{1,2})/);
  if(m)return (1925+Number(m[1]))+'-'+String(m[2]).padStart(2,'0')+'-'+String(m[3]).padStart(2,'0');
  // 年なし（4/1）→ 今年
  m=s.match(/^(\d{1,2})\s*[\/\-\.月]\s*(\d{1,2})/);
  if(m)return new Date().getFullYear()+'-'+String(m[1]).padStart(2,'0')+'-'+String(m[2]).padStart(2,'0');
  // Date が解釈できる形
  const d=new Date(s);
  if(!isNaN(d.getTime())&&d.getFullYear()>1900&&d.getFullYear()<2100)return ymd(d);
  return '';
}
function doImport(){
  let src=window._imRows;
  if(!src){
    const parsed=rowsToRoster(document.getElementById('im-text').value.split(/\r?\n/).filter(l=>l.trim()).map(l=>l.split(/\t|,/)));
    src=parsed.rows.length?parsed.rows:document.getElementById('im-text').value.split(/\r?\n/).filter(l=>l.trim()).map(l=>{
      const c=l.split(/\t|,/).map(x=>x.trim());
      return {name:c[0],kind:c[1]||'',dept:c[2]||'',start:c[3]||'',renewal:c[4]||'',cycle:c[5]||'',birth:c[6]||''};
    });
  }
  let n=0,u=0;
  src.forEach(r=>{
    if(!r.name||r.name==='氏名')return;
    const kind=guessKind(r.kind)||KINDS.find(k=>(r.kind||'').trim()===k)||'派遣';
    const o={name:r.name,kind,dept:r.dept||'',startDate:normDate(r.start),renewalDate:normDate(r.renewal),cycleMonths:normCycle(r.cycle),birthday:normDate(r.birth)};
    const ex=D.staff.find(p=>p.name===o.name);
    if(ex){Object.assign(ex,o);u++}else{D.staff.push({id:uid(),conditions:[],...o});n++}
  });
  window._imRows=null;
  closeModal();store.save();render();toast(n+'名を追加、'+u+'名を更新しました');
}
function guessKind(v){
  v=String(v||'');
  if(/派遣|ﾊｹﾝ/.test(v))return '派遣';           // 「派遣社員」を先に判定
  if(/パート|アルバイト|バイト|ﾊﾟｰﾄ|ｱﾙﾊﾞｲﾄ|非常勤|時給|ﾊﾟ|P|A/.test(v)&&!/正/.test(v))return 'バイト';
  if(/嘱託|再雇用|シニア|定年後/.test(v))return '嘱託';
  if(/正社員|正職|常勤|社員|職員/.test(v))return '社員';
  return '';
}
function normCycle(v){
  const s=String(v||'');
  const m=s.match(/(\d+)/);if(!m)return '';
  const n=Number(m[1]);
  if(/年/.test(s))return n*12;
  return n;
}

    const d=c[c.length-1].v-c[c.length-2].v;
    out.push(d>=2?'状態が急に変わった理由（何があったか）':'最近の変化について')}
  if(c.length&&c[c.length-1].v>=4)out.push('負担に感じていること／続けられるか');
  const gap=p.lastContact?diffDays(p.lastContact,t):null;
  if(gap===null)out.push('はじめての面談。これまでの経緯と希望');
  else if(gap>180)out.push('久しぶり（'+gap+'日ぶり）。この間の変化');
  if(p.homework)out.push('前回の課題：'+p.homework);
  if(p.birthday){const b=p.birthday.slice(5),tb=t.slice(5);if(b===tb)out.push('お誕生日')}
  if(!out.length)out.push('最近の様子','シフトや働き方の希望','困っていること');
  return out.slice(0,5);
}

/* ========== 1. 面談の偏りを可視化 ========== */
function meetingStats(from,to){
  const evs=D.events.filter(e=>e.cat==='人'&&e.date>=from&&e.date<=to);
  const byKind={},byName={};let total=0;
  evs.forEach(e=>{
    const h=durH(e);total+=h;
    const p=D.staff.find(x=>x.id===e.staffId)||D.staff.find(x=>x.name===e.staffName);
    const k=p?p.kind:'その他';
    byKind[k]=(byKind[k]||0)+h;
    if(p)byName[p.name]=(byName[p.name]||0)+h;
  });
  return {byKind,byName,total,count:evs.length};
}
function vBias(){
  const to=today(),from=addDays(to,-29);

function weekReview(ws){

  const hrs=pe.reduce((a,e)=>a+durH(e),0);

  const meet=D.events.filter(e=>(e.cat==='会議'||e.cat==='打合せ')&&e.date>=ws&&e.date<=we);

/* ========== 今週の作戦（みーの提案） ========== */
function freeSlots(date,need){
  need=need||60;
  const ev=eventsOn(date);
  const day=[['09:00','12:00'],['13:00','18:00']];
  const out=[];
  day.forEach(([s,e])=>{
    for(let m=mins(s);m+need<=mins(e);m+=30){
      const st=String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0');
      const en=m+need;
      const clash=ev.some(x=>x.start&&mins(x.start)<en&&m<mins(x.end||x.start)+1);
      if(!clash)out.push(st);
    }
  });
  return out;
}
function buildPlan(ws){
  ws=ws||weekStart(today());
  const we=addDays(ws,6);
  const goal=D.settings.weekGoals[ws]??D.settings.weeklyGoal;
  const already=D.events.filter(e=>e.cat==='人'&&e.date>=ws&&e.date<=we);
  const doneH=already.reduce((a,e)=>a+durH(e),0);
  const booked=new Set(already.map(e=>e.staffName).filter(Boolean));
  // 候補：浮上順、すでに予約済みの人は除く
  const cand=D.staff.map(p=>({p,sc:staffScore(p)})).filter(x=>!booked.has(x.p.name)&&x.sc>=35&&staffWhy(x.p)).sort((a,b)=>b.sc-a.sc);
  const used={};
  const picks=[];
  const remain=Math.max(0,goal-doneH);
  const need=60;
  for(const c of cand){
    if(picks.length>=4)break;
    if(picks.length*1>=remain&&picks.length>=1)break;
    // 平日のうち、本人が出勤していて自分も空いている日を探す
    let found=null;
    for(let i=0;i<7;i++){
      const d=addDays(ws,i);
      if(d<today())continue;
      const code=shiftOf(c.p.name,d);
      const hasShift=!!(D.shifts||{})[d.slice(0,7)];
      if(hasShift&&(code===null||isOff(code)))continue;
      const slots=freeSlots(d,need).filter(s=>!(used[d]||[]).includes(s));
      if(slots.length){found={date:d,slot:slots[Math.min(1,slots.length-1)],code:hasShift?code:''};break}
    }
    if(found){
      (used[found.date]=used[found.date]||[]).push(found.slot);
      picks.push({...c,...found,why:staffWhy(c.p),ideas:askIdeas(c.p)});
    }
  }
  // 会議の見直し候補
  const audit=(()=>{
    const to=today(),from=addDays(to,-89);const map=meetingSeries();
    return Object.keys(map).map(k=>{
      const list=map[k].filter(e=>e.date>=from&&e.date<=to).sort((a,b)=>b.date.localeCompare(a.date));
      if(list.length<3)return null;
      const noTodo=list.slice(0,3).every(e=>!D.tasks.some(t=>t.meetingId===e.id));
      return noTodo?{k,h:(list.reduce((a,e)=>a+durH(e),0)/3)}:null;
    }).filter(Boolean).sort((a,b)=>b.h-a.h)[0];
  })();
  const stale=openTasks().filter(x=>staleDays(x)>=3);
  const mailStale=D.mails.filter(m=>m.status==='open'&&mailBucket(m)==='reply'&&mailStaleDays(m)>=3);
  const un=unreadNotes();
  if(un.length)h+=`<h2>いただいた声</h2>`+un.slice(0,2).map(n=>`<div class="row due" onclick="openNoteModal('${n.id}')"><div class="t"><div class="ttl">${esc(n.from||'匿名')}さんから</div><div class="sub">${esc(n.body.slice(0,50))}${n.body.length>50?'…':''}</div></div></div>`).join('');
  const pend=pendingReports();
  const zero=D.staff.filter(p=>!p.lastContact||diffDays(p.lastContact,today())>=120);
  const sig=(shiftSignals()||[]).filter(s=>s.sev>=50);
  return {ws,we,goal,doneH,remain,picks,audit,stale,mailStale,pend,zero,sig,booked:already.length};
}

/* ========== 2. 予兆の検知（勤務表から） ========== */
function monthKeys(n){
  const out=[];let ym=today().slice(0,7);
  for(let i=0;i<n;i++){out.push(ym);const d=parse(ym+'-01');d.setMonth(d.getMonth()-1);ym=ymd(d).slice(0,7)}
  return out;
}
function shiftProfile(name,ym){
  const m=(D.shifts||{})[ym];if(!m||!m[name])return null;
  const row=m[name];const codes={};let work=0,off=0,days=0;
  Object.keys(row).forEach(d=>{
    const c=String(row[d]||'').trim();
    if(!c)return;
    days++;
    if(isOff(c)){off++;codes['休']=(codes['休']||0)+1}
    else{work++;codes[c]=(codes[c]||0)+1}
  });
  return {work,off,days,codes};
}
/** 直近月と前月を比べて、変化のあった人を拾う */
function shiftSignals(){
  const ms=monthKeys(3);
  const cur=ms[0],prev=ms[1];
  if(!(D.shifts||{})[cur]||!(D.shifts||{})[prev])return null;
  const out=[];
  D.staff.forEach(p=>{
    const a=shiftProfile(p.name,cur),b=shiftProfile(p.name,prev);
    if(!a||!b||!b.work)return;
    const reasons=[];let sev=0;
    // 出勤日数の減少
    const rate=a.work/Math.max(1,b.work);
    if(a.days>=15&&rate<=0.7){reasons.push('出勤が'+b.work+'日→'+a.work+'日に減少');sev+=Math.round((1-rate)*60)}
    // 休みの増加
    if(a.off-b.off>=3){reasons.push('休みが'+(a.off-b.off)+'日増加');sev+=25}
    // 勤務帯の変化（主たるシフトが変わった）
    const top=o=>Object.keys(o.codes).filter(k=>k!=='休').sort((x,y)=>o.codes[y]-o.codes[x])[0]||'';
    const ta=top(a),tb=top(b);
    if(ta&&tb&&ta!==tb){reasons.push('主な勤務が「'+tb+'」→「'+ta+'」に変化');sev+=20}
    // 勤務パターンのばらつき（種類が急に増えた）
    const va=Object.keys(a.codes).length,vb=Object.keys(b.codes).length;
    if(va-vb>=2){reasons.push('勤務の種類が増え不規則に');sev+=15}
    if(reasons.length)out.push({p,reasons,sev,cur:a,prev:b});
  });
  return out.sort((a,b)=>b.sev-a.sev);
}
function vSignal(){
  const sig=shiftSignals();
  let h=`<h2>勤務からの予兆</h2>`;
  if(sig===null)return h+`<div class="empty">2か月分以上の勤務表が必要です。<br><span class="small">SCHEDULE → 勤務 から先月分も取り込むと、変化を見つけられます。</span><div style="margin-top:10px"><button class="btn small" onclick="openShiftModal()">勤務表を貼り付ける</button></div></div>`;
  const ms=monthKeys(2);
  h+=`<p class="small muted">${ms[1]} と ${ms[0]} を比べています。面談の前に気づくための材料です。</p>`;
  if(!sig.length)return h+`<div class="empty">目立った変化のある方はいません。</div>`;
  h+=sig.slice(0,10).map(s=>`<div class="row ${s.sev>=50?'due':''}" onclick="openStaffDetail('${s.p.id}')">
    <div class="t"><div class="ttl">${esc(s.p.name)}<span class="pill">${esc(s.p.kind)}</span>${s.sev>=50?'<span class="pill warnpill">要確認</span>':''}</div>
    <div class="sub">${s.reasons.map(esc).join('<br>')}</div></div></div>`).join('');
  h+=`<p class="small muted" style="margin-top:12px">※ 数字が変化した理由は本人にしか分かりません。決めつけず、話のきっかけとしてお使いください。</p>`;
  return h;
}

/* ========== 3. 面談の効き目（学習） ========== */
function meetingEffects(){
  const out=[];
  D.staff.forEach(p=>{
    const c=(p.conditions||[]).slice().sort((a,b)=>a.d.localeCompare(b.d));
    if(c.length<2)return;
    const ms=D.events.filter(e=>e.cat==='人'&&e.type==='面談'&&e.report&&(e.staffId===p.id||e.staffName===p.name)).sort((a,b)=>a.date.localeCompare(b.date));
    ms.forEach(e=>{
      const before=c.filter(x=>x.d<e.date).pop();
      const after=c.filter(x=>x.d>e.date)[0];
      if(!before||!after)return;
      out.push({p,e,before:before.v,after:after.v,delta:before.v-after.v});
    });
  });
  return out;
}
function vEffect(){
  const ef=meetingEffects();
  let h=`<h2>面談の効き目</h2>`;
  if(ef.length<5)return h+`<div class="empty">まだ判断できません。<br><span class="small">面談を記録し、その後のコンディションが記録されると、効いた面談の傾向が見えてきます。<br>現在 ${ef.length} 件（5件から表示）</span></div>`;
  const up=ef.filter(x=>x.delta>0),flat=ef.filter(x=>x.delta===0),down=ef.filter(x=>x.delta<0);
  h+=`<div class="condbox"><div class="cnums">
    <div><b>${up.length}</b><span>改善した</span></div>
    <div><b>${flat.length}</b><span>変わらず</span></div>
    <div><b>${down.length}</b><span>悪化した</span></div>
  </div><div class="clegend" style="margin-top:10px"><span>面談後にコンディションがどう動いたか（${ef.length}件）</span></div></div>`;
  // テーマ別の傾向
  const words={};
  ef.forEach(x=>{
    const src=((x.e.theme||'')+' '+(x.e.report||'')).replace(/\s+/g,' ');
    ['契約更新','シフト','家庭','体調','人間関係','仕事量','評価','将来','異動','残業','休み','give','感謝','相談'].forEach(w=>{
      if(src.includes(w)){words[w]=words[w]||{n:0,d:0};words[w].n++;words[w].d+=x.delta}
    });
  });
  const list=Object.keys(words).filter(w=>words[w].n>=2).sort((a,b)=>(words[b].d/words[b].n)-(words[a].d/words[a].n));
  if(list.length){
    h+=`<h2>話題ごとの傾向</h2>`;
    h+=list.map(w=>{const o=words[w];const avg=o.d/o.n;
      return `<div class="row"><div class="t"><div class="ttl">${esc(w)}<span class="pill">${o.n}件</span></div><div class="sub">${avg>0.2?'その後よくなる傾向':avg<-0.2?'その後下がる傾向':'変化なし'}（平均 ${avg>0?'+':''}${avg.toFixed(1)}）</div></div></div>`}).join('');
    h+=`<p class="small muted" style="margin-top:10px">件数が少ないうちは偶然の可能性が高いです。傾向として眺める程度に。</p>`;
  }
  // 効いた面談・効かなかった面談
  const best=up.slice().sort((a,b)=>b.delta-a.delta).slice(0,3);
  const worst=down.slice().sort((a,b)=>a.delta-b.delta).slice(0,3);
  if(best.length){h+=`<h2>その後よくなった面談</h2>`+best.map(x=>`<div class="row person" onclick="openReport('${x.e.id}')"><div class="time">${fmtMD(x.e.date).replace(/（.）/,'')}</div><div class="t"><div class="ttl">${esc(x.p.name)}　${x.before}→${x.after}</div><div class="sub">${esc((x.e.theme||x.e.report||'').slice(0,50))}</div></div></div>`).join('')}
  if(worst.length){h+=`<h2>その後下がった面談</h2>`+worst.map(x=>`<div class="row due" onclick="openReport('${x.e.id}')"><div class="time">${fmtMD(x.e.date).replace(/（.）/,'')}</div><div class="t"><div class="ttl">${esc(x.p.name)}　${x.before}→${x.after}</div><div class="sub">${esc((x.e.theme||x.e.report||'').slice(0,50))}</div></div></div>`).join('')}
  return h;
}


/* ========== G. 引き算の提案 ========== */
function subtractIdeas(){
  const t=today();const out=[];
  // 1. 成果の出ていない定例
  const map=meetingSeries();const from=addDays(t,-89);
  Object.keys(map).forEach(k=>{
    const list=map[k].filter(e=>e.date>=from&&e.date<=t).sort((a,b)=>b.date.localeCompare(a.date));
    if(list.length<3)return;
    const noTodo=list.slice(0,3).every(e=>!D.tasks.some(x=>x.meetingId===e.id));
    const hrs=list.reduce((a,e)=>a+durH(e),0)/3;
    const att=list.reduce((a,e)=>a+(Number(e.attendees)||1),0)/list.length;
    if(noTodo)out.push({t:'meeting',w:hrs*10,title:'「'+k+'」をやめる・隔週にする',
      why:'直近3回、ToDoが1件も出ていません。月'+hrs.toFixed(1)+'時間（延べ人時 '+(hrs*att).toFixed(1)+'h）',
      act:'見直す',go:()=>{repTab='audit';go('report')}});
  });
  // 2. 何も起きていない放置メール
  D.mails.filter(m=>m.status==='open'&&mailStaleDays(m)>=21&&!m.flagged).forEach(m=>{
    out.push({t:'mail',w:5,title:'「'+(m.subject||'').slice(0,24)+'」を対応不要にする',
      why:mailStaleDays(m)+'日放置されていますが、何も起きていません',act:'対応不要',id:m.id});
  });
  // 3. ずっと動かない案件
  openTasks().filter(x=>staleDays(x)>=21).forEach(x=>{
    out.push({t:'task',w:6,title:'「'+x.title.slice(0,24)+'」を手放す',
      why:staleDays(x)+'日動いていません。本当に必要ですか',act:'削除',id:x.id});
  });
  // 4. 出席しなくてよいかもしれない会議（自分のToDoが出ていない参加）
  const mine=D.events.filter(e=>e.cat==='会議'&&e.date>=addDays(t,-29)&&e.date<=t);
  if(mine.length>=6)out.push({t:'load',w:mine.reduce((a,e)=>a+durH(e),0),
    title:'今月の会議は'+mine.length+'件・'+mine.reduce((a,e)=>a+durH(e),0).toFixed(1)+'時間',
    why:'1件でも代理出席や欠席にできるものはありませんか',act:'一覧',go:()=>{repTab='audit';go('report')}});
  // 5. 定型作業の肥大
  const rt=routineStats();
  rt.filter(r=>r.hrs>=4).forEach(r=>out.push({t:'routine',w:r.hrs*2,
    title:'「'+r.k+'」に月'+r.hrs.toFixed(1)+'時間',why:'手順を減らすか、人に振れませんか',act:'DESKへ',go:()=>go('inbox')}));
  return out.sort((a,b)=>b.w-a.w).slice(0,8);
}
function subtractDo(x){
  if(x.t==='mail'){const m=D.mails.find(y=>y.id===x.id);if(m)m.status='ignored';store.save();render();toast('以後このメールは追いません')}
  else if(x.t==='task'){if(!confirm('この案件を削除しますか？'))return;D.tasks=D.tasks.filter(y=>y.id!==x.id);store.save();render();toast('手放しました')}

/* ========== H. 定型作業にかかっている時間 ========== */
function routineStats(){
  const t=today(),from=addDays(t,-89);
  const evs=D.events.filter(e=>e.cat==='作業'&&e.date>=from&&e.date<=t);
  const map={};
  evs.forEach(e=>{

    (map[k]=map[k]||[]).push(e);

  return Object.keys(map).map(k=>({k,n:map[k].length,hrs:map[k].reduce((a,e)=>a+durH(e),0)/3}))

/* ========== I. 沈黙の可視化 ========== */
function silenceBuckets(){
  const t=today();
  const B=[{k:'7日以内',max:7,n:[],c:'c1'},{k:'8〜30日',max:30,n:[],c:'c2'},{k:'31〜60日',max:60,n:[],c:'c3'},{k:'61〜90日',max:90,n:[],c:'c4'},{k:'91日以上',max:1e9,n:[],c:'c5'}];
  D.staff.forEach(p=>{
    const g=p.lastContact?diffDays(p.lastContact,t):99999;
    (B.find(b=>g<=b.max)||B[4]).n.push({p,g});
  });
  B.forEach(b=>b.n.sort((a,b2)=>b2.g-a.g));
  return B;
}
function vSilence(){
  const B=silenceBuckets();const total=D.staff.length;
  let h=`<h2>沈黙の分布</h2>`;
  if(!total)return h+`<div class="empty">名簿がまだありません。</div>`;

  <div class="clegend" style="margin-top:10px"><span>合計 ${total}名</span><span class="sp"></span>60日超 ${B[3].n.length+B[4].n.length}名（${Math.round((B[3].n.length+B[4].n.length)/total*100)}%）</div></div>`;
  const long=[...B[4].n,...B[3].n];
  if(long.length){
    h+=`<h2>長く話せていない方</h2>`;
    h+=long.slice(0,12).map(x=>`<div class="row ${x.g>=120?'due':''}" onclick="openStaffDetail('${x.p.id}')"><div class="time">${x.g>9000?'未':x.g+'日'}</div><div class="t"><div class="ttl">${esc(x.p.name)}<span class="pill">${esc(x.p.kind)}</span></div><div class="sub">${x.p.lastContact?'最後にお話ししたのは '+fmtMD(x.p.lastContact):'まだ記録がありません'}</div></div></div>`).join('');

function dutyFile(input){

    const p=rowsToDuty(res.rows);
    info.innerHTML=`「${esc(f.name)}」から <b>${p.count}日分</b>を読み取りました（枠：${p.slots.join('／')||'なし'}）`;
    document.getElementById('dt-prev').innerHTML=tablePreview(res.rows);
  });
}
function rowsToDuty(rows){
  rows=(rows||[]).map(r=>(r||[]).map(c=>String(c==null?'':c).trim()));
  // 見出し行＝日付らしい語を含む行、なければ1行目
  let head=0;
  for(let i=0;i<Math.min(rows.length,5);i++){if((rows[i][0]||'').match(/日付|日にち|date/i)){head=i;break}}
  const labels=(rows[head]||[]).slice(1).map((v,i)=>v||('枠'+(i+1)));
  const map={};let count=0;
  for(let i=head+1;i<rows.length;i++){
    const r=rows[i];const key=normDate(r[0]);
    if(!key)continue;
    const o={};let any=false;
    labels.forEach((lb,j)=>{const v=(r[j+1]||'').trim();if(v){o[lb]=v;any=true}});
    if(any){map[key]=o;count++}
  }
  return {map,count,slots:labels.filter(Boolean)};
}
function doDutyImport(){
  const sec=(document.getElementById('dt-sec').value||'').trim();
  if(!sec){toast('セクション名を入れてください');return}
  let rows=window._dtRows;
  if(!rows){
    const txt=document.getElementById('dt-text').value;

    rows=txt.split(/\r?\n/).filter(l=>l.trim()).map(l=>l.split(/\t|,/));

const OFF_CODES=['休','休み','★','有','有休','夏季有休','ぐ～休','ぐ〜休','CUE','cue','Cue','公','公休','年休','×','x','X','ー','-','―','','法','明'];
function isOff(code){const c=String(code||'').trim();return !c||OFF_CODES.includes(c)}
function shiftOf(name,date){
  const ym=date.slice(0,7);const d=String(Number(date.slice(8,10)));
  const m=(D.shifts||{})[ym];if(!m)return null;
  let row=m[name];
  if(!row){
    const n=normName(name);
    const key=Object.keys(m).find(k=>normName(k)===n);
    if(key)row=m[key];
    else{
      const al=D.settings.nameAliases||{};
      const src=Object.keys(al).find(k=>normName(al[k])===n);
      if(src){const k2=Object.keys(m).find(k=>normName(k)===src);if(k2)row=m[k2]}
    }
  }
  if(!row)return null;
  return row[d]??null;
}
function workingOn(date){
  const ym=date.slice(0,7);if(!(D.shifts||{})[ym])return null;
  return D.staff.map(p=>({p,code:shiftOf(p.name,date)})).filter(x=>x.code!==null&&!isOff(x.code));
}
function nextWorkDays(name,from,n){
  const out=[];let d=from||today();
  for(let i=0;i<45&&out.length<(n||3);i++){
    const c=shiftOf(name,d);
    if(c!==null&&!isOff(c))out.push({date:d,code:c});
    d=addDays(d,1);
  }
  return out;
}

function colName(c){return c<26?String.fromCharCode(65+c):String.fromCharCode(64+Math.floor(c/26))+String.fromCharCode(65+c%26)}
/** 表の行データから「氏名＋1日〜31日」の形を探し出す */
function rowsToShift(rows,override){
  rows=(rows||[]).map(r=>(r||[]).map(c=>String(c==null?'':c).replace(/\u3000/g,' ').trim()));
  // 1) 日付の見出し行を探す（1,2,3… が並ぶ行。1〜31の連番であればよい）
  let headIx=-1,dayCol=-1,bestRun=0;
  for(let i=0;i<Math.min(rows.length,20);i++){
    const r=rows[i];
    for(let c=0;c<Math.min(r.length,10);c++){
      let ok=0;
      for(let k=0;k<12;k++){
        const v=r[c+k];if(v===undefined)break;
        const n=String(v).match(/(\d{1,2})/);
        if(n&&Number(n[1])===k+1)ok++;else break;
      }
      if(ok>bestRun&&ok>=7){bestRun=ok;headIx=i;dayCol=c}
    }
  }
  // 2) 氏名の列を推定
  let nameCol=0;
  {
    const limit=dayCol>0?dayCol:Math.min(6,Math.max(...rows.map(r=>r.length),1));
    let best=-1,bestN=0;
    for(let c=0;c<limit;c++){
      let n=0;
      rows.forEach((r,i)=>{
        if(i===headIx)return;
        const v=r[c]||'';
        if(!v||v.length>14)return;
        if(/^[\d\.\-\/\s]+$/.test(v))return;
        if(/[ぁ-んァ-ヶ一-龠]/.test(v)||/^[A-Za-z\s]+$/.test(v))n++;
      });
      if(n>bestN){bestN=n;best=c}
    }
    if(best>=0&&bestN>=2)nameCol=best;
  }
  if(dayCol<0)dayCol=nameCol+1;
  // 3) 手動指定で上書き
  if(override){
    if(override.nameCol!=null)nameCol=override.nameCol;
    if(override.dayCol!=null)dayCol=override.dayCol;
    if(override.headIx!==undefined)headIx=override.headIx===null?-1:override.headIx;
  }
  // 4) 月の推定
  let ym=null;
  outer:for(let i=0;i<Math.min(rows.length,12);i++){
    for(const v0 of rows[i]){
      const v=String(v0||'').normalize('NFKC');
      let m=v.match(/(20\d{2})\s*[年\/\-\.]\s*(\d{1,2})/);
      if(m){ym=m[1]+'-'+String(m[2]).padStart(2,'0');break outer}
      m=v.match(/(?:令和|R)\s*(\d{1,2})\s*[年\.\/\-]\s*(\d{1,2})\s*月?/);
      if(m){ym=(2018+Number(m[1]))+'-'+String(m[2]).padStart(2,'0');break outer}
      m=v.match(/^(\d{1,2})\s*月/);
      if(m){const y=new Date().getFullYear();ym=y+'-'+String(m[1]).padStart(2,'0');break outer}
    }
  }
  // 5) データ行を抽出
  const NG=/^(氏名|名前|スタッフ|社員|従業員|№|No\.?|備考|区分|所属|曜日|日付)$/i;
  const NGP=/^\s*(合計|総計|小計|計|人数|以上)/;
  const lines=[];
  const start=headIx>=0?headIx+1:0;
  for(let i=start;i<rows.length;i++){
    const r=rows[i];
    const name=(r[nameCol]||'').trim();
    if(!name||NG.test(name)||NGP.test(name))continue;
    if(/^[\d\.\-\/\s]+$/.test(name))continue;
    const cells=[];
    for(let d=0;d<31;d++)cells.push((r[dayCol+d]||'').trim());
    if(cells.filter(Boolean).length<3)continue;
    lines.push([name,...cells].join('\t'));
  }
  return {lines,ym,headIx,nameCol,dayCol};
}

function doShiftImport(){
  const ym=document.getElementById('sh-ym').value;
  if(!ym){toast('対象の月を選んでください');return}
  const raw=document.getElementById('sh-text').value.split(/\r?\n/).filter(l=>l.trim());
  const parsed=rowsToShift(raw.map(l=>l.split(/\t|,/)));
  const lines=parsed.lines.length?parsed.lines:raw;
  const map={};let n=0,unknown=[];
  lines.forEach(l=>{
    const c=l.split(/\t|,/);
    const name=(c[0]||'').trim();
    if(!name||/^(氏名|名前|スタッフ|№|No)$/i.test(name))return;
    const row={};
    for(let i=1;i<c.length&&i<=31;i++)row[String(i)]=(c[i]||'').trim();
    map[name]=row;n++;
    if(!resolveStaff(name))unknown.push(name);
  });
  if(!n){toast('読み取れる行がありませんでした');return}
  // 名簿と照合して、可能なものは名簿の表記に揃える
  const fixed={},unresolved=[];
  Object.keys(map).forEach(k=>{
    const p=resolveStaff(k);
    if(p)fixed[p.name]=Object.assign(fixed[p.name]||{},map[k]);
    else{fixed[k]=map[k];unresolved.push(k)}
  });
  D.shifts=D.shifts||{};D.shifts[ym]=fixed;
  store.save();render();
  if(unresolved.length){toast(n+'名分を取り込みました');openMatchModal(unresolved,()=>{
    // 別名が決まったら、その月のデータを名簿の表記に付け替える
    const m2=D.shifts[ym],out={};
    Object.keys(m2).forEach(k=>{const p=resolveStaff(k);out[p?p.name:k]=Object.assign(out[p?p.name:k]||{},m2[k])});
    D.shifts[ym]=out;store.save();render();
  });}
  else{closeModal();toast(n+'名分を取り込みました');}
}

  const chip=x=>`<button class="wchip ${x.over?'over':''}" onclick="onCardTap('${x.p.id}','${date}')">
    <span class="wn">${esc(x.p.name)}</span>
    <span class="wc">${esc(x.code)}</span>
    ${x.over?`<span class="wg">${x.gap===null?'未':x.gap+'日'}</span>`:''}
  </button>`;
  if(shiftView==='pri'){
    list.sort((a,b)=>b.sc-a.sc);
    h+=`<div class="wgrid">${list.map(chip).join('')}</div>`;
  }else{
    const by={};list.forEach(x=>{(by[x.code]=by[x.code]||[]).push(x)});

  }
  return h;
}

/* ========== コンディションの見える化 ========== */
function condSpark(p,w,hh){
  const c=(p.conditions||[]).slice(-8);
  if(c.length<2)return '';
  w=w||120;hh=hh||30;
  const step=c.length>1?w/(c.length-1):w;
  const y=v=>hh-2-((5-v)/4)*(hh-6);
  const pts=c.map((x,i)=>`${(i*step).toFixed(1)},${y(x.v).toFixed(1)}`).join(' ');
  const dots=c.map((x,i)=>`<circle cx="${(i*step).toFixed(1)}" cy="${y(x.v).toFixed(1)}" r="${i===c.length-1?3.2:2}" fill="var(--c${x.v})"/>`).join('');
  return `<svg class="spark" viewBox="0 0 ${w} ${hh}" preserveAspectRatio="none"><polyline points="${pts}" fill="none" stroke="var(--rule)" stroke-width="1.5"/>${dots}</svg>`;
}
function condStats(){
  const n=[0,0,0,0,0,0];let rec=0;
  D.staff.forEach(p=>{const v=lastCond(p);if(v){n[v]++;rec++}});
  return {n,rec,total:D.staff.length};
}
function condBar(){
  const s=condStats();if(!s.rec)return '';
  const seg=[1,2,3,4,5].map(v=>s.n[v]?`<div class="cseg c${v}" style="flex:${s.n[v]}" title="${v}：${s.n[v]}名"><span>${s.n[v]}</span></div>`:'').join('');
  const cov=Math.round(s.rec/Math.max(1,s.total)*100);
  const t=today();
  const long=D.staff.filter(p=>!p.lastContact||diffDays(p.lastContact,t)>=90).length;
  const down=D.staff.filter(p=>{const c=p.conditions||[];return c.length>=2&&c[c.length-1].v>c[c.length-2].v}).length;
  return `<div class="condbox">
    <div class="cbar">${seg}</div>
    <div class="clegend"><span><i class="c1"></i>良好</span><span><i class="c3"></i>ふつう</span><span><i class="c5"></i>要注意</span><span class="sp"></span>記録あり ${s.rec}/${s.total}名（${cov}%）</div>
    <div class="cnums">
