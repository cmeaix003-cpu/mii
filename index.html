  <h2>保存先</h2>
  <div class="f"><label>Googleシート接続先（Apps ScriptのウェブアプリURL）</label><input id="s-gas" value="${esc(s.gasUrl)}" placeholder="https://script.google.com/macros/s/…/exec"></div>
  <div class="f"><label>自分のメールアドレス（未返信判定に使います）</label><input id="s-me" value="${esc(s.myEmail)}"></div>
  <div class="toolbar"><button class="btn small" onclick="saveSettings();store.load().then(render)">接続を確認</button><span class="small muted">${s.gasUrl?'接続先あり。空欄にするとこの端末だけに保存します。':'未接続。今はこの端末のブラウザにだけ保存されます。'}</span></div>
  <h2>メールの判定</h2>
  <div class="f"><label>重要送信者（1行に1つ。名前の一部やドメインでも可）</label><textarea id="s-vip">${esc(s.vip.join('\n'))}</textarea></div>
  <div class="f"><label>除外する送信者（1行に1つ）</label><textarea id="s-ex">${esc(s.exclude.join('\n'))}</textarea></div>
  <div class="f"><label>転送の受け皿アドレス（Outlookからここへ転送したものを最優先で拾います）</label><input id="s-fwd" value="${esc(s.forwardTo||'')}" placeholder="例：yourname+mii@gmail.com"></div>
  <div class="f"><label>優先して拾うラベル（Gmailのフィルタで付けたラベル名）</label><input id="s-flabel" value="${esc(s.forwardLabel||'')}" placeholder="例：なんでも///ひとことBOX"></div>
  <p class="small muted">投稿ボックスの通知など、Gmailのフィルタでラベルを付けたメールを最上位で拾います。転送できない場合はこちらをお使いください。</p>
  <div class="f"><label>期限を示す語句（1行に1つ）</label><textarea id="s-dw">${esc(s.deadlineWords.join('\n'))}</textarea></div>
  <div class="f2"><div class="f"><label>メール：過去何日分</label><input id="s-fd" type="number" value="${s.fetchDays}"></div><div class="f"><label>カレンダー：先何日分</label><input id="s-cd2" type="number" value="${s.calDays||30}"></div></div>
  <h2>名前の読み替え</h2>
  ${(()=>{const al=D.settings.nameAliases||{};const ks=Object.keys(al);
    return ks.length?ks.map(k=>`<div class="row"><div class="t"><div class="ttl">${esc(k)} → ${esc(al[k])}</div><div class="sub">勤務表の「${esc(k)}」を、名簿の「${esc(al[k])}」として扱います</div></div><div class="acts"><button class="btn ghost small" onclick="delAlias('${esc(k)}')">解除</button></div></div>`).join('')
      :'<p class="small muted">まだ登録はありません。勤務表の取り込み時に、名簿にない名前が出たら結び付けられます。</p>'})()}
  <h2>面談の会議室依頼メール</h2>
  <div class="f"><label>依頼先アドレス（空欄なら送りません）</label><input id="s-rto" value="${esc(s.roomTo||'')}" placeholder="soumu@example.co.jp"></div>
  <div class="f"><label>CC（任意）</label><input id="s-rcc" value="${esc(s.roomCc||'')}"></div>
  <div class="f"><label>件名のひな形</label><input id="s-rsub" value="${esc(s.roomSubject||'【会議室のお願い】{date} {start}〜{end} 面談')}"></div>
  <div class="f"><label>本文のひな形</label><textarea id="s-rbody" style="min-height:120px">${esc(s.roomBody||'お疲れ様です。\n\n下記のとおり面談を予定しております。会議室のご手配をお願いいたします。\n\n・日時：{date}（{dow}） {start}〜{end}\n・対象：{name} さん\n・場所：{place}\n\nお手数をおかけしますが、よろしくお願いいたします。')}</textarea></div>
  <p class="small muted">使える差し込み：{name} {date} {dow} {start} {end} {place} {kind}</p>
  <h2>他のカレンダーを取り込む</h2>
  <div class="f"><label>公開カレンダーのURL（1行に1つ・Outlook / Office 365 の .ics）</label><textarea id="s-ics" placeholder="https://outlook.office365.com/owa/calendar/.../reachcalendar.ics">${esc((s.icsUrls||[]).join('\n'))}</textarea></div>
  <p class="small muted">Outlookで「カレンダーの公開」を行うとICSのURLが発行されます。ここに貼ると、Googleカレンダーと一緒に取り込みます。</p>
  <h2>人に使う時間</h2>
  <div class="f"><label>週の目標時間（h）　週ごとに上書きできます</label><input id="s-goal" type="number" step="0.5" value="${s.weeklyGoal}"></div>
  <div class="foot" style="justify-content:flex-start"><button class="btn solid" onclick="saveSettings();toast('保存しました')">設定を保存</button></div>
  <h2>データ</h2>
  <div class="toolbar"><button class="btn ghost small" onclick="exportData()">JSONで書き出す</button><button class="btn ghost small" onclick="importData()">JSONを読み込む</button><button class="btn ghost small" onclick="resetData()">すべて消す</button></div>
  <p class="small muted" style="margin-top:20px">予定 ${D.events.length}件／案件 ${D.tasks.length}件／メール ${D.mails.length}件／名簿 ${D.staff.length}名</p>
  </div>`;
}
function saveSettings(){
  const g=i=>document.getElementById(i).value;const lines=i=>g(i).split(/\r?\n/).map(x=>x.trim()).filter(Boolean);
  Object.assign(D.settings,{gasUrl:g('s-gas').trim(),myEmail:g('s-me').trim(),vip:lines('s-vip'),exclude:lines('s-ex'),deadlineWords:lines('s-dw'),icsUrls:lines('s-ics'),forwardTo:g('s-fwd').trim(),forwardLabel:g('s-flabel').trim(),roomTo:g('s-rto').trim(),roomCc:g('s-rcc').trim(),roomSubject:g('s-rsub'),roomBody:g('s-rbody'),fetchDays:Number(g('s-fd'))||2,calDays:Number(g('s-cd2'))||30,weeklyGoal:Number(g('s-goal'))||0});
  store.save();
}
function exportData(){const b=new Blob([JSON.stringify(D,null,1)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='mii-'+today()+'.json';a.click()}
function importData(){const i=document.createElement('input');i.type='file';i.accept='.json';i.onchange=()=>{const f=i.files[0];const r=new FileReader();r.onload=()=>{try{const j=JSON.parse(r.result);D={...D,...j,settings:{...DEFAULT_SETTINGS,...(j.settings||{})}};store.save();render();toast('読み込みました')}catch(e){toast('読み込めませんでした')}};r.readAsText(f)};i.click()}
function resetData(){if(!confirm('すべてのデータを消します。よろしいですか？'))return;if(!confirm('本当に消しますか？この操作は戻せません。'))return;const gas=D.settings.gasUrl;D={events:[],tasks:[],mails:[],staff:[],shifts:{},duty:{},settings:{...DEFAULT_SETTINGS,gasUrl:gas},meta:{updatedAt:0}};store.save();render()}

/* ========== モーダル ========== */
function openModal(html){const m=document.getElementById('modal');m.innerHTML=html;m.scrollTop=0;document.getElementById('modal-bg').classList.add('on');document.getElementById('fab').style.visibility='hidden'}
function closeModal(){document.getElementById('modal-bg').classList.remove('on');document.getElementById('fab').style.visibility=''}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});

/* ========== 起動 ========== */
const miiHdr=document.getElementById('mii-hdr');
miiHdr.onerror=()=>{miiHdr.onerror=null;miiHdr.src='data:image/svg+xml;utf8,'+encodeURIComponent(MII_FALLBACK)};
miiHdr.src='mii.png';
(async()=>{render();await store.load();render();})();
</script>
</body>
</html>
