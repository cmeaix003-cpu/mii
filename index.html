<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light only">
<meta name="supported-color-schemes" content="light">
<meta name="theme-color" content="#D5D2C6">
<title>しツジの「みー」さん</title>
<script src="vendor/xlsx.js"></script>
<script>if(!window.XLSX)document.write('<script src="https:\/\/unpkg.com\/xlsx@0.18.5\/dist\/xlsx.full.min.js"><\/script>');</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:light only;
  forced-color-adjust:none;
  /* 筐体（コンソール本体） */
  --bg:#D5D2C6; --panel:#EDEBE2; --panel2:#E2DFD4; --ink:#22241F; --gray:#6C6E63; --rule:#B4B2A5;
  /* 画面（ゲームボーイの発光する緑） */
  --screen:#DDE6C4; --screen-dark:#33461C; --screen-line:#A9BC7E;
  /* みーが話す窓＝レトロRPGの黒窓 */
  --win:#14150F; --win-line:#F0F0E6;
  /* 人 */
  --person:#4A7A24; --person-tint:#E3EBCE; --person-deep:#2B4A12;
  /* 今日中 */
  --today:#B23A22; --today-tint:#EFD6CF;
  /* コンディション5段階 */
  --c1:#4A7A24; --c2:#7C9E33; --c3:#C4A32A; --c4:#D2762A; --c5:#B23A22;
  --pix:"DotGothic16","Zen Kaku Gothic New",monospace;
  --sans:"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN","Yu Gothic UI","Meiryo",system-ui,sans-serif;
  --nav:66px; --sh:3px 3px 0 rgba(34,36,31,.85);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;color-scheme:light only}
html{background:var(--bg)}
@media (prefers-color-scheme:dark){:root{color-scheme:light only}}
body{font-family:var(--sans);color:var(--ink);background:var(--bg);font-size:15px;line-height:1.7;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,select,textarea{font:inherit;color:inherit;width:100%;border:2px solid var(--ink);background:var(--panel);padding:8px 10px;border-radius:0;outline:none;box-shadow:inset 2px 2px 0 rgba(34,36,31,.12)}
input:focus,select:focus,textarea:focus{background:#fff;box-shadow:inset 2px 2px 0 rgba(61,107,30,.25)}
textarea{resize:vertical;min-height:72px}
a{color:inherit;text-decoration:none}
:focus-visible{outline:3px solid var(--person);outline-offset:2px}
img{image-rendering:pixelated}
/* レトロRPGの二重角丸枠 */
.frame{border:3px solid var(--ink);border-radius:10px;box-shadow:inset 0 0 0 3px var(--panel),inset 0 0 0 5px var(--ink)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* frame */
#app{display:grid;grid-template-rows:auto auto auto}
header{position:relative;z-index:2;display:flex;align-items:center;justify-content:space-between;padding:14px 18px 0;background:var(--bg)}
header .mark{display:flex;align-items:center;gap:8px;font-family:var(--pix);font-size:14px;letter-spacing:.02em}
header .mark img{width:26px;height:26px;object-fit:contain}
header .mark span{color:var(--gray);font-size:11px;margin-left:2px}
header .right{display:flex;gap:10px;align-items:center;font-size:10px;color:var(--gray);font-family:var(--pix);flex:none}
header .mark span{display:none}
@media(min-width:480px){header .mark span{display:inline}}
#savestate{display:inline-flex;align-items:center;gap:6px}
#savestate i{width:8px;height:8px;background:var(--rule);display:inline-block}
#savestate.ok i{background:var(--person)}
#savestate.err i{background:var(--today)}
#savestate.busy i{background:var(--gray)}
main{position:relative;z-index:1;padding:8px 18px calc(var(--nav) + 28px);max-width:720px;width:100%;margin:0 auto}

/* nav：筐体のボタン列 */
nav{position:fixed;z-index:100;isolation:isolate;left:0;right:0;bottom:0;height:var(--nav);background:var(--panel2);border-top:2px solid var(--ink);display:flex;padding:8px;padding-bottom:calc(8px + env(safe-area-inset-bottom));gap:6px}
nav button{flex:1;display:flex;align-items:center;justify-content:center;font-family:var(--pix);font-size:10px;padding:0 2px;color:var(--gray);position:relative;border:2px solid var(--rule);border-radius:8px;background:var(--panel)}
nav button b{display:none}
nav button.on{color:var(--panel);background:var(--ink);border-color:var(--ink)}
nav button .badge{position:absolute;top:-8px;right:-6px;min-width:18px;height:18px;padding:0 4px;background:var(--ink);color:var(--panel);font-size:10px;line-height:18px;text-align:center;border:2px solid var(--panel2);border-radius:9px;font-family:var(--pix)}
nav button .badge.today{background:var(--today)}
@media(min-width:900px){
  #app{grid-template-rows:auto 1fr;grid-template-columns:210px 1fr}
  header{grid-column:1/-1}
  nav{position:sticky;top:0;left:auto;right:auto;bottom:auto;height:auto;border:0;background:transparent;flex-direction:column;align-self:start;padding:24px 0 0 18px;gap:6px}
  nav button{flex:0;justify-content:flex-start;padding:11px 14px;font-size:13px}
  nav button .badge{position:static;margin-left:auto;border:0}
  main{padding:8px 30px 48px}
}

/* type */
h1{font-family:var(--pix);font-weight:400;font-size:20px;margin:18px 0 6px;letter-spacing:.04em}
h2{font-family:var(--pix);font-size:12px;color:var(--gray);margin:24px 0 8px;letter-spacing:.08em}
.date-big{font-family:var(--pix);font-size:46px;line-height:1;margin-top:18px;letter-spacing:.02em}
.date-big small{font-size:13px;margin-left:10px;color:var(--gray)}
.muted{color:var(--gray)}
.small{font-size:12px}
.empty{color:var(--screen-dark);padding:20px;font-size:14px;background:var(--screen);text-align:center;border:3px solid var(--ink);border-radius:10px;box-shadow:inset 0 0 0 3px var(--screen),inset 0 0 0 5px var(--ink)}
.empty b{color:var(--screen-dark)}

/* みーの窓＝ゲームボーイの画面 */
.bubble{display:flex;gap:14px;align-items:flex-start;margin:16px 0 8px;background:var(--win);padding:18px 16px;
  border:3px solid var(--win-line);border-radius:12px;box-shadow:inset 0 0 0 3px var(--win),inset 0 0 0 5px var(--win-line)}
.bubble img{width:56px;height:56px;flex:none;margin-top:2px;transition:none}
.bubble p{font-family:var(--pix);font-size:14px;line-height:2.05;color:var(--win-line);max-width:30em;letter-spacing:.04em}

/* rows */
.row{display:flex;align-items:flex-start;gap:12px;padding:13px;background:var(--panel);margin-bottom:12px;border:3px solid var(--ink);border-radius:10px;box-shadow:inset 0 0 0 3px var(--panel),inset 0 0 0 4px var(--rule)}
.row .t{flex:1;min-width:0}
.row .t .ttl{font-weight:700}
.row .t .sub{font-size:12px;color:var(--gray);margin-top:3px}
.row .time{width:52px;flex:none;font-family:var(--pix);color:var(--gray);font-size:12px;padding-top:3px;line-height:1.5}
.row .acts{display:flex;gap:6px;flex:none}
.row.person{background:var(--person-tint);border-color:var(--person-deep);box-shadow:inset 0 0 0 3px var(--person-tint),inset 0 0 0 4px var(--person)}
.row.person .time,.row.person .sub{color:var(--person-deep)}
.row.stale .ttl::before{content:"STOP";font-family:var(--pix);font-size:9px;background:var(--ink);color:var(--panel);padding:2px 5px;margin-right:7px;vertical-align:2px}
.due-today{color:var(--today);font-weight:700}
.row.due{background:var(--today-tint);border-color:var(--today);box-shadow:inset 0 0 0 3px var(--today-tint),inset 0 0 0 4px var(--today)}

/* buttons：押し込むボタン */
.btn{padding:7px 14px;border:2px solid var(--ink);border-radius:8px;background:var(--panel);font-size:13px;font-weight:700;line-height:1.4;white-space:nowrap;box-shadow:2px 2px 0 var(--ink);transition:none}
.btn:hover{background:var(--ink);color:var(--panel)}
.btn:active{transform:translate(2px,2px);box-shadow:none}
.btn.ghost{border-color:var(--rule);box-shadow:2px 2px 0 var(--rule);color:var(--gray)}
.btn.ghost:hover{background:var(--rule);color:var(--ink)}
.btn.person{border-color:var(--person-deep);color:var(--person-deep);background:var(--person-tint);box-shadow:2px 2px 0 var(--person-deep)}
.btn.person:hover{background:var(--person);color:#fff}
.btn.solid{background:var(--ink);color:var(--panel)}
.btn.small{padding:4px 10px;font-size:12px}
.btn.xs{padding:3px 7px;font-size:12px;min-width:28px;line-height:1.2}
.acts.mini{flex-direction:column;align-items:flex-end;gap:4px}
@media(min-width:420px){.acts.mini{flex-direction:row;align-items:center}}
.exits{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.toolbar{display:flex;gap:8px;align-items:center;margin:6px 0 12px;flex-wrap:wrap}
.toolbar .sp{flex:1}
.seg{display:inline-flex;gap:6px}
.seg{flex-wrap:wrap}
.seg button{padding:5px 12px;font-family:var(--pix);font-size:12px;color:var(--gray);border:2px solid var(--rule);border-radius:8px;background:var(--panel);white-space:nowrap}
.seg button.on{background:var(--ink);color:var(--panel);border-color:var(--ink)}
.fab{position:fixed;z-index:90;right:18px;bottom:calc(var(--nav) + 18px);width:56px;height:56px;background:var(--win);color:var(--win-line);font-family:var(--pix);font-size:26px;line-height:1;display:flex;align-items:center;justify-content:center;border:3px solid var(--win-line);border-radius:12px;box-shadow:0 0 0 3px var(--ink)}
.fab:active{transform:translate(3px,3px);box-shadow:none}
@media(min-width:900px){.fab{bottom:30px;right:30px}}

/* meter：体力ゲージ風 */
.meter{margin:12px 0 4px;background:var(--person-tint);padding:14px;border:3px solid var(--person-deep);border-radius:10px;box-shadow:inset 0 0 0 3px var(--person-tint),inset 0 0 0 5px var(--person-deep)}
.meter .track{height:16px;border:2px solid var(--person-deep);
  background-image:repeating-linear-gradient(90deg,var(--person) 0 6px,var(--person-deep) 6px 8px),linear-gradient(var(--panel),var(--panel));
  background-repeat:no-repeat,no-repeat;
  background-size:var(--p,0%) 100%,100% 100%}
.meter .lbl{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--person-deep);margin-top:9px}
.meter .lbl b{font-family:var(--pix);font-size:16px}

/* calendar */
.cal-head{display:flex;align-items:center;gap:8px;margin:6px 0}
.cal-head h1{margin:0;flex:1;font-size:16px}
.month{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.month .dow{font-family:var(--pix);font-size:11px;color:var(--gray);text-align:center;padding:4px 0}
.month .cell{min-height:52px;background:var(--panel);border:2px solid var(--rule);border-radius:6px;padding:3px 2px;font-size:10px;cursor:pointer;overflow:hidden;display:flex;flex-direction:column;align-items:center}
.month .cell.sel{border-color:var(--ink);box-shadow:0 0 0 2px var(--ink) inset}
.month .cell .d{font-family:var(--pix);font-size:13px;color:var(--gray);line-height:1.2}
.month .cell.sun .d{color:var(--today)}
.month .cell.sat .d{color:#3C6E9E}
.month .wn2{font-family:var(--pix);font-size:8px;color:var(--gray);margin-top:auto}
.month .dots2{display:flex;flex-wrap:wrap;gap:2px;justify-content:center;margin-top:3px;min-height:8px}
.month .dots2 i{display:inline-flex;align-items:center;justify-content:center;min-width:8px;height:8px;border-radius:2px;font-style:normal;font-family:var(--pix);font-size:7px;color:#fff;padding:0 1px}
.month .dots2 .dp{background:var(--person)}
.month .dots2 .dm{background:var(--ink)}
.month .dots2 .dw2{background:var(--rule)}
.month .dots2 .dt{background:var(--today)}
.mpick{margin-top:14px}
.mpickhd{display:flex;align-items:center;gap:8px;margin-bottom:8px;flex-wrap:wrap}
.mpickhd b{font-family:var(--pix);font-size:15px}
.mpickhd .sp{flex:1}
.month .cell.today{background:var(--screen);border-color:var(--ink)}
.month .cell.today .d{color:var(--screen-dark)}
.month .cell.other{background:transparent;border-color:transparent;opacity:.4}
.month .mev{display:block;background:var(--panel2);border-left:3px solid var(--gray);border-radius:3px;padding:1px 3px;margin-bottom:2px;line-height:1.35;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:10px}
.month .mev i{font-family:var(--pix);font-style:normal;font-size:8px;color:var(--gray);margin-right:3px}
.month .mev.cat-会議{border-left-color:var(--ink);background:#E4E4E1}
.month .mev.cat-打合せ{border-left-color:var(--gray)}
.month .mev.cat-人{border-left-color:var(--person);background:var(--person-tint);color:var(--person-deep);font-weight:700}
.month .mev.cat-私用{border-left-color:var(--c2)}
.month .mev.task{border-left-color:var(--today);background:var(--today-tint)}
.month .mev.fin{opacity:.45;text-decoration:line-through}
.month .mmore{font-size:9px;color:var(--gray);padding-left:3px}
.month .mduty{font-size:9px;color:var(--gray);border-top:1px solid var(--rule);margin-top:2px;padding-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* 週＝縦積み */
.wk{display:flex;flex-direction:column;gap:10px}
.wkday{background:var(--panel);border:3px solid var(--rule);border-radius:10px;padding:8px 10px 10px}
.wkday.bare{padding:4px 10px;background:transparent;border-color:var(--rule);opacity:.75}
.wkday.bare .wkhd{border-bottom:0;padding-bottom:0}
.wkday.bare .dn{font-size:17px}
.wkday.today{border-color:var(--ink);background:var(--screen)}
.wkhd{display:flex;align-items:baseline;gap:8px;padding-bottom:6px;border-bottom:2px solid var(--rule)}
.wkday.today .wkhd{border-bottom-color:var(--screen-line)}
.wkhd .dn{font-family:var(--pix);font-size:22px;line-height:1}
.wkhd .dw{font-family:var(--pix);font-size:12px;color:var(--gray)}
.wkday.today .wkhd .dw{color:var(--screen-dark)}
.wkhd .pmark{font-family:var(--pix);font-size:10px;background:var(--person);color:#fff;padding:1px 6px;border-radius:6px}
.wkhd .sp{flex:1}
.wkev{margin-top:8px;display:flex;flex-direction:column;gap:6px}
.wrow{display:flex;align-items:baseline;gap:10px;padding:7px 9px;background:var(--panel2);border:2px solid var(--rule);border-radius:7px;cursor:pointer}
.wkday.today .wrow{background:var(--panel)}
.wrow .wt{font-family:var(--pix);font-size:11px;color:var(--gray);width:44px;flex:none}
.wrow .wn{font-weight:700;font-size:14px;flex:1;min-width:0;word-break:break-all}
.wrow .wc{font-family:var(--pix);font-size:10px;color:var(--gray);flex:none}
.wrow.cat-人{background:var(--person-tint);border-color:var(--person)}
.wrow.cat-人 .wt,.wrow.cat-人 .wc{color:var(--person-deep)}
.wrow.cat-会議{border-color:var(--ink)}
.wnone{font-family:var(--pix);font-size:11px;color:var(--gray);margin-left:4px}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.week .col{background:var(--panel);border:2px solid var(--rule);border-radius:8px;padding:5px 4px 10px;min-height:180px}
.week .col.today{background:var(--screen);border-color:var(--ink)}
.week .col h4{font-family:var(--pix);font-size:11px;color:var(--gray);margin-bottom:6px;text-align:center;line-height:1.3}
.week .col.today h4{color:var(--screen-dark)}
.week .chip{font-size:11px;padding:4px 5px;margin-bottom:4px;background:var(--panel2);border:1px solid var(--rule);line-height:1.35;cursor:pointer;word-break:break-all}
.week .chip.cat-会議{background:var(--ink);color:var(--panel);border-color:var(--ink)}
.week .chip.cat-会議 .tm{color:var(--rule)}
.week .chip.cat-人{background:var(--person);color:#fff;border-color:var(--person-deep)}
.week .chip.cat-人 .tm{color:var(--person-tint)}
.chip .tm{color:var(--gray);display:block;font-family:var(--pix);font-size:10px}

/* 区分の一括変更 */
.bulklist{display:flex;flex-direction:column;gap:6px;margin:10px 0}
.bkrow{display:flex;align-items:center;gap:8px;background:var(--panel2);border:2px solid var(--rule);border-radius:8px;padding:7px 9px}
.bkname{flex:1;min-width:0;font-weight:700;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bkpick{display:flex;gap:3px;flex:none}
.bkbtn{font-family:var(--pix);font-size:10px;padding:5px 7px;border:2px solid var(--rule);border-radius:6px;background:var(--panel);color:var(--gray);white-space:nowrap}
.bkbtn.on{background:var(--ink);color:var(--panel);border-color:var(--ink)}
/* 顔写真 */
.ava{width:26px;height:26px;border-radius:4px;object-fit:cover;flex:none;border:2px solid var(--rule);background:var(--panel2)}
.ava.ph{display:inline-flex;align-items:center;justify-content:center;font-family:var(--pix);font-size:13px;color:var(--gray)}
.ava.big{width:46px;height:46px}
.nmrow{display:flex;align-items:center;gap:7px;margin-top:8px}
.nmrow .nm{margin-top:0;font-weight:700;font-size:15px;word-break:break-all}
.hdrow{display:flex;align-items:center;gap:10px}
/* staff：カートリッジ風カード */
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media(min-width:600px){.grid{grid-template-columns:repeat(4,1fr)}}
.card{padding:11px;position:relative;cursor:pointer;background:var(--panel);border:3px solid var(--ink);border-radius:10px;box-shadow:inset 0 0 0 3px var(--panel),inset 0 0 0 4px var(--rule)}
.card::before{content:"";position:absolute;left:12px;top:-3px;width:32px;height:6px;background:var(--rule);border-radius:0 0 3px 3px;z-index:1}
.card.cond1::before{background:var(--c1)}.card.cond2::before{background:var(--c2)}.card.cond3::before{background:var(--c3)}.card.cond4::before{background:var(--c4)}.card.cond5::before{background:var(--c5)}
.card:active{opacity:.75}
.card .nm{font-weight:700;font-size:15px;margin-top:8px;word-break:break-all}
.card .kd{font-family:var(--pix);font-size:10px;color:var(--gray);border:1px solid var(--rule);padding:0 5px;display:inline-block;margin-top:4px}
.card .dots{display:flex;gap:4px;align-items:flex-end;margin-top:9px;height:14px}
.card .dots i{display:block;background:var(--rule)}
.card .dots i.c1{background:var(--c1)}.card .dots i.c2{background:var(--c2)}.card .dots i.c3{background:var(--c3)}.card .dots i.c4{background:var(--c4)}.card .dots i.c5{background:var(--c5)}
.card .last{font-family:var(--pix);font-size:10px;color:var(--gray);margin-top:7px}
.card .last.over{color:var(--person-deep)}
.card .ren{position:absolute;right:6px;top:6px;font-family:var(--pix);font-size:9px;color:#fff;background:var(--person);padding:1px 5px}
.card.big{background:var(--person-tint);border-color:var(--person-deep);box-shadow:inset 0 0 0 3px var(--person-tint),inset 0 0 0 5px var(--person-deep)}
.card.big .why{font-size:12px;color:var(--person-deep);margin-top:7px;line-height:1.55}
.cond-pick{display:flex;gap:8px;margin:10px 0;align-items:center;flex-wrap:wrap}
.cond-pick button{width:42px;height:42px;background:var(--panel);border:2px solid var(--ink);border-radius:10px;font-family:var(--pix);font-size:15px;box-shadow:2px 2px 0 var(--ink)}
.cond-pick button:active{transform:translate(2px,2px);box-shadow:none}
.cond-pick button.on{color:#fff}
.cond-pick button.c1.on{background:var(--c1)}.cond-pick button.c2.on{background:var(--c2)}.cond-pick button.c3.on{background:var(--c3)}.cond-pick button.c4.on{background:var(--c4)}.cond-pick button.c5.on{background:var(--c5)}

/* 沈黙の分布 */
.silence{display:flex;gap:6px;align-items:flex-end;height:120px}
.sbar{flex:1;display:flex;flex-direction:column;align-items:center;height:100%}
.scol{flex:1;width:100%;display:flex;align-items:flex-end;background:var(--panel2);border:2px solid var(--rule)}
.sfill{width:100%;min-height:3px}
.sfill.c1{background:var(--c1)}.sfill.c2{background:var(--c2)}.sfill.c3{background:var(--c3)}.sfill.c4{background:var(--c4)}.sfill.c5{background:var(--c5)}
.snum{font-family:var(--pix);font-size:14px;margin-top:4px}
.slbl{font-size:9px;color:var(--gray);text-align:center;line-height:1.3}
.tabs.wrap{flex-wrap:wrap}
.tabs.wrap button{flex:0 0 auto;padding:7px 11px}
/* 今週の作戦 */
.plancard{background:var(--person-tint);border:3px solid var(--person-deep);border-radius:10px;box-shadow:inset 0 0 0 3px var(--person-tint),inset 0 0 0 5px var(--person-deep);padding:13px;margin-bottom:12px}
.plancard .ph{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.plancard .pn{font-weight:700;font-size:16px}
.plancard .pwhy{font-size:12px;color:var(--person-deep);margin-top:6px;line-height:1.6}
.plancard .pidea{margin-top:8px;font-size:12px;color:var(--ink);background:var(--panel);border:2px solid var(--person);padding:7px 9px}
.plancard .pidea span{display:block;line-height:1.7}
.plancard .pact{display:flex;align-items:center;gap:8px;margin-top:10px;flex-wrap:wrap}
.plancard .pslot{font-family:var(--pix);font-size:13px;color:var(--person-deep);flex:1;min-width:110px}
/* 分析 */
.biasrow{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.biasrow .bk{width:74px;flex:none;font-size:13px;font-weight:700}
.biasrow .bk span{display:block;font-family:var(--pix);font-size:10px;color:var(--gray);font-weight:400}
.biasrow .bbar{flex:1;height:14px;background:var(--panel2);border:2px solid var(--rule)}
.biasrow .bfill{height:100%;background:var(--person)}
.biasrow .bnum{width:70px;flex:none;text-align:right;font-family:var(--pix);font-size:13px}
.biasrow .bnum span{display:block;font-size:10px;color:var(--gray)}
.cnums i{font-style:normal;font-size:10px;margin-left:3px}
.cnums i.up{color:var(--person)}.cnums i.down{color:var(--today)}
.ideas{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.ideas .btn{text-align:left;font-weight:400}
.ideas .btn.used{opacity:.4}
/* PEOPLEの日付バー・勤務バッジ */
.daybar{display:flex;align-items:center;gap:8px;background:var(--panel);border:3px solid var(--ink);border-radius:10px;box-shadow:inset 0 0 0 3px var(--panel),inset 0 0 0 4px var(--rule);padding:8px 10px;margin:10px 0}
.daybar .dlabel{font-family:var(--pix);font-size:15px;display:flex;align-items:baseline;gap:6px}
.daybar .dlabel span{font-size:10px;background:var(--ink);color:var(--panel);padding:1px 6px;border-radius:5px}
.daybar .sp{flex:1}
.daybar .wcount{font-family:var(--pix);font-size:11px;color:var(--gray)}
.shbadge{font-family:var(--pix);font-size:10px;padding:1px 6px;border-radius:5px;margin-left:5px;vertical-align:1px}
.shbadge.on{background:var(--person);color:#fff}
.shbadge.off{background:var(--rule);color:var(--gray)}
.card.isoff{opacity:.5}
.card.iswork{border-color:var(--person-deep);box-shadow:inset 0 0 0 3px var(--panel),inset 0 0 0 4px var(--person)}
.card.big.iswork{box-shadow:inset 0 0 0 3px var(--person-tint),inset 0 0 0 5px var(--person-deep)}
.slots{display:flex;flex-wrap:wrap;gap:6px}
.slots .btn.on{background:var(--person);color:#fff;border-color:var(--person-deep);box-shadow:2px 2px 0 var(--person-deep)}
/* 取り込みの診断表示 */
.dbg{background:var(--panel2);border:2px solid var(--rule);padding:10px;margin-top:10px;font-size:12px}
.dbgwrap{overflow-x:auto;margin-top:6px}
.dbgt{border-collapse:collapse;font-size:11px;white-space:nowrap}
.dbgt th,.dbgt td{border:1px solid var(--rule);padding:2px 5px;max-width:110px;overflow:hidden;text-overflow:ellipsis}
.dbgt th{background:var(--panel);font-family:var(--pix);font-size:10px;color:var(--gray)}
.dbgt tr:first-child th{position:sticky;top:0}
.colpick{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.colrow{display:flex;align-items:center;gap:8px}
.colrow span{width:88px;flex:none;font-size:12px;color:var(--gray)}
.colrow select{flex:1;padding:5px 8px;font-size:12px}
/* 個人の月間勤務 */
.smon{background:var(--panel);border:2px solid var(--rule);padding:8px}
.smhd{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;margin-bottom:4px}
.smhd span{font-family:var(--pix);font-size:10px;color:var(--gray);text-align:center}
.smgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.sc{aspect-ratio:1/1;display:flex;flex-direction:column;align-items:center;justify-content:center;border:1px solid var(--rule);background:var(--panel2);position:relative}
.sc.other{border:0;background:transparent}
.sc .sd{font-family:var(--pix);font-size:9px;color:var(--gray);line-height:1}
.sc .sv{font-size:11px;font-weight:700;line-height:1.2;margin-top:1px}
.sc .st{font-family:var(--pix);font-size:8px;color:var(--gray);line-height:1}
.sc.on{background:var(--person-tint);border-color:var(--person);cursor:pointer}
.sc.on .sv{color:var(--person-deep)}
.sc.off{background:var(--panel2);opacity:.55}
.sc.off .sv{color:var(--gray);font-weight:400}
.sc.past{opacity:.45}
.sc.today{outline:2px solid var(--ink);outline-offset:-2px}
.sc .sm{position:absolute;top:2px;right:2px;width:6px;height:6px;background:var(--today)}
.smft{font-family:var(--pix);font-size:11px;color:var(--gray);margin-top:8px;line-height:1.6}
.smnote{font-size:10px;color:var(--gray);margin-top:4px}
/* 取り消し */
.row.evcancel{opacity:.55;background:repeating-linear-gradient(-45deg,transparent 0 6px,rgba(34,36,31,.05) 6px 8px)}
.row.evcancel .ttl{text-decoration:line-through}
/* 済んだ予定 */
.row.evfin{opacity:.5}
.row.evfin .ttl{text-decoration:line-through;text-decoration-thickness:1px}
.wrow.evfin{opacity:.45}
.wrow.evfin .wn{text-decoration:line-through}
.btn.evdone{border-color:var(--person);color:var(--person-deep);box-shadow:2px 2px 0 var(--person)}
.btn.evdone:hover{background:var(--person);color:#fff}
.row.evfin .btn.evdone{border-color:var(--rule);color:var(--gray);box-shadow:2px 2px 0 var(--rule)}
/* 話したいこと */
.stitem.talk{cursor:default}
.stitem.talk span{display:flex;flex-direction:column;gap:1px;flex:1;min-width:0}
.stitem.talk b{color:var(--ink);text-decoration:none;font-size:13px}
label.stitem.talk{flex-direction:row;align-items:center}
label.stitem.talk input{flex:none;width:18px;height:18px;margin:0 8px 0 0}
.stitem.talk small{font-family:var(--pix);font-size:9px;color:var(--gray)}
.tkedit{width:100%;font-size:13px;padding:6px 8px;border:2px solid var(--ink);border-radius:5px;background:#fff}
.stitem.talk .tx{flex:none;font-weight:400;color:var(--rule);font-size:14px;padding:0 3px;cursor:pointer}
.wt{font-family:var(--pix);font-size:9px;background:var(--ink);color:var(--panel);border-radius:4px;padding:1px 5px;flex:none;margin-left:4px}
/* 引き継ぎの履歴 */
.hand{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.hand span{font-size:11px;background:var(--panel2);border:1px solid var(--rule);border-radius:6px;padding:2px 7px;color:var(--gray)}
.hand span i{font-family:var(--pix);font-style:normal;font-size:9px;margin-left:5px;opacity:.8}
/* 束ねた声 */
.bundle{margin-top:10px;background:var(--person-tint);border:2px solid var(--person);border-radius:8px;padding:8px 10px}
.bhd{display:flex;align-items:center;gap:7px;font-family:var(--pix);font-size:11px;color:var(--person-deep);cursor:pointer;user-select:none}
.bhd b{font-size:14px}
.bhd .fmark{display:inline-flex;align-items:center;justify-content:center;width:16px;height:16px;border:2px solid var(--person);background:#fff;color:var(--person-deep);font-size:10px;line-height:1}
.blist{margin-top:7px;display:flex;flex-direction:column;gap:5px}
.bitem{display:flex;flex-wrap:wrap;gap:6px;align-items:baseline;background:#fff;border:1px solid var(--person);border-radius:6px;padding:6px 8px;font-size:12px;line-height:1.6;cursor:pointer}
.bitem .bfrom{font-weight:700;flex:none}
.bitem .bbody{flex:1;min-width:0;word-break:break-word}
.bitem .bwhen{font-family:var(--pix);font-size:9px;color:var(--gray);flex:none}
.bitem .bx{flex:none;font-weight:400;color:var(--rule);padding:0 3px}
.bitem .bx:hover{color:var(--today)}
/* タグ */
.tagrow{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.tagc{display:inline-flex;align-items:center;gap:4px;font-size:11px;padding:3px 9px;border:2px solid var(--rule);border-radius:12px;background:var(--panel);color:var(--gray)}
.tagc.on{background:var(--ink);color:var(--panel);border-color:var(--ink)}
.tagc.sug{border-style:dashed;border-color:var(--person);color:var(--person-deep)}
.tagc i{font-style:normal;font-family:var(--pix);font-size:9px;background:var(--person);color:#fff;border-radius:50%;width:12px;height:12px;display:inline-flex;align-items:center;justify-content:center}
.tagc b{font-family:var(--pix);font-size:9px;background:var(--today);color:#fff;border-radius:6px;padding:0 4px;margin-left:2px}
.tagc.on b{background:var(--panel);color:var(--ink)}
/* 声のカード */
.notecard{background:var(--panel);border:3px solid var(--ink);border-radius:10px;box-shadow:inset 0 0 0 3px var(--panel),inset 0 0 0 4px var(--rule);padding:12px;margin-bottom:12px}
.notecard.unread{border-color:var(--today);box-shadow:inset 0 0 0 3px var(--panel),inset 0 0 0 4px var(--today)}
.notecard.fin{opacity:.6}
.nhd{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-bottom:7px}
.nhd .nfrom{font-weight:700;font-size:14px}
.nhd .sp{flex:1}
.nhd .nwhen{font-family:var(--pix);font-size:10px;color:var(--gray)}
.nbody{font-size:13px;line-height:1.8;white-space:pre-wrap;word-break:break-word;background:var(--panel2);border:2px solid var(--rule);border-radius:7px;padding:9px 10px}
.nreply{margin-top:8px;font-size:12px;line-height:1.7;background:var(--person-tint);border:2px solid var(--person);border-radius:7px;padding:8px 10px;color:var(--person-deep)}
.nact{display:flex;gap:6px;margin-top:9px;flex-wrap:wrap;align-items:center}
.nact .sp{flex:1}
/* メール本文 */
.mailbody{background:var(--panel2);border:2px solid var(--rule);border-radius:7px;padding:10px 11px;font-size:13px;line-height:1.8;white-space:pre-wrap;word-break:break-word;max-height:40vh;overflow:auto}
/* 目次 */
.row.gitem{cursor:pointer}
.row.gitem:active{transform:translate(1px,1px)}
.garrow{font-family:var(--pix);font-size:18px;color:var(--gray);align-self:center}
/* 面談テーマ */
.thitem{background:var(--panel2);border:2px solid var(--rule);border-radius:7px;overflow:hidden}
.thitem.on{background:var(--person-tint);border-color:var(--person)}
.thhead{display:flex;align-items:center;gap:8px;width:100%;text-align:left;padding:8px 9px;background:transparent}
.thhead i{width:18px;height:18px;flex:none;border:2px solid var(--rule);background:var(--panel);font-style:normal;font-size:12px;line-height:15px;text-align:center;color:var(--person-deep);font-weight:700}
.thitem.on .thhead i{background:var(--person);border-color:var(--person);color:#fff}
.thhead span{flex:1;min-width:0;font-size:13px;font-weight:700;word-break:break-word}
.thitem.on .thhead span{color:var(--gray);text-decoration:line-through}
.thhead b{flex:none;font-weight:400;color:var(--rule);font-size:14px;padding:0 2px}
.thnote{border:0;border-top:2px solid var(--rule);border-radius:0;background:var(--panel);font-size:12px;padding:7px 9px;box-shadow:none}
.thitem.on .thnote{background:#fff}
.thnoteview{border-top:2px solid var(--rule);background:var(--panel);font-size:12px;padding:7px 9px;color:var(--gray)}
.thadd{display:flex;gap:6px;margin-top:8px}
.thadd input{flex:1}
/* 大きな選択肢 */
.pick{display:block;width:100%;text-align:left;background:var(--panel);border:3px solid var(--ink);border-radius:10px;box-shadow:inset 0 0 0 3px var(--panel),inset 0 0 0 4px var(--rule);padding:13px;margin-bottom:10px}
.pick:active{transform:translate(1px,1px)}
.pick .pt{display:block;font-weight:700;font-size:15px}
.pick .pt i{font-style:normal;font-family:var(--pix);font-size:10px;background:var(--person);color:#fff;border-radius:5px;padding:2px 7px;margin-left:8px;vertical-align:2px}
.pick .pd{display:block;font-size:12px;color:var(--gray);margin-top:5px;line-height:1.6}
.pick.rec{background:var(--person-tint);border-color:var(--person-deep);box-shadow:inset 0 0 0 3px var(--person-tint),inset 0 0 0 5px var(--person-deep)}
.pick.rec .pd{color:var(--person-deep)}
/* 出勤者の要約（自分の勤務の枠内・右寄せ） */
.myshift .sp{flex:1}
.wsum2{margin-left:auto;display:flex;align-items:baseline;gap:8px;flex:none;white-space:nowrap}
.wsum2 .wsn{font-size:11px;color:var(--gray)}
.wsum2 .wsn b{font-family:var(--pix);font-size:15px;color:var(--ink);margin-right:1px}
.wsum2 .wso{font-size:11px;color:var(--person-deep);font-weight:700}
.wsum2 .wso b{font-family:var(--pix);font-size:15px;margin-right:1px}
/* 自分の勤務 */
.myshift{display:flex;align-items:center;gap:9px;background:var(--panel);border:3px solid var(--ink);border-radius:10px;box-shadow:inset 0 0 0 3px var(--panel),inset 0 0 0 4px var(--rule);padding:9px 12px;margin:10px 0}
.myshift .ml{font-family:var(--pix);font-size:10px;color:var(--gray);flex:none}
.myshift b{font-size:16px}
.myshift .mt{font-family:var(--pix);font-size:12px;color:var(--gray)}
.myshift .mp2{font-size:11px;color:var(--gray);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.myshift.off{background:var(--panel2);border-color:var(--rule);box-shadow:none}
.myshift.off b{color:var(--gray)}
.wchip.self{border-color:var(--ink);box-shadow:2px 2px 0 var(--ink)}
.mytag{font-family:var(--pix);font-style:normal;font-size:8px;background:var(--ink);color:var(--panel);padding:1px 4px;border-radius:3px;margin-right:5px;vertical-align:1px}
/* 退職 */
.card.gone{opacity:.45}
.card.me{border-color:var(--ink)}
.card.gone .nm{text-decoration:line-through}
/* お任せ */
.dbar{height:6px;background:var(--panel2);border:2px solid var(--rule);margin:6px 0 5px}
.dbar span{display:block;height:100%;background:var(--person)}
.row.person .dbar{background:#fff}
/* リスケ */
.rskind{display:flex;gap:8px}
.rsbtn{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:11px 4px;background:var(--panel);border:2px solid var(--rule);border-radius:8px}
.rsbtn b{font-family:var(--pix);font-size:18px;line-height:1}
.rsbtn span{font-size:11px;color:var(--gray)}
.rsbtn.plus.on{background:var(--person-tint);border-color:var(--person-deep);color:var(--person-deep)}
.rsbtn.plus.on span{color:var(--person-deep)}
.rsbtn.minus.on{background:var(--today-tint);border-color:var(--today);color:var(--today)}
.rsbtn.minus.on span{color:var(--today)}
.rsreason{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.rsreason .btn.on{background:var(--ink);color:var(--panel);border-color:var(--ink)}
/* 手順の開閉バッジ */
.stepbadge{display:inline-flex;align-items:center;gap:3px;user-select:none;font-family:var(--pix);font-size:10px;background:var(--panel2);border:2px solid var(--rule);border-radius:6px;padding:1px 7px;margin-left:7px;color:var(--gray);vertical-align:2px}
.stepbadge.all{background:var(--person-tint);border-color:var(--person);color:var(--person-deep)}
.row.person .stepbadge{background:#fff}
/* 見出しの開閉 */
h2.fold{display:flex;align-items:center;gap:7px;cursor:pointer;user-select:none}
h2.fold .fmark{display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;border:2px solid var(--rule);background:var(--panel);color:var(--gray);font-size:11px;line-height:1;flex:none}
h2.fold.open .fmark{background:var(--ink);border-color:var(--ink);color:var(--panel)}
h2.fold .fnum{background:var(--panel2);border:1px solid var(--rule);padding:0 6px;font-size:11px;color:var(--gray)}
/* 並べ替えモード：案件の枠全体がつまみ */
.row.sorting{cursor:grab;user-select:none;-webkit-user-select:none}
.row.sorting .t,.row.sorting .exits,.row.sorting .steps,.row.sorting .bundle,.row.sorting .stepbadge{pointer-events:none;opacity:.85}
.row.sorting .mvbtns{pointer-events:none}
.grip.big{width:28px;min-width:28px;max-width:28px;height:36px;font-size:18px}
/* ドラッグ */
.grip{display:inline-flex;align-items:center;justify-content:center;width:22px;min-width:22px;max-width:22px;height:22px;flex:0 0 22px;padding:0;color:var(--gray);font-size:16px;cursor:grab;user-select:none;-webkit-user-select:none;touch-action:none;border:1px dashed var(--rule);border-radius:4px}
.grip:active{cursor:grabbing}
.dragging{opacity:.75;box-shadow:0 6px 16px rgba(34,36,31,.35);position:relative;z-index:5;transition:none}
body.nodrag-scroll{overflow:hidden;overscroll-behavior:none}

/* 並べ替え */
.mvbtns{display:flex;align-items:center;margin-right:8px;flex:none}
.mvbtns .grip{width:28px;min-width:28px;max-width:28px;height:36px;font-size:18px}
.row.sorting{border-style:dashed}
.stitem .mv{display:inline-flex;gap:2px;flex:none;font-style:normal}
.stitem .mv u{text-decoration:none;font-size:11px;color:var(--gray);padding:2px 5px;border:1px solid var(--rule);border-radius:4px;background:var(--panel)}
.stitem .mv u:active{background:var(--ink);color:var(--panel)}
/* 案件の手順 */
.steps{margin-top:10px}
.stbar{height:6px;background:var(--panel2);border:2px solid var(--rule);margin-bottom:7px}
.stbar span{display:block;height:100%;background:var(--person);transition:width .2s}
.stlist{display:flex;flex-direction:column;gap:5px}
.stitem{display:flex;align-items:center;gap:8px;width:100%;text-align:left;background:var(--panel2);border:2px solid var(--rule);border-radius:7px;padding:7px 9px}
.stitem i{width:18px;height:18px;flex:none;border:2px solid var(--rule);background:var(--panel);font-style:normal;font-size:12px;line-height:15px;text-align:center;color:var(--person-deep);font-weight:700}
.stitem span{flex:1;min-width:0;font-size:13px;word-break:break-word}
.stitem .grip{margin-right:2px}
.stitem b{flex:none;font-weight:400;color:var(--rule);font-size:14px;padding:0 2px}
.stitem.on{background:var(--person-tint);border-color:var(--person)}
.stitem.on i{background:var(--person);border-color:var(--person);color:#fff}
.stitem.on span{text-decoration:line-through;color:var(--gray)}
/* 選択肢の編集 */
.optlist .row{margin-bottom:8px}
.optlist .sub{word-break:break-all}
/* 自分のコンディション */
.mycond{display:flex;gap:6px}
.mcbtn{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:9px 2px;background:var(--panel);border:2px solid var(--rule);border-radius:8px}
.mcbtn b{font-family:var(--pix);font-size:16px;line-height:1}
.mcbtn span{font-size:10px;color:var(--gray)}
.mcbtn.on{color:#fff;border-color:transparent}
.mcbtn.on span{color:rgba(255,255,255,.85)}
.mcbtn.c1.on{background:var(--c1)}.mcbtn.c2.on{background:var(--c2)}.mcbtn.c3.on{background:var(--c3)}.mcbtn.c4.on{background:var(--c4)}.mcbtn.c5.on{background:var(--c5)}
.mycond.cmp .mcbtn{padding:6px 2px}
.mycond.cmp .mcbtn b{font-size:13px}
.mycond.cmp .mcbtn span{font-size:9px}
.askme{background:var(--panel);border:3px solid var(--ink);border-radius:10px;box-shadow:inset 0 0 0 3px var(--panel),inset 0 0 0 4px var(--rule);padding:11px 12px;margin:12px 0}
.askme>span{display:block;font-size:13px;margin-bottom:8px}
/* 先週との比較 */
.trow{display:flex;align-items:baseline;justify-content:space-between;gap:8px;padding:6px 0;border-bottom:1px solid var(--rule)}
.trow:last-child{border-bottom:0}
.trow .tl{font-size:13px;color:var(--gray)}
.trow .tv{font-family:var(--pix);font-size:12px;color:var(--gray);white-space:nowrap}
.trow .tv b{font-size:15px;color:var(--ink)}
.trow i{font-style:normal;font-size:11px;margin-left:3px}
.trow i.up{color:var(--person)}.trow i.down{color:var(--today)}
/* 気分バー（TODAY） */
.mood{display:flex;align-items:center;gap:11px;background:var(--panel);border:3px solid var(--ink);border-radius:10px;box-shadow:inset 0 0 0 3px var(--panel),inset 0 0 0 4px var(--rule);padding:11px 13px;margin:12px 0;cursor:pointer}
.mood .mgauge{width:52px;height:8px;flex:none;background:var(--panel2);border:2px solid var(--rule);display:block}
.mood .mgauge i{display:block;height:100%}
.mood.calm .mgauge i{background:var(--c1)}
.mood.ok   .mgauge i{background:var(--c2)}
.mood.busy .mgauge i{background:var(--c4)}
.mood.hard .mgauge i{background:var(--c5)}
.mood .mtxt{flex:1;min-width:0}
.mood .mtxt b{display:block;font-size:14px}
.mood .mtxt span{display:block;font-size:11px;color:var(--gray);margin-top:2px}
.mood .marrow{font-family:var(--pix);font-size:18px;color:var(--gray);flex:none}
.mood.busy{background:#FBF1E8}
.mood.hard{background:var(--today-tint);border-color:var(--today)}
.mood.calm{background:var(--person-tint);border-color:var(--person-deep)}
.pnote{font-size:11px;color:var(--gray);margin:-2px 0 9px 40px;line-height:1.5}

.sthd{display:flex;align-items:baseline;justify-content:space-between;font-family:var(--pix);font-size:11px;color:var(--gray);margin-bottom:8px}

.prow{display:flex;align-items:center;gap:8px;margin-bottom:5px}
.prow:last-child{margin-bottom:0}
.plab{width:32px;flex:none;font-family:var(--pix);font-size:11px;color:var(--gray)}
.ptrack{flex:1;height:10px;background:var(--panel2);border:2px solid var(--rule);display:block}
.pfill{display:block;height:100%}

<script>

function frameSvg(txt){
  const rows=txt.split('\n');
  let px='';
  rows.forEach((row,j)=>{
    for(let i=0;i<row.length;i++){
      const c=row[i];
      if(c==='.')continue;
      px+=`<rect x="${i}" y="${j}" width="1" height="1" fill="${MII_PAL[c]||'#888'}"/>`;
    }
  });
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="-1 -1 14 16" shape-rendering="crispEdges">${px}</svg>`;
}
let MII_TIMER=null, MII_STEP=0;
function startMiiAnim(){
  if(MII_TIMER)clearInterval(MII_TIMER);
  MII_TIMER=setInterval(()=>{
    const els=document.querySelectorAll('img.mii-anim');
    if(!els.length)return;
    MII_STEP++;
    els.forEach(el=>{
      const set=MII_FRAMES[el.dataset.state]||MII_FRAMES.idle;
      // 通常はときどきしか動かさない（まばたき）
      let i;
      if(el.dataset.state==='idle'||el.dataset.state==='happy')i=(MII_STEP%8===0)?1:0;
      else i=MII_STEP%set.length;
      if(el.dataset.i!==String(i)){
        el.dataset.i=String(i);
        el.src='data:image/svg+xml;utf8,'+encodeURIComponent(frameSvg(set[i]));
      }
    });
  },420);
}

function miiState(){
  const t=today();
  const due=openTasks().filter(x=>x.due&&x.due<=t).length;
  const reply=D.mails.filter(m=>m.status==='open'&&mailBucket(m)==='reply');
  const stale=openTasks().filter(x=>staleDays(x)>=3).length;
  const people=eventsOn(t).filter(e=>e.cat==='人').length;
  if(stale>=3||reply.some(m=>mailStaleDays(m)>=7))return 'alert';
  if(due>0||reply.length>0||stale>0)return 'busy';
  if(people>0)return 'people';
  return 'happy';
}
const MII_ORDER={alert:['mii-alert.gif','mii-alert.png'],busy:['mii-busy.gif','mii-busy.png'],people:['mii-people.gif','mii-people.png'],happy:['mii-happy.gif','mii-happy.png']};
function miiFall(img){
  const list=JSON.parse(img.dataset.list||'[]');
  if(list.length){img.src=list.shift();img.dataset.list=JSON.stringify(list);return}
  // 画像が無ければ、内蔵のコマ送りで動かす
  img.onerror=null;
  const st=img.dataset.state||'idle';
  const set=MII_FRAMES[st]||MII_FRAMES.idle;
  img.classList.add('mii-anim');
  img.dataset.i='0';
  img.src='data:image/svg+xml;utf8,'+encodeURIComponent(frameSvg(set[0]));
  startMiiAnim();
}
function miiTag(cls){
  const st=miiState();
  const list=[...(MII_ORDER[st]||[]),'mii.gif','mii.png'];
  const first=list.shift();
  const animState=({alert:'alert',busy:'busy',people:'people',happy:'happy'})[st]||'idle';
  return `<img class="${cls||'mii'} mii-${st}" src="${first}" alt="みー" data-state="${animState}" data-list='${JSON.stringify(list)}' onerror="miiFall(this)">`;
}

const uid=()=>Math.random().toString(36).slice(2,10)+Date.now().toString(36);
function today(){const d=new Date();return ymd(d)}
function ymd(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function parse(s){const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)}
function addDays(s,n){const d=parse(s);d.setDate(d.getDate()+n);return ymd(d)}
function addMonths(s,n){const d=parse(s);d.setDate(1);d.setMonth(d.getMonth()+n);return ymd(d)}
function diffDays(a,b){return Math.round((parse(b)-parse(a))/86400000)}
function dow(s){return '日月火水木金土'[parse(s).getDay()]}
function fmtMD(s){const d=parse(s);return (d.getMonth()+1)+'/'+d.getDate()+'（'+dow(s)+'）'}
function weekStart(s){const d=parse(s);const w=(d.getDay()+6)%7;d.setDate(d.getDate()-w);return ymd(d)}
function mins(t){if(!t)return 0;const [h,m]=t.split(':').map(Number);return h*60+m}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('on');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('on'),1800)}

/* ========== 保存（メモリ → ブラウザ → Googleシート） ========== */
const store={
  local:{
    get(){try{const s=localStorage.getItem('mii-data');return s?JSON.parse(s):null}catch(e){return null}},
    set(d){try{localStorage.setItem('mii-data',JSON.stringify(d));return true}catch(e){return false}}
  },
  async load(){
    const l=this.local.get(); if(l) D={...D,...l,settings:{...DEFAULT_SETTINGS,...(l.settings||{})}};
    if(D.settings.gasUrl){
      setSave('busy','読み込み中');
      try{
        let j=null,err=null;
        for(let i=0;i<3&&!j;i++){
          try{
            const ctl=('AbortController' in window)?new AbortController():null;
            const tm=ctl?setTimeout(()=>ctl.abort(),90000):null;
            const r=await fetch(D.settings.gasUrl+'?action=load',{redirect:'follow',signal:ctl?ctl.signal:undefined});
            if(tm)clearTimeout(tm);
            j=await r.json();
          }catch(e){err=e;if(i<2){setSave('busy','読み込み直しています '+(i+2)+'/3');await new Promise(x=>setTimeout(x,1500*(i+1)))}}
        }
        if(!j)throw err||new Error('読み込めませんでした');
        if(j&&j.ok&&j.data&&Object.keys(j.data).length){
          const remote=j.data;
          if(!l||(remote.meta?.updatedAt||0)>=(l.meta?.updatedAt||0)){
            D=adoptRemote(remote,l);this.local.set(D);
            window._baseAt=remote.meta?.updatedAt||0;
            // こちらの印や追加分を混ぜて中身が変わったなら、シートにも書き戻す
            const plain=adoptRemote(remote,{});
            if(l&&JSON.stringify(D)!==JSON.stringify(plain)){window._forceSave=true;this.save({silent:true})}
          }else{
            window._baseAt=remote.meta?.updatedAt||0;
          }
        }
        setSave('ok','シートと同期');
      }catch(e){setSave('err','シート読込失敗');}
    }else{setSave(l?'ok':'','この端末に保存')}
  },
  _t:null,
  save(opt){
    if(opt&&opt.silent)window._silentSave=true;      // 取り込みなど、自分で編集していない保存
    else if(!window._silentSave)window._edited=true; // 画面で何かを編集した
    D.meta.updatedAt=Date.now();
    const okLocal=this.local.set(D);
    if(D.settings.gasUrl){
      setSave('busy','保存中');
      clearTimeout(this._t);
      this._t=setTimeout(()=>this._push(),1800);
    }else setSave(okLocal?'ok':'','この端末に保存');
  },
  async _push(){
    this._t=null;
    {
      {
        try{
          const j=await callGas({action:'save',data:D,baseAt:window._baseAt||0,force:!!window._forceSave},
            {tries:3,timeout:90000,onRetry:(n,t)=>setSave('busy','保存し直しています '+n+'/'+t)});
          window._forceSave=false;
          if(j&&j.conflict){
            // 自分で編集した直後の自動取り込みなら、こちらを優先して保存し直す
            if(window._silentSave&&window._edited&&!window._forceSave){
              window._forceSave=true;window._silentSave=false;
              store.save();return;
            }
            // 自分で編集していなければ、聞かずに新しい方へ合わせる
            if(!window._edited||window._silentSave){
              const remote=j.data;
              if(remote){D=adoptRemote(remote,D);window._baseAt=remote.meta?.updatedAt||0;store.local.set(D);render();
                const plain=adoptRemote(remote,{});
                if(JSON.stringify(D)!==JSON.stringify(plain)){window._forceSave=true;window._silentSave=false;store.save();return}
              }
              window._edited=false;setSave('ok','最新に更新しました');
              return;
            }
            setSave('err','他の端末が先に更新');showConflict(j);
            return;
          }
          if(j&&j.ok){window._baseAt=j.updatedAt||D.meta.updatedAt;window._edited=false;setSave('ok','シートに保存 '+new Date().toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit'}))}
          else throw new Error(j&&j.error||'unknown');
        }catch(e){setSave('err','シート保存失敗');}
      }
    }
  },

  async fetchEvents(silent){
    if(!D.settings.gasUrl){if(!silent)toast('先に設定でシートの接続先を登録してください');return}
    const total=Number(D.settings.calDays)||30;
    const chunk=14;
    const parts=Math.ceil(total/chunk);
    let added=0,upd=0,part=0;
    const seen=new Set();               // 今回の取り込みに含まれていたID
    const rangeFrom=today(), rangeTo=addDays(today(),total);
    try{
      for(let i=0;i<parts;i++){
        part=i+1;
        setSave('busy','カレンダー取り込み '+part+'/'+parts);
        const j=await callGas({action:'fetchEvents',settings:{...D.settings,calFrom:i*chunk,calDays:Math.min(chunk,total-i*chunk),calTotal:total}},
          {onRetry:(n,t)=>setSave('busy','再試行中 '+n+'/'+t)});
        if(!j.ok)throw new Error(j.error||'取り込みに失敗しました');
        D.eventDeleted=D.eventDeleted||[];D.eventSeen=D.eventSeen||[];
        const delIds=D.eventDeleted;
        (j.events||[]).forEach(e=>{
          seen.add(e.gcalId);
          if(delIds.includes(e.gcalId))return;          // 削除済みは戻さない
          const ex=D.events.find(x=>x.gcalId===e.gcalId);
          // 以前取り込んだのに手元に無い → 削除されたものとみなす
          if(!ex&&D.eventSeen.includes(e.gcalId)){delIds.push(e.gcalId);return}
          if(!D.eventSeen.includes(e.gcalId))D.eventSeen.push(e.gcalId);
          if(ex){
            const changed=ex.date!==e.date||ex.start!==e.start||ex.end!==e.end;
            Object.assign(ex,{title:e.title,date:e.date,start:e.start,end:e.end,place:e.place});
            if(ex.cancelled){delete ex.cancelled;delete ex.cancelledAt}   // 復活していれば戻す
            if(changed)ex.moved=(ex.moved||0)+1;
            if(e.desc&&!ex.memo)ex.memo=e.desc;
            if(e.desc&&!evSteps(ex).length){const ck=extractChecks(e.desc);if(ck.length)ex.steps=ck.map(c=>({id:uid(),t:c.t,done:c.done}))}
            upd++;
          }else{
            let type='作業';const ti=e.title||'';
            if(/面談|1on1/.test(ti))type='面談';else if(/定例/.test(ti))type='定例会議';
            else if(/会議|ミーティング|MTG/i.test(ti))type='臨時会議';
            else if(/打合|来社|訪問|商談/.test(ti))type='社外打合せ';
            const ck=extractChecks(e.desc||'');
            D.events.push({id:uid(),gcalId:e.gcalId,type,cat:typeCat(type),title:ti,date:e.date,start:e.start,end:e.end,place:e.place||'',memo:e.desc||'',
              steps:ck.map(c=>({id:uid(),t:c.t,done:c.done}))});added++;
          }
        });
        store.save({silent:true});render();
      }
      // 取り込み範囲内にあるのに、今回の結果に無かった予定 → 取り消し
      let gone=0;
      D.events.forEach(ev=>{
        if(!ev.gcalId||ev.cancelled)return;
        if(ev.date<rangeFrom||ev.date>rangeTo)return;
        if(!seen.has(ev.gcalId)){ev.cancelled=true;ev.cancelledAt=new Date().toISOString();gone++}
      });
      if(gone)store.save({silent:true});
      window._silentSave=false;setSave('ok','取り込み完了');
      if(added||upd||gone||!silent)toast(added+'件を取り込み、'+upd+'件を更新'+(gone?'、'+gone+'件が取り消し':'')+'しました');
    }catch(e){
      setSave('err','カレンダー取り込み失敗');
      if(!silent){if(added||upd)toast(part+'回目で中断（'+added+'件は取り込み済み）：'+e.message);else toast('取り込みに失敗しました：'+e.message)}
    }
  },
  async checkForm(){
    const j=await callGas({action:'checkForm',settings:D.settings},{tries:2});
    return j;
  },
  async fetchForm(silent){
    if(!D.settings.formSheetUrl){if(!silent)toast('設定で回答シートのURLを登録してください');return}
    if(!D.settings.gasUrl){if(!silent)toast('シートの接続先が必要です');return}
    setSave('busy','投稿を取り込み中');
    try{
      const j=await callGas({action:'fetchForm',settings:D.settings},
        {onRetry:(n,t)=>setSave('busy','再試行中 '+n+'/'+t)});
      if(!j.ok)throw new Error(j.error||'取り込みに失敗しました');
      D.notes=D.notes||[];
      let added=0;
      const keyOf=r=>'f:'+(r.at||'')+':'+String(r.items.map(i=>i.a).join('|')).length+':'+String(r.items.map(i=>i.a).join('|')).slice(0,40);
      const del=D.noteDeleted||[];
      (j.rows||[]).forEach(r=>{
        const k2=keyOf(r);
        if(D.notes.some(n=>n.formKey===r.key||n.formKey===k2))return;
        if(del.includes(r.key)||del.includes(k2))return;
        r.key=k2;
        // 「名前」らしい項目は差出人、それ以外は本文に
        let from='',body=[];
        r.items.forEach(it=>{
          if(/名前|氏名|お名前|name/i.test(it.q)&&!from)from=it.a;
          else body.push(r.items.length>2?it.q+'：'+it.a:it.a);
        });
        const p=from?resolveStaff(from):null;
        const nid=uid();
        D.notes.push({id:nid,formKey:r.key,from,staffId:p?p.id:'',body:body.join('\n'),
          via:'投稿ボックス',at:(r.at||new Date().toISOString()),read:false});
        if(p){addTalk(p.id,'投稿の件：'+body.join(' ').slice(0,40),'投稿ボックス')}
        added++;
      });
      store.save({silent:true});render();

function eventsOn(date){return D.events.filter(e=>e.date===date).sort((a,b)=>mins(a.start)-mins(b.start))}
function overlaps(a,b){return a.date===b.date&&mins(a.start)<mins(b.end||b.start)+1&&mins(b.start)<mins(a.end||a.start)+1&&a.id!==b.id}
function durH(e){return Math.max(0,(mins(e.end)-mins(e.start))/60)}
function weekKey(s){return weekStart(s)}
function weekGoal(s){return D.settings.weekGoals[weekKey(s)]??D.settings.weeklyGoal}
function weekPeopleHours(s){const ws=weekStart(s),we=addDays(ws,6);return D.events.filter(e=>e.cat==='人'&&e.date>=ws&&e.date<=we).reduce((a,e)=>a+durH(e),0)}
function openTasks(){return D.tasks.filter(t=>t.status==='open')}

function mailScore(m){
  const s=D.settings;let sc=0;const from=(m.from||'').toLowerCase();
  if(s.vip.some(v=>v&&from.includes(v.toLowerCase())))sc+=30;
  if(m.to==='TO')sc+=15;
  const txt=(m.subject||'')+' '+(m.snippet||'');
  if(s.deadlineWords.some(w=>w&&txt.includes(w)))sc+=20;
  if(m.needsReply)sc+=25;
  if(m.flagged)sc+=40;
  if(m.hasAttach)sc+=5;
  if(m.external)sc+=10;
  if(/no-?reply|noreply|newsletter|magazine|mailmag|info@|news@/.test(from))sc-=30;
  if(s.exclude.some(v=>v&&from.includes(v.toLowerCase())))sc-=50;
  return sc;
}
function mailBucket(m){if(m.needsReply)return 'reply';return mailScore(m)>=50?'read':'other'}
function mailStaleDays(m){return m.lastActivity?Math.floor((Date.now()-new Date(m.lastActivity))/86400000):0}
function staffScore(p){
  let sc=0;const t=today();
  const last=p.lastContact||p.startDate||t;const gap=diffDays(last,t);const target=p.contactDays||KIND_DAYS[p.kind]||90;
  sc+=Math.min(3,gap/target)*40;
  if(p.renewalDate){const r=diffDays(t,p.renewalDate);const lead=renewalLead(p);if(r>=0&&r<=lead)sc+=80+ (lead-r);}
  const c=p.conditions||[];if(c.length>=2&&c[c.length-1].v>c[c.length-2].v)sc+=35;if(c.length&&c[c.length-1].v>=5)sc+=40;
  if(p.startDate&&diffDays(p.startDate,t)<=90)sc+=20;
  if(p.flag)sc+=50;
  if(window._sigMap&&window._sigMap[p.name])sc+=window._sigMap[p.name];
  { const n=(p.talk||[]).filter(x=>!x.done).length; if(n>=5)sc+=30; else if(n>=3)sc+=15; }
  if(p.birthday){const b=p.birthday.slice(5);const tb=t.slice(5);const d=diffDays(t.slice(0,4)+'-'+tb,t.slice(0,4)+'-'+b);if(d>=0&&d<=7)sc+=10}
  return sc;
}
function renewalLead(p){return Math.min(60,(p.cycleMonths||12)*7)}
function staffWhy(p){
  const t=today();const w=[];
  { const n=(p.talk||[]).filter(x=>!x.done).length; if(n>=3)w.push('話したいことが'+n+'件たまっている'); }
  if(p.renewalDate){const r=diffDays(t,p.renewalDate);if(r>=0&&r<=renewalLead(p))w.push('契約更新まで'+r+'日')}
  const gap=diffDays(p.lastContact||p.startDate||t,t);const target=p.contactDays||KIND_DAYS[p.kind]||90;
  if(!p.lastContact)w.push('まだ接触記録がありません');else if(gap>target)w.push('最後に話してから'+gap+'日');
  const c=p.conditions||[];if(c.length>=2&&c[c.length-1].v>c[c.length-2].v)w.push('コンディションが下降');
  if(p.startDate&&diffDays(p.startDate,t)<=90)w.push('就業'+diffDays(p.startDate,t)+'日目');
  if(p.flag)w.push('気になる印あり');
  return w.join('／');
}

/* ========== ざっくりメモの解釈 ========== */
const WD={'日':0,'月':1,'火':2,'水':3,'木':4,'金':5,'土':6};
function nextWeekday(from,w,nextWeek){
  const d=parse(from);let cur=d.getDay();let add=(w-cur+7)%7;
  if(nextWeek){add=add+((w-cur+7)%7===0?7:0);add+=7-((add>=7)?7:0);add=((w-cur+7)%7)+7}
  else if(add===0)add=7;
  return addDays(from,add);
}

/* 「◯◯さん 〜」のような行は、その人と話したいことへ */
function parseTalkLine(s){
  const line=String(s).trim();
  // 名簿の名前で始まる行を探す（「山田 太郎」のように間に空白がある名前にも対応）
  const cands=targetStaff().map(p=>({p,n:p.name,k:normName(p.name)})).sort((a,b)=>b.n.length-a.n.length);
  for(const c of cands){
    const forms=[c.n,c.k,c.n.split(/[\s　]/)[0]];   // フルネーム／空白なし／姓だけ
    for(const f of forms){
      if(!f||f.length<2)continue;
      if(line.startsWith(f)){
        let rest=line.slice(f.length).replace(/^(さん|くん|ちゃん)/,'');
        const m=rest.match(/^[\s　:：、,]+(.+)$/);
        if(!m)continue;
        // 姓だけの一致は、同じ姓が1人のときだけ
        if(f===c.n.split(/[\s　]/)[0]&&f!==c.n&&f!==c.k){
          if(targetStaff().filter(q=>q.name.split(/[\s　]/)[0]===f).length!==1)continue;
        }
        return {kind:'talk',pid:c.p.id,name:c.p.name,title:m[1].trim(),src:s};
      }
    }
  }
  return null;
}

function parseLine(line,baseDate){
  let s=line.trim();if(!s)return null;
  const t=baseDate||today();const tt=today();let date=null,start=null,end=null,place='';
  // 場所 @〜
  s=s.replace(/[@＠]\s*([^\s、,]+)/,(m,p)=>{place=p;return ' '});
  // 日付
  const rep=(re,fn)=>{const m=s.match(re);if(m){date=fn(m);s=s.replace(m[0],' ')}};
  rep(/(\d{1,2})[\/月](\d{1,2})日?/,m=>{const y=parse(tt).getFullYear();const c=y+'-'+String(+m[1]).padStart(2,'0')+'-'+String(+m[2]).padStart(2,'0');return c<tt?(y+1)+c.slice(4):c});
  if(!date)rep(/今日|本日|きょう/,()=>tt);
  if(!date)rep(/明後日|あさって/,()=>addDays(tt,2));
  if(!date)rep(/明日|あした|あす/,()=>addDays(tt,1));
  if(!date)rep(/来週\s*([日月火水木金土])曜?日?/,m=>nextWeekday(tt,WD[m[1]],true));
  if(!date)rep(/今週\s*([日月火水木金土])曜?日?/,m=>{const d=parse(tt);const add=(WD[m[1]]-d.getDay()+7)%7;return addDays(tt,add)});
  if(!date)rep(/([日月火水木金土])曜日?/,m=>nextWeekday(tt,WD[m[1]]));
  // 時刻（範囲対応）
  const tm=s.match(/(午前|午後|朝|夕方|夜)?\s*(\d{1,2})\s*(?:時(?!間)|:|：)\s*(半|\d{1,2})?分?\s*(?:(?:[〜~\-ー–]|から|より)\s*(?:午前|午後)?\s*(\d{1,2})\s*(?:時(?!間)|:|：)\s*(半|\d{1,2})?分?(?:まで)?)?/);
  if(tm){
    let hh=+tm[2];const ap=tm[1];
    if((ap==='午後'||ap==='夕方'||ap==='夜')&&hh<12)hh+=12;
    if(ap==='午前'&&hh===12)hh=0;
    if(!ap&&hh<=7)hh+=12;
    const mm=tm[3]==='半'?30:(+tm[3]||0);
    start=String(hh).padStart(2,'0')+':'+String(mm).padStart(2,'0');
    if(tm[4]){let eh=+tm[4];if(hh>=12&&eh<hh)eh+=12;const em=tm[5]==='半'?30:(+tm[5]||0);end=String(Math.min(23,eh)).padStart(2,'0')+':'+String(em).padStart(2,'0')}
    s=s.replace(tm[0],' ');
  }
  // 所要時間
  const du=s.match(/(\d+(?:\.\d+)?)\s*時間(半)?|(\d+)\s*分/);
  if(du){const add=du[1]?Math.round(parseFloat(du[1])*60)+(du[2]?30:0):+du[3];if(start&&!end){const m0=mins(start)+add;end=String(Math.floor(m0/60)%24).padStart(2,'0')+':'+String(m0%60).padStart(2,'0')}s=s.replace(du[0],' ')}
  let title=s.replace(/\s+/g,' ').trim();
  title=title.replace(/^(から|より|まで|に|で|は|を|の|、|,|・|[〜~\-ー–])+\s*/,'').replace(/\s*(から|より|、|,|・)+$/,'').trim();
  if(!title)return null;
  // 型の推定
  let type='作業';
  if(/面談|1on1|ワンオンワン/.test(title))type='面談';
  else if(/定例/.test(title))type='定例会議';
  else if(/会議|ミーティング|MTG|mtg/.test(title))type='臨時会議';
  else if(/打合|打ち合わ|来社|訪問|商談/.test(title))type='社外打合せ';
  else if(/移動|出発|直行|直帰/.test(title))type='移動';
  return {kind:start?'event':'task',title,date:date||t,start:start||'',end:end||(start?addMin(start,60):''),type,place,use:true};
}
function addMin(t0,n){const m0=mins(t0)+n;return String(Math.floor(m0/60)%24).padStart(2,'0')+':'+String(m0%60).padStart(2,'0')}

  '設備':/椅子|机|壊れ|故障|エアコン|空調|暑|寒|トイレ|休憩室|モニター|パソコン|PC|プリンタ|照明|電気|Wi-?Fi|回線/i,

  '業務量':/多い|回らない|間に合わ|残業|きつい|忙し|人が足りない|人員|負担|手が回/,

  const show=st.n&&isOpen('s-'+t.id,false);
  const badge=(st.n?`<span class="stepbadge ${st.done===st.n?'all':''}">${show?'−':'＋'} ${st.done}/${st.n}</span>`:'')+((t.bundleNoteIds&&t.bundleNoteIds.length)?`<span class="pill" style="margin-left:5px">声 ${t.bundleNoteIds.length}件</span>`:'');
  const over=t.due&&t.due<today();
  const o=delegStats(89).by[t.assignee];
  const hist=handoffs(t);
  const tap=st.n?` onclick="toggleFold('s-${t.id}',false)" style="cursor:pointer"`:'';
  return `<div class="row person ${over?'due':''}"><div class="t"${tap}>
    <div class="ttl">${esc(t.title)}${badge}</div>
    <div class="sub"><b>${esc(t.assignee||'')}</b>さんへ　期限 ${t.due?fmtMD(t.due):'なし'}${over?'　<span class="due-today">超過</span>':''}${o&&o.n>1?`　これまで${o.n}件（完了${o.done}）`:''}</div>
    ${hist.length?`<div class="hand">${hist.map(x=>`<span>${esc(x.from||'自分')} → ${esc(x.to)}<i>${fmtMD(x.at.slice(0,10)).replace(/（.）/,'')}</i></span>`).join('')}</div>`:''}
    ${show?`<div onclick="event.stopPropagation()">${stepsHtml(t)}</div>`:''}
    ${bundledNotesHtml(t)}
    <div class="exits" onclick="event.stopPropagation()">
      <button class="btn small" onclick="taskDone('${t.id}')">戻ってきた・完了</button>
      <button class="btn small person" onclick="openHandoff('${t.id}')">別の人へ</button>
      <button class="btn ghost small" onclick="takeBack('${t.id}')">引き取る</button>
      <button class="btn ghost small" onclick="openStepAdd('${t.id}')">手順を足す</button>
      <button class="btn ghost small" onclick="openTaskModal('${t.id}')">編集</button>
    </div>
  </div></div>`;
}
/* 別の人へ渡し直す（履歴を残す） */
function openHandoff(id){
  const t=D.tasks.find(x=>x.id===id);if(!t)return;
  const act=targetStaff();
  const onShift=act.filter(p=>inRecentShift(p.name)), rest=act.filter(p=>!inRecentShift(p.name));
  const past=[...new Set(delegLog().map(x=>x.to).filter(n=>n&&!resolveStaff(n)))];
  const opt=p=>`<option value="${esc(p.name)}">${esc(p.name)}（${esc(p.kind)}）</option>`;
  openModal(`<h3>別の人へ渡す</h3><div class="hint">${esc(t.title)}<br>いまは <b>${esc(t.assignee||'')}</b> さんがお持ちです。</div>
  <div class="f"><label>誰に</label>
    <select id="ho-sel" onchange="document.getElementById('ho-otherbox').style.display=this.value==='__other'?'':'none'">
      <option value="">選んでください</option>
      ${onShift.length?`<optgroup label="直近の勤務表にいる方">${onShift.map(opt).join('')}</optgroup>`:''}
      ${rest.length?`<optgroup label="その他の在籍者">${rest.map(opt).join('')}</optgroup>`:''}
      ${past.length?`<optgroup label="他部署・社外">${past.map(n=>`<option value="${esc(n)}">${esc(n)}</option>`).join('')}</optgroup>`:''}
      <option value="__other">他部署・社外の方（新しく入力）</option>
    </select></div>
  <div class="f" id="ho-otherbox" style="display:none"><label>お名前・部署</label><input id="ho-other" placeholder="例：技術部 鈴木"></div>
  <div class="f"><label>いつまでに</label><input id="ho-due" type="date" value="${t.due||addDays(today(),7)}"></div>
  <div class="f"><label>ひとこと（任意）</label><input id="ho-note" placeholder="例：前任が体調不良のため"></div>
  <div class="foot"><button class="btn ghost" onclick="closeModal()">やめる</button><button class="btn solid" onclick="doHandoff('${id}')">渡す</button></div>`);
}
function doHandoff(id){
  const t=D.tasks.find(x=>x.id===id);if(!t)return;
  const sel=document.getElementById('ho-sel').value;
  const who=(sel==='__other')?document.getElementById('ho-other').value.trim():sel;
  if(!who){toast('渡す相手を選んでください');return}
  const p=resolveStaff(who);const to=p?p.name:who;
  const prev=t.assignee||'';
  // 前の依頼の記録を閉じる（引き継ぎとして）
  if(t.delegId){const g=delegLog().find(x=>x.id===t.delegId);if(g&&!g.doneAt){g.doneAt=today();g.handedOff=to}}
  t.handoffs=t.handoffs||[];
  t.handoffs.push({from:prev,to,at:new Date().toISOString(),note:document.getElementById('ho-note').value.trim()});
  t.assignee=to;t.due=document.getElementById('ho-due').value||t.due;
  t.delegId=uid();
  delegLog().push({id:t.delegId,taskId:id,at:new Date().toISOString(),to,staffId:p?p.id:'',title:t.title,due:t.due,doneAt:'',handoffFrom:prev});
  t.steps=t.steps||[];
  t.steps.push({id:uid(),t:to+'さんへ引き継ぎ済み（'+prev+'さんから）',done:true});
  closeModal();store.save();render();toast(prev+'さんから'+to+'さんへ渡しました');
}
/* 自分の手元に戻す */
function takeBack(id){
  const t=D.tasks.find(x=>x.id===id);if(!t)return;
  if(!confirm(t.assignee+'さんから引き取って、自分の案件に戻しますか？'))return;
  if(t.delegId){const g=delegLog().find(x=>x.id===t.delegId);if(g&&!g.doneAt){g.doneAt=today();g.takenBack=true}}
  t.handoffs=t.handoffs||[];
  t.handoffs.push({from:t.assignee||'',to:'自分',at:new Date().toISOString()});
  t.status='open';t.assignee='';
  store.save();render();toast('引き取りました');
}

/* 既存の束ねた案件に、声を追加する */
function bundleTasks(){return (D.tasks||[]).filter(t=>t.status!=='done'&&t.bundleNoteIds)}
function openAddToBundle(noteId){
  const n=(D.notes||[]).find(x=>x.id===noteId);if(!n)return;
  const list=bundleTasks();
  if(!list.length){toast('束ねた案件がまだありません。まず「束ねて案件にする」から作ってください');return}
  openModal('<h3>どの案件に足しますか</h3><div class="hint">'+esc((n.body||'').slice(0,80))+'</div>'
   +list.map(t=>'<button class="pick" onclick="addNoteToBundle(\''+noteId+'\',\''+t.id+'\')"><span class="pt">'+esc(t.title)+'</span><span class="pd">'+(t.bundleTag?esc(t.bundleTag)+'　':'')+'束ねた声 '+t.bundleNoteIds.length+'件'+(t.due?'　期限 '+fmtMD(t.due):'')+'</span></button>').join('')
   +'<div class="foot"><button class="btn ghost small" onclick="closeModal()">やめる</button></div>');
}
function addNoteToBundle(noteId,taskId){
  const n=(D.notes||[]).find(x=>x.id===noteId);const t=D.tasks.find(x=>x.id===taskId);
  if(!n||!t)return;
  if(!t.bundleNoteIds.includes(noteId))t.bundleNoteIds.push(noteId);
  n.bundleId=taskId;n.read=true;
  if(t.bundleTag&&!(n.tags||[]).includes(t.bundleTag)){n.tags=n.tags||[];n.tags.push(t.bundleTag)}
  closeModal();store.save();render();toast('「'+t.title+'」に足しました');
}
/* 案件の側から：同じタグの未対応の声をまとめて足す */
function openAddNotesToTask(taskId){
  const t=D.tasks.find(x=>x.id===taskId);if(!t)return;
  const cand=(D.notes||[]).filter(n=>!n.done&&!n.bundleId&&(!t.bundleTag||(n.tags||[]).includes(t.bundleTag)||!(n.tags||[]).length));
  if(!cand.length){toast('足せる声がありません');return}
  openModal('<h3>声を足す</h3><div class="hint">'+esc(t.title)+'<br>チェックした声を、この案件に束ねます。</div>'
   +'<div class="stlist">'+cand.map(n=>'<label class="stitem" style="cursor:pointer"><input type="checkbox" class="an-ck" value="'+n.id+'" '+((t.bundleTag&&(n.tags||[]).includes(t.bundleTag))?'checked':'')+' style="width:auto;margin:0 8px 0 0"><span><b>'+esc(n.from||'匿名')+'</b>　'+esc((n.body||'').slice(0,70))+((n.body||'').length>70?'…':'')+'</span></label>').join('')+'</div>'
   +'<div class="foot"><button class="btn ghost" onclick="closeModal()">やめる</button><button class="btn solid" onclick="doAddNotesToTask(\''+taskId+'\')">足す</button></div>');
}
function doAddNotesToTask(taskId){
  const t=D.tasks.find(x=>x.id===taskId);if(!t)return;
  const ids=[...document.querySelectorAll('.an-ck:checked')].map(e=>e.value);
  if(!ids.length){toast('声を選んでください');return}
  ids.forEach(id=>{
    const n=(D.notes||[]).find(x=>x.id===id);if(!n)return;
    if(!t.bundleNoteIds.includes(id))t.bundleNoteIds.push(id);
    n.bundleId=taskId;n.read=true;
    if(t.bundleTag&&!(n.tags||[]).includes(t.bundleTag)){n.tags=n.tags||[];n.tags.push(t.bundleTag)}
  });
  closeModal();store.save();render();toast(ids.length+'件を足しました');
}
/* 束ねから外す */
function removeFromBundle(noteId,taskId,ev){
  if(ev&&ev.stopPropagation)ev.stopPropagation();
  const n=(D.notes||[]).find(x=>x.id===noteId);const t=D.tasks.find(x=>x.id===taskId);
  if(t)t.bundleNoteIds=(t.bundleNoteIds||[]).filter(x=>x!==noteId);
  if(n)delete n.bundleId;
  store.save();render();toast('外しました');
}

function closeBundle(task){
  if(!task||!task.bundleNoteIds)return;
  (D.notes||[]).forEach(n=>{
    if(task.bundleNoteIds.includes(n.id)&&!n.done){n.done=true;n.doneAt=new Date().toISOString();n.reply=n.reply||('「'+task.title+'」として対応');}
  });
}
function draftReply(task){

    (tag?tag+'について、':'')+(n?n+'件の':'')+'お声をいただきました。ありがとうございました。','',

function saveDraft(taskId){const t=D.tasks.find(x=>x.id===taskId);if(!t)return;t.replyDraft=document.getElementById('dr-t').value;store.save();toast('保存しました')}
function copyDraft(){

function vNoteTrend(){
  const by=tagStats(90);
  const from=addDays(today(),-179),to=addDays(today(),-90);const prev={};
  (D.notes||[]).filter(n=>{const d=(n.at||'').slice(0,10);return d>=from&&d<to}).forEach(n=>((n.tags&&n.tags.length)?n.tags:['（未分類）']).forEach(t=>prev[t]=(prev[t]||0)+1));
  const keys=Object.keys(by).filter(k=>by[k].n).sort((a,b)=>by[b].n-by[a].n);
  let h=`<h2>声の傾向（90日）</h2>`;
  if(!keys.length)return h+`<div class="empty">まだ声がありません。</div>`;
  const max=Math.max(...keys.map(k=>by[k].n));
  h+=`<div class="condbox">`+keys.map(k=>{
    const o=by[k];const p=prev[k]||0;const ar=o.n>p?'<i class="up">▲</i>':o.n<p?'<i class="down">▼</i>':'';
    return `<div class="biasrow" onclick="noteFilter='${esc(k)}';render()" style="cursor:pointer"><div class="bk">${esc(k)}</div>
      <div class="bbar"><div class="bfill" style="width:${Math.round(o.n/max*100)}%;${k==='感謝・良かったこと'?'':'background:var(--gray)'}"></div></div>
      <div class="bnum">${o.n}件${ar}<span>未対応 ${o.open}</span></div></div>`}).join('')+
    `<div class="clegend" style="margin-top:8px"><span>▲▼は前の90日との比較</span></div></div>`;
  const top=keys.find(k=>k!=='感謝・良かったこと'&&k!=='（未分類）'&&by[k].open>=3);
  if(top)h+=`<div class="warn"><b>「${esc(top)}」の声が${by[top].open}件、対応待ちです。</b><br>個別に返すより、まとめて方向を決める方がよいかもしれません。<div style="margin-top:8px"><button class="btn small" onclick="bundleNotes('${esc(top)}')">束ねて案件にする</button></div></div>`;
  if(by['（未分類）']&&by['（未分類）'].n)h+=`<p class="small muted">タグの付いていない声が${by['（未分類）'].n}件あります。上の一覧で付けられます。</p>`;
  return h;
}
let noteFilter='';

function replyNote(id,ev){
  if(ev&&ev.stopPropagation)ev.stopPropagation();
  const n=(D.notes||[]).find(x=>x.id===id);if(!n)return;
  openModal('<h3>この声への対応</h3>'
   +'<div class="hint">'+esc(n.from||'匿名')+(n.via?'　'+esc(n.via):'')+'</div>'
   +'<div class="warn" style="white-space:pre-wrap">'+esc(n.body)+'</div>'
   +'<div class="f"><label>どう対応しましたか</label><textarea id="nr-t" style="min-height:90px" placeholder="例：椅子を交換した／総務に依頼した／次の朝礼で伝える">'+esc(n.reply||'')+'</textarea></div>'
   +'<div class="foot"><button class="btn ghost" onclick="closeModal()">やめる</button>'
   +'<button class="btn" onclick="noteToTask(\''+id+'\')">案件にする</button>'
   +'<button class="btn solid" onclick="doReplyNote(\''+id+'\')">対応済みにする</button></div>');
  setTimeout(()=>{const e=document.getElementById('nr-t');if(e)e.focus()},50);

function doReplyNote(id){
  const n=(D.notes||[]).find(x=>x.id===id);if(!n)return;
  n.reply=document.getElementById('nr-t').value.trim();
  n.done=true;n.doneAt=new Date().toISOString();n.read=true;
  closeModal();store.save();render();toast('対応済みにしました');
}
function noteToTask(id){
  const n=(D.notes||[]).find(x=>x.id===id);if(!n)return;
  const r=document.getElementById('nr-t');
  if(r)n.reply=r.value.trim();
  D.tasks=D.tasks||[];
  D.tasks.push({id:uid(),title:(n.body||'').slice(0,40),due:addDays(today(),7),
    memo:'いただいた声より'+(n.from?'（'+n.from+'さん）':'')+'\n'+(n.body||''),
    source:'manual',status:'open',createdAt:new Date().toISOString(),noteId:id});
  n.read=true;n.tasked=true;
  closeModal();store.save();render();toast('DESKに案件として置きました');
}
function reopenNote(id,ev){
  if(ev&&ev.stopPropagation)ev.stopPropagation();
  const n=(D.notes||[]).find(x=>x.id===id);if(!n)return;
  n.done=false;n.doneAt='';store.save();render();
}
function delNote(id){
  if(!confirm('削除しますか？'))return;
  const n=(D.notes||[]).find(x=>x.id===id);
  if(n&&n.formKey){D.noteDeleted=D.noteDeleted||[];if(!D.noteDeleted.includes(n.formKey))D.noteDeleted.push(n.formKey)}
  D.notes=(D.notes||[]).filter(x=>x.id!==id);closeModal();store.save();render();
}
function notesOf(staffId,name){
  return (D.notes||[]).filter(n=>n.staffId===staffId||(n.from&&normName(n.from)===normName(name))).sort((a,b)=>(b.at||'').localeCompare(a.at||''));
}
function vNotes(){
  if(D.settings.formSheetUrl&&!window._formFetching){
    const last=Number(localStorage.getItem('mii-formfetch')||0);
    if(Date.now()-last>10*60*1000){
      window._formFetching=true;localStorage.setItem('mii-formfetch',String(Date.now()));
      store.fetchForm(true).finally(()=>{window._formFetching=false});
    }
  }
  const all0=inboxNotes();
  const all=noteFilter?all0.filter(n=>noteFilter==='（未分類）'?!(n.tags&&n.tags.length):(n.tags||[]).includes(noteFilter)):all0;
  const open=all.filter(n=>!n.done), done=all.filter(n=>n.done);
  const by=tagStats(0);
  let h=`<h2>いただいた声</h2>`;
  h+=`<div class="tagrow" style="margin-bottom:10px"><button class="tagc ${!noteFilter?'on':''}" onclick="noteFilter='';render()">すべて ${all0.length}</button>${Object.keys(by).filter(k=>by[k].n).map(k=>`<button class="tagc ${noteFilter===k?'on':''}" onclick="noteFilter='${esc(k)}';render()">${esc(k)} ${by[k].n}${by[k].open?`<b>${by[k].open}</b>`:''}</button>`).join('')}</div>`;
  if(noteFilter&&noteFilter!=='（未分類）'&&by[noteFilter]&&by[noteFilter].open>=2){
    h+=`<div class="warn person"><b>「${esc(noteFilter)}」の声が${by[noteFilter].open}件たまっています。</b><div style="margin-top:8px"><button class="btn small" onclick="bundleNotes('${esc(noteFilter)}')">束ねて案件にする</button></div></div>`;
  }
  h+=`<div class="toolbar"><span class="small muted">未対応 ${open.length}件　対応済み ${done.length}件</span><span class="sp"></span>${D.settings.formSheetUrl?`<button class="btn ghost small" onclick="store.fetchForm()">取り込む</button>`:''}<button class="btn small" onclick="openNoteModal()">書き留める</button></div>`;
  if(!all.length)return h+`<div class="empty">まだ何もありません。<br><span class="small">現場で聞いた一言を残しておくと、面談のときに効いてきます。</span></div>`;
  const card=n=>`<div class="notecard ${n.done?'fin':''} ${n.read||n.done?'':'unread'}">
    <div class="nhd"><span class="nfrom">${esc(n.from||'匿名')}</span>
      ${n.read||n.done?'':'<span class="warnpill">未読</span>'}
      ${n.tasked?'<span class="pill">案件化</span>':''}
      <span class="sp"></span>
      <span class="nwhen">${n.at?fmtMD(n.at.slice(0,10)).replace(/（.）/,''):''}${n.via?'　'+esc(n.via):''}</span></div>
    <div class="nbody">${esc(n.body||'')}</div>
    ${tagChips(n,!n.done)}
    ${n.bundleId?`<div class="small" style="margin-top:6px"><button class="btn ghost small" onclick="event.stopPropagation();openTaskModal('${n.bundleId}')">→ 束ねた案件：${esc((D.tasks.find(t=>t.id===n.bundleId)||{}).title||'')}</button></div>`:''}
    ${n.reply?`<div class="nreply"><b>対応</b>　${esc(n.reply)}</div>`:''}
    <div class="nact">
      ${n.done?`<button class="btn ghost small" onclick="reopenNote('${n.id}',event)">未対応に戻す</button>`
              :`<button class="btn small" onclick="replyNote('${n.id}',event)">対応を書く</button>
                ${!n.bundleId&&bundleTasks().length?`<button class="btn ghost small person" onclick="openAddToBundle('${n.id}')">案件に足す</button>`:''}
                <button class="btn ghost small" onclick="noteMarkRead('${n.id}')">${n.read?'既読':'読んだ'}</button>`}
      ${(()=>{const p=n.staffId?D.staff.find(x=>x.id===n.staffId):(n.from?resolveStaff(n.from):null);
        return p?`<button class="btn ghost small person" onclick="openStaffDetail('${p.id}')">${esc(p.name)}</button>`:''})()}
      <span class="sp"></span>
      <button class="btn ghost small" onclick="delNote('${n.id}')">削除</button>
    </div>
  </div>`;
  if(open.length)h+=open.map(card).join('');
  else h+=`<div class="empty">未対応の声はありません。</div>`;
  if(done.length)h+=`<details><summary>対応済み ${done.length}件</summary>${done.map(card).join('')}</details>`;
  if(!noteFilter)h+=vNoteTrend();
  return h;
}
function noteMarkRead(id){
  const n=(D.notes||[]).find(x=>x.id===id);if(!n)return;
  n.read=!n.read;store.save();render();
}

function photoOf(id){return loadPhotos()[id]||''}
/** 画像を96px四方に切り詰めて軽くする */
function fileToAvatar(file,size){
  size=size||96;
  return new Promise((res,rej)=>{
    const rd=new FileReader();
    rd.onload=()=>{
      const img=new Image();
      img.onload=()=>{
        const c=document.createElement('canvas');c.width=size;c.height=size;
        const ctx=c.getContext('2d');
        const m=Math.min(img.width,img.height);
        ctx.drawImage(img,(img.width-m)/2,(img.height-m)/2,m,m,0,0,size,size);
        res(c.toDataURL('image/jpeg',0.78));
      };
      img.onerror=rej;img.src=rd.result;
    };
    rd.onerror=rej;rd.readAsDataURL(file);
  });
}
function pickPhoto(id){
  const i=document.createElement('input');i.type='file';i.accept='image/*';
  i.onchange=async()=>{
    const f=i.files&&i.files[0];if(!f)return;
    try{
      const d=await fileToAvatar(f,96);
      loadPhotos()[id]=d;
      if(savePhotos()){render();closeModal();openStaffDetail(id);toast('写真を登録しました')}
    }catch(e){toast('画像を読み込めませんでした')}
  };
  i.click();
}
function delPhoto(id){
  if(!confirm('この写真を削除しますか？'))return;
  delete loadPhotos()[id];savePhotos();closeModal();openStaffDetail(id);render();
}

const DAY_FACTS={'01-01':'元日','01-07':'七草','02-03':'節分','02-14':'バレンタイン','03-03':'ひなまつり','03-14':'ホワイトデー','04-01':'エイプリルフール','05-05':'こどもの日','06-01':'写真の日','06-10':'時の記念日','07-07':'七夕','08-11':'山の日','09-09':'重陽の節句','09-20':'空の日','10-01':'コーヒーの日','10-31':'ハロウィン','11-01':'紅茶の日','11-03':'文化の日','11-11':'ポッキーの日','11-15':'七五三','12-24':'クリスマスイブ','12-25':'クリスマス','12-31':'大晦日','02-22':'猫の日'};
const DAILY_TIPS=[
 '本日もご無理のないように。','水分補給をお忘れなく。','ひと呼吸おいてから、まいりましょう。',
 '迷ったときは、まず一件片付けてしまうのが早道でございます。','こまめな休息が、集中の元でございます。',
 '本日のご自身にも、おつかれさまを。','小さな確認が、大きな手戻りを防ぎます。',
 '任せられることは、任せてしまいましょう。','急がば回れ。丁寧が近道でございます。',
 '誰かひとりに「ありがとう」を。','背筋をのばして、まいりましょう。','始めよければ半ば成功、と申します。',
 'できなかったことより、できたことを。','よい引き継ぎが、よい明日をつくります。'];
function dailyLine(dateKey,hours){
  const md=dateKey.slice(5);
  const n=Number(dateKey.replace(/-/g,''));
  const tip=DAILY_TIPS[n%DAILY_TIPS.length];
  const fact=DAY_FACTS[md];
  const bd=D.staff.filter(p=>p.birthday&&p.birthday.slice(5)===md);
  const anniv=D.staff.filter(p=>p.startDate&&p.startDate.slice(5)===md&&p.startDate.slice(0,4)!==dateKey.slice(0,4));
  const out=[];
  if(bd.length)out.push('本日は'+bd.map(p=>p.name).join('さん、')+'さんのお誕生日でございます。');
  else if(anniv.length)out.push('本日は'+anniv.map(p=>p.name+'さん（'+(Number(dateKey.slice(0,4))-Number(p.startDate.slice(0,4)))+'年目）').join('、')+'の就業記念日でございます。');
  else if(fact)out.push('本日は'+fact+'でございます。');
  out.push(tip);
  return out.join(' ');
}

function optDurs(){const a=(D.settings.durs||[]).map(Number).filter(n=>n>0);return a.length?a:[30,45,60]}
function optCondLabels(){const a=(D.settings.condLabels||[]).filter(Boolean);return a.length===5?a:['絶好調','良い','ふつう','疲れ気味','限界']}
function condLabel(v){return optCondLabels()[v-1]||String(v)}
function allTypes(){
  const t={...TYPES};
  (D.settings.extraTypes||[]).forEach(x=>{
    const p=String(x).split('/');
    const name=(p[0]||'').trim(); const cat=(p[1]||'作業').trim();
    if(name&&!t[name])t[name]={cat:CATS.includes(cat)?cat:'作業',fields:['place']};
  });
  return t;
}
function typeCat(name){const t=allTypes()[name];return t?t.cat:'作業'}
function typeFields(name){const t=allTypes()[name];return t?t.fields:['place']}
