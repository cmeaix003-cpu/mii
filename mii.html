<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>しツジの「みー」さん</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  /* 筐体（コンソール本体） */
  --bg:#D5D2C6; --panel:#EDEBE2; --panel2:#E2DFD4; --ink:#22241F; --gray:#6C6E63; --rule:#B4B2A5;
  /* 画面（ゲームボーイの発光する緑） */
  --screen:#DDE6C4; --screen-dark:#33461C; --screen-line:#A9BC7E;
  /* みーが話す窓＝レトロRPGの黒窓 */
  --win:#14150F; --win-line:#F0F0E6;
  /* 人 */
  --person:#4A7A24; --person-tint:#E3EBCE; --person-deep:#2B4A12;
  /* 今日中 */
  --today:#B23A22; --today-tint:#EFD6CF;
  /* コンディション5段階 */
  --c1:#4A7A24; --c2:#7C9E33; --c3:#C4A32A; --c4:#D2762A; --c5:#B23A22;
  --pix:"DotGothic16","Zen Kaku Gothic New",monospace;
  --sans:"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN","Yu Gothic UI","Meiryo",system-ui,sans-serif;
  --nav:66px; --sh:3px 3px 0 rgba(34,36,31,.85);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--sans);color:var(--ink);background:var(--bg);font-size:15px;line-height:1.7;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,select,textarea{font:inherit;color:inherit;width:100%;border:2px solid var(--ink);background:var(--panel);padding:8px 10px;border-radius:0;outline:none;box-shadow:inset 2px 2px 0 rgba(34,36,31,.12)}
input:focus,select:focus,textarea:focus{background:#fff;box-shadow:inset 2px 2px 0 rgba(61,107,30,.25)}
textarea{resize:vertical;min-height:72px}
a{color:inherit;text-decoration:none}
:focus-visible{outline:3px solid var(--person);outline-offset:2px}
img{image-rendering:pixelated}
/* レトロRPGの二重角丸枠 */
.frame{border:3px solid var(--ink);border-radius:10px;box-shadow:inset 0 0 0 3px var(--panel),inset 0 0 0 5px var(--ink)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* frame */
#app{display:grid;grid-template-rows:auto 1fr auto;min-height:100vh;min-height:100dvh}
header{display:flex;align-items:center;justify-content:space-between;padding:14px 18px 0}
header .mark{display:flex;align-items:center;gap:8px;font-family:var(--pix);font-size:14px;letter-spacing:.02em}
header .mark img{width:26px;height:26px;object-fit:contain}
header .mark span{color:var(--gray);font-size:11px;margin-left:2px}
header .right{display:flex;gap:10px;align-items:center;font-size:10px;color:var(--gray);font-family:var(--pix);flex:none}
header .mark span{display:none}
@media(min-width:480px){header .mark span{display:inline}}
#savestate{display:inline-flex;align-items:center;gap:6px}
#savestate i{width:8px;height:8px;background:var(--rule);display:inline-block}
#savestate.ok i{background:var(--person)}
#savestate.err i{background:var(--today)}
#savestate.busy i{background:var(--gray)}
main{padding:8px 18px calc(var(--nav) + 28px);max-width:720px;width:100%;margin:0 auto}

/* nav：筐体のボタン列 */
nav{position:fixed;left:0;right:0;bottom:0;height:var(--nav);background:var(--panel2);border-top:2px solid var(--ink);display:flex;padding:8px;padding-bottom:calc(8px + env(safe-area-inset-bottom));gap:6px}
nav button{flex:1;display:flex;align-items:center;justify-content:center;font-family:var(--pix);font-size:11px;color:var(--gray);position:relative;border:2px solid var(--rule);border-radius:8px;background:var(--panel)}
nav button b{display:none}
nav button.on{color:var(--panel);background:var(--ink);border-color:var(--ink)}
nav button .badge{position:absolute;top:-8px;right:-6px;min-width:18px;height:18px;padding:0 4px;background:var(--ink);color:var(--panel);font-size:10px;line-height:18px;text-align:center;border:2px solid var(--panel2);border-radius:9px;font-family:var(--pix)}
nav button .badge.today{background:var(--today)}
@media(min-width:900px){
  #app{grid-template-rows:auto 1fr;grid-template-columns:210px 1fr}
  header{grid-column:1/-1}
  nav{position:sticky;top:0;left:auto;right:auto;bottom:auto;height:auto;border:0;background:transparent;flex-direction:column;align-self:start;padding:24px 0 0 18px;gap:6px}
  nav button{flex:0;justify-content:flex-start;padding:11px 14px;font-size:13px}
  nav button .badge{position:static;margin-left:auto;border:0}
  main{padding:8px 30px 48px}
}

/* type */
h1{font-family:var(--pix);font-weight:400;font-size:20px;margin:18px 0 6px;letter-spacing:.04em}
h2{font-family:var(--pix);font-size:12px;color:var(--gray);margin:24px 0 8px;letter-spacing:.08em}
.date-big{font-family:var(--pix);font-size:46px;line-height:1;margin-top:18px;letter-spacing:.02em}
.date-big small{font-size:13px;margin-left:10px;color:var(--gray)}
.muted{color:var(--gray)}
.small{font-size:12px}
.empty{color:var(--screen-dark);padding:20px;font-size:14px;background:var(--screen);text-align:center;border:3px solid var(--ink);border-radius:10px;box-shadow:inset 0 0 0 3px var(--screen),inset 0 0 0 5px var(--ink)}
.empty b{color:var(--screen-dark)}

/* みーの窓＝ゲームボーイの画面 */
.bubble{display:flex;gap:14px;align-items:flex-start;margin:16px 0 8px;background:var(--win);padding:18px 16px;
  border:3px solid var(--win-line);border-radius:12px;box-shadow:inset 0 0 0 3px var(--win),inset 0 0 0 5px var(--win-line)}
.bubble img{width:56px;height:56px;flex:none;margin-top:2px}
.bubble p{font-family:var(--pix);font-size:14px;line-height:2.05;color:var(--win-line);max-width:30em;letter-spacing:.04em}

/* rows */
.row{display:flex;align-items:flex-start;gap:12px;padding:13px;background:var(--panel);margin-bottom:12px;border:3px solid var(--ink);border-radius:10px;box-shadow:inset 0 0 0 3px var(--panel),inset 0 0 0 4px var(--rule)}
.row .t{flex:1;min-width:0}
.row .t .ttl{font-weight:700}
.row .t .sub{font-size:12px;color:var(--gray);margin-top:3px}
.row .time{width:52px;flex:none;font-family:var(--pix);color:var(--gray);font-size:12px;padding-top:3px;line-height:1.5}
.row .acts{display:flex;gap:6px;flex:none}
.row.person{background:var(--person-tint);border-color:var(--person-deep);box-shadow:inset 0 0 0 3px var(--person-tint),inset 0 0 0 4px var(--person)}
.row.person .time,.row.person .sub{color:var(--person-deep)}
.row.stale .ttl::before{content:"STOP";font-family:var(--pix);font-size:9px;background:var(--ink);color:var(--panel);padding:2px 5px;margin-right:7px;vertical-align:2px}
.due-today{color:var(--today);font-weight:700}
.row.due{background:var(--today-tint);border-color:var(--today);box-shadow:inset 0 0 0 3px var(--today-tint),inset 0 0 0 4px var(--today)}

/* buttons：押し込むボタン */
.btn{padding:7px 14px;border:2px solid var(--ink);border-radius:8px;background:var(--panel);font-size:13px;font-weight:700;line-height:1.4;white-space:nowrap;box-shadow:2px 2px 0 var(--ink);transition:none}
.btn:hover{background:var(--ink);color:var(--panel)}
.btn:active{transform:translate(2px,2px);box-shadow:none}
.btn.ghost{border-color:var(--rule);box-shadow:2px 2px 0 var(--rule);color:var(--gray)}
.btn.ghost:hover{background:var(--rule);color:var(--ink)}
.btn.person{border-color:var(--person-deep);color:var(--person-deep);background:var(--person-tint);box-shadow:2px 2px 0 var(--person-deep)}
.btn.person:hover{background:var(--person);color:#fff}
.btn.solid{background:var(--ink);color:var(--panel)}
.btn.small{padding:4px 10px;font-size:12px}
.exits{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.toolbar{display:flex;gap:8px;align-items:center;margin:6px 0 12px;flex-wrap:wrap}
.toolbar .sp{flex:1}
.seg{display:inline-flex;gap:6px}
.seg{flex-wrap:wrap}
.seg button{padding:5px 12px;font-family:var(--pix);font-size:12px;color:var(--gray);border:2px solid var(--rule);border-radius:8px;background:var(--panel);white-space:nowrap}
.seg button.on{background:var(--ink);color:var(--panel);border-color:var(--ink)}
.fab{position:fixed;right:18px;bottom:calc(var(--nav) + 18px);width:56px;height:56px;background:var(--win);color:var(--win-line);font-family:var(--pix);font-size:26px;line-height:1;display:flex;align-items:center;justify-content:center;border:3px solid var(--win-line);border-radius:12px;box-shadow:0 0 0 3px var(--ink)}
.fab:active{transform:translate(3px,3px);box-shadow:none}
@media(min-width:900px){.fab{bottom:30px;right:30px}}

/* meter：体力ゲージ風 */
.meter{margin:12px 0 4px;background:var(--person-tint);padding:14px;border:3px solid var(--person-deep);border-radius:10px;box-shadow:inset 0 0 0 3px var(--person-tint),inset 0 0 0 5px var(--person-deep)}
.meter .track{height:14px;background:var(--panel);border:2px solid var(--person-deep);position:relative;overflow:hidden}
.meter .fill{position:absolute;left:0;top:0;bottom:0;background:repeating-linear-gradient(90deg,var(--person) 0 6px,var(--person-deep) 6px 8px)}
.meter .lbl{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--person-deep);margin-top:9px}
.meter .lbl b{font-family:var(--pix);font-size:16px}

/* calendar */
.cal-head{display:flex;align-items:center;gap:8px;margin:6px 0}
.cal-head h1{margin:0;flex:1;font-size:16px}
.month{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.month .dow{font-family:var(--pix);font-size:11px;color:var(--gray);text-align:center;padding:4px 0}
.month .cell{min-height:62px;background:var(--panel);border:2px solid var(--rule);border-radius:6px;padding:4px;font-size:11px;cursor:pointer}
.month .cell .d{font-family:var(--pix);color:var(--gray)}
.month .cell.today{background:var(--screen);border-color:var(--ink)}
.month .cell.today .d{color:var(--screen-dark)}
.month .cell.other{background:transparent;border-color:transparent;color:var(--rule)}
.month .cell .ev{display:block;height:5px;margin-top:3px;background:var(--gray)}
.month .cell .ev.cat-会議{background:var(--ink)}
.month .cell .ev.cat-作業,.month .cell .ev.cat-移動{background:var(--rule)}
.month .cell .ev.cat-打合せ{background:var(--gray)}
.month .cell .ev.cat-人{background:var(--person)}
/* 週＝縦積み */
.wk{display:flex;flex-direction:column;gap:10px}
.wkday{background:var(--panel);border:3px solid var(--rule);border-radius:10px;padding:8px 10px 10px}
.wkday.bare{padding:4px 10px;background:transparent;border-color:var(--rule);opacity:.75}
.wkday.bare .wkhd{border-bottom:0;padding-bottom:0}
.wkday.bare .dn{font-size:17px}
.wkday.today{border-color:var(--ink);background:var(--screen)}
.wkhd{display:flex;align-items:baseline;gap:8px;padding-bottom:6px;border-bottom:2px solid var(--rule)}
.wkday.today .wkhd{border-bottom-color:var(--screen-line)}
.wkhd .dn{font-family:var(--pix);font-size:22px;line-height:1}
.wkhd .dw{font-family:var(--pix);font-size:12px;color:var(--gray)}
.wkday.today .wkhd .dw{color:var(--screen-dark)}
.wkhd .pmark{font-family:var(--pix);font-size:10px;background:var(--person);color:#fff;padding:1px 6px;border-radius:6px}
.wkhd .sp{flex:1}
.wkev{margin-top:8px;display:flex;flex-direction:column;gap:6px}
.wrow{display:flex;align-items:baseline;gap:10px;padding:7px 9px;background:var(--panel2);border:2px solid var(--rule);border-radius:7px;cursor:pointer}
.wkday.today .wrow{background:var(--panel)}
.wrow .wt{font-family:var(--pix);font-size:11px;color:var(--gray);width:44px;flex:none}
.wrow .wn{font-weight:700;font-size:14px;flex:1;min-width:0;word-break:break-all}
.wrow .wc{font-family:var(--pix);font-size:10px;color:var(--gray);flex:none}
.wrow.cat-人{background:var(--person-tint);border-color:var(--person)}
.wrow.cat-人 .wt,.wrow.cat-人 .wc{color:var(--person-deep)}
.wrow.cat-会議{border-color:var(--ink)}
.wnone{font-family:var(--pix);font-size:11px;color:var(--gray);margin-left:4px}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.week .col{background:var(--panel);border:2px solid var(--rule);border-radius:8px;padding:5px 4px 10px;min-height:180px}
.week .col.today{background:var(--screen);border-color:var(--ink)}
.week .col h4{font-family:var(--pix);font-size:11px;color:var(--gray);margin-bottom:6px;text-align:center;line-height:1.3}
.week .col.today h4{color:var(--screen-dark)}
.week .chip{font-size:11px;padding:4px 5px;margin-bottom:4px;background:var(--panel2);border:1px solid var(--rule);line-height:1.35;cursor:pointer;word-break:break-all}
.week .chip.cat-会議{background:var(--ink);color:var(--panel);border-color:var(--ink)}
.week .chip.cat-会議 .tm{color:var(--rule)}
.week .chip.cat-人{background:var(--person);color:#fff;border-color:var(--person-deep)}
.week .chip.cat-人 .tm{color:var(--person-tint)}
.chip .tm{color:var(--gray);display:block;font-family:var(--pix);font-size:10px}

/* staff：カートリッジ風カード */
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media(min-width:600px){.grid{grid-template-columns:repeat(4,1fr)}}
.card{padding:11px;position:relative;cursor:pointer;background:var(--panel);border:3px solid var(--ink);border-radius:10px;box-shadow:inset 0 0 0 3px var(--panel),inset 0 0 0 4px var(--rule)}
.card::before{content:"";position:absolute;left:12px;top:-3px;width:32px;height:6px;background:var(--rule);border-radius:0 0 3px 3px;z-index:1}
.card.cond1::before{background:var(--c1)}.card.cond2::before{background:var(--c2)}.card.cond3::before{background:var(--c3)}.card.cond4::before{background:var(--c4)}.card.cond5::before{background:var(--c5)}
.card:active{opacity:.75}
.card .nm{font-weight:700;font-size:15px;margin-top:8px;word-break:break-all}
.card .kd{font-family:var(--pix);font-size:10px;color:var(--gray);border:1px solid var(--rule);padding:0 5px;display:inline-block;margin-top:4px}
.card .dots{display:flex;gap:4px;align-items:flex-end;margin-top:9px;height:14px}
.card .dots i{display:block;background:var(--rule)}
.card .dots i.c1{background:var(--c1)}.card .dots i.c2{background:var(--c2)}.card .dots i.c3{background:var(--c3)}.card .dots i.c4{background:var(--c4)}.card .dots i.c5{background:var(--c5)}
.card .last{font-family:var(--pix);font-size:10px;color:var(--gray);margin-top:7px}
.card .last.over{color:var(--person-deep)}
.card .ren{position:absolute;right:6px;top:6px;font-family:var(--pix);font-size:9px;color:#fff;background:var(--person);padding:1px 5px}
.card.big{background:var(--person-tint);border-color:var(--person-deep);box-shadow:inset 0 0 0 3px var(--person-tint),inset 0 0 0 5px var(--person-deep)}
.card.big .why{font-size:12px;color:var(--person-deep);margin-top:7px;line-height:1.55}
.cond-pick{display:flex;gap:8px;margin:10px 0;align-items:center;flex-wrap:wrap}
.cond-pick button{width:42px;height:42px;background:var(--panel);border:2px solid var(--ink);border-radius:10px;font-family:var(--pix);font-size:15px;box-shadow:2px 2px 0 var(--ink)}
.cond-pick button:active{transform:translate(2px,2px);box-shadow:none}
.cond-pick button.on{color:#fff}
.cond-pick button.c1.on{background:var(--c1)}.cond-pick button.c2.on{background:var(--c2)}.cond-pick button.c3.on{background:var(--c3)}.cond-pick button.c4.on{background:var(--c4)}.cond-pick button.c5.on{background:var(--c5)}

/* mail */
.score{font-family:var(--pix);font-size:11px;color:var(--gray)}
.fwd{font-family:var(--pix);font-size:9px;background:var(--person);color:#fff;padding:2px 6px;border-radius:5px;margin-right:7px;vertical-align:2px}
details{margin-top:16px}
summary{cursor:pointer;padding:11px 13px;color:var(--gray);font-family:var(--pix);font-size:12px;list-style:none;background:var(--panel2);border:2px solid var(--rule);border-radius:8px}
summary::-webkit-details-marker{display:none}
summary::before{content:"▶ "}
details[open] summary::before{content:"▼ "}
details[open] summary{margin-bottom:10px}

/* modal */
.modal-bg{position:fixed;inset:0;background:rgba(34,36,31,.5);display:none;align-items:flex-end;justify-content:center;z-index:50}
.modal-bg.on{display:flex}
.modal{background:var(--panel);width:100%;max-width:560px;max-height:92vh;overflow:auto;padding:22px 18px 28px;border:3px solid var(--ink);border-bottom:0;border-radius:14px 14px 0 0;box-shadow:inset 0 0 0 3px var(--panel),inset 0 0 0 5px var(--ink)}
@media(min-width:900px){.modal-bg{align-items:center}.modal{border-bottom:3px solid var(--ink);border-radius:14px}}
.modal h3{font-family:var(--pix);font-weight:400;font-size:17px;margin-bottom:8px;letter-spacing:.03em}
.modal .hint{font-size:12px;color:var(--gray);margin-bottom:8px;line-height:1.7}
.f{margin:14px 0}
.f label{display:block;font-family:var(--pix);font-size:11px;color:var(--gray);margin-bottom:5px}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.modal .foot{display:flex;gap:8px;justify-content:flex-end;margin-top:22px;flex-wrap:wrap}
.warn{background:var(--panel2);border:2px solid var(--ink);border-radius:8px;padding:10px 12px;font-size:13px;margin:12px 0}
.warn.person{background:var(--person-tint);border-color:var(--person-deep);color:var(--person-deep)}
.pill{display:inline-block;font-family:var(--pix);font-size:10px;border:1px solid var(--rule);padding:1px 6px;color:var(--gray);margin-left:7px;vertical-align:2px}
.tabs{display:flex;gap:6px;margin:6px 0 14px}
.tabs button{flex:1;padding:8px 0;font-family:var(--pix);font-size:12px;color:var(--gray);border:2px solid var(--rule);border-radius:8px;background:var(--panel)}
.tabs button.on{color:var(--panel);background:var(--ink);border-color:var(--ink)}
.tabs button .n{font-size:11px;margin-left:3px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--nav) + 84px);background:var(--win);color:var(--win-line);font-family:var(--pix);padding:11px 20px;font-size:13px;border:3px solid var(--win-line);border-radius:10px;opacity:0;pointer-events:none;transition:opacity .15s;z-index:60;font-weight:700}
.toast.on{opacity:1}
.setting .f{margin:18px 0}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="mark"><img class="mii" id="mii-hdr" alt="">しツジの「みー」さん<span id="hdr-sub"></span></div>
    <div class="right"><span id="savestate"><i></i><span>未保存</span></span><button class="btn ghost small" onclick="go('setting')">設定</button></div>
  </header>
  <nav>
    <button data-v="today" onclick="go('today')"><b>今</b>TODAY</button>
    <button data-v="inbox" onclick="go('inbox')"><b>机</b>DESK<span class="badge" id="bd-inbox"></span></button>
    <button data-v="cal" onclick="go('cal')"><b>予</b>SCHEDULE</button>
    <button data-v="mail" onclick="go('mail')"><b>信</b>MAIL<span class="badge today" id="bd-mail"></span></button>
    <button data-v="people" onclick="go('people')"><b>人</b>PEOPLE</button>
  </nav>
  <main id="main"></main>
</div>
<button class="fab" id="fab" onclick="fabAction()" aria-label="追加">＋</button>
<div class="modal-bg" id="modal-bg" onclick="if(event.target===this)closeModal()"><div class="modal" id="modal"></div></div>
<div class="toast" id="toast"></div>

<script>
/* ========== 基盤 ========== */
const MII_IMG=`<img class="mii" src="mii.png" alt="みー" onerror="this.onerror=null;this.src='data:image/svg+xml;utf8,'+encodeURIComponent(MII_FALLBACK)">`;

const uid=()=>Math.random().toString(36).slice(2,10)+Date.now().toString(36);
function today(){const d=new Date();return ymd(d)}
function ymd(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function parse(s){const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)}
function addDays(s,n){const d=parse(s);d.setDate(d.getDate()+n);return ymd(d)}
function addMonths(s,n){const d=parse(s);d.setDate(1);d.setMonth(d.getMonth()+n);return ymd(d)}
function diffDays(a,b){return Math.round((parse(b)-parse(a))/86400000)}
function dow(s){return '日月火水木金土'[parse(s).getDay()]}
function fmtMD(s){const d=parse(s);return (d.getMonth()+1)+'/'+d.getDate()+'（'+dow(s)+'）'}
function weekStart(s){const d=parse(s);const w=(d.getDay()+6)%7;d.setDate(d.getDate()-w);return ymd(d)}
function mins(t){if(!t)return 0;const [h,m]=t.split(':').map(Number);return h*60+m}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('on');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('on'),1800)}

/* ========== 保存（メモリ → ブラウザ → Googleシート） ========== */
const store={
  local:{
    get(){try{const s=localStorage.getItem('mii-data');return s?JSON.parse(s):null}catch(e){return null}},
    set(d){try{localStorage.setItem('mii-data',JSON.stringify(d));return true}catch(e){return false}}
  },
  async load(){
    const l=this.local.get(); if(l) D={...D,...l,settings:{...DEFAULT_SETTINGS,...(l.settings||{})}};
    if(D.settings.gasUrl){
      setSave('busy','読み込み中');
      try{
        const r=await fetch(D.settings.gasUrl+'?action=load',{redirect:'follow'});
        const j=await r.json();
        if(j&&j.ok&&j.data&&Object.keys(j.data).length){
          const remote=j.data;
          if(!l||(remote.meta?.updatedAt||0)>=(l.meta?.updatedAt||0)){D={...D,...remote,settings:{...D.settings,...(remote.settings||{}),gasUrl:D.settings.gasUrl}};this.local.set(D)}
        }
        setSave('ok','シートと同期');
      }catch(e){setSave('err','シート読込失敗');}
    }else{setSave(l?'ok':'','この端末に保存')}
  },
  _t:null,
  save(){
    D.meta.updatedAt=Date.now();
    const okLocal=this.local.set(D);
    if(D.settings.gasUrl){
      setSave('busy','保存中');
      clearTimeout(this._t);
      this._t=setTimeout(async()=>{
        try{
          const r=await fetch(D.settings.gasUrl,{method:'POST',redirect:'follow',body:JSON.stringify({action:'save',data:D})});
          const j=await r.json();
          if(j&&j.ok)setSave('ok','シートに保存 '+new Date().toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit'}));
          else throw new Error(j&&j.error||'unknown');
        }catch(e){setSave('err','シート保存失敗');}
      },600);
    }else setSave(okLocal?'ok':'','この端末に保存');
  },

  async fetchEvents(){
    if(!D.settings.gasUrl){toast('先に設定でシートの接続先を登録してください');return}
    setSave('busy','カレンダー取り込み中');
    try{
      const r=await fetch(D.settings.gasUrl,{method:'POST',redirect:'follow',body:JSON.stringify({action:'fetchEvents',settings:D.settings})});
      const j=await r.json();
      if(!j.ok)throw new Error(j.error);
      let added=0,upd=0;
      (j.events||[]).forEach(e=>{
        const ex=D.events.find(x=>x.gcalId===e.gcalId);
        if(ex){Object.assign(ex,{title:e.title,date:e.date,start:e.start,end:e.end,place:e.place});upd++}
        else{
          let type='作業';const ti=e.title||'';
          if(/面談|1on1/.test(ti))type='面談';else if(/定例/.test(ti))type='定例会議';
          else if(/会議|ミーティング|MTG/i.test(ti))type='臨時会議';
          else if(/打合|来社|訪問|商談/.test(ti))type='社外打合せ';
          D.events.push({id:uid(),gcalId:e.gcalId,type,cat:TYPES[type].cat,title:ti,date:e.date,start:e.start,end:e.end,place:e.place||'',memo:''});added++;
        }
      });
      store.save();render();toast(added+'件を取り込み、'+upd+'件を更新しました');
    }catch(e){setSave('err','カレンダー取り込み失敗');toast('取り込みに失敗しました：'+e.message)}
  },
  async fetchMails(){
    if(!D.settings.gasUrl){toast('設定でシートの接続先を登録してください');return}
    setSave('busy','メール取り込み中');
    try{
      const r=await fetch(D.settings.gasUrl,{method:'POST',redirect:'follow',body:JSON.stringify({action:'fetchMails',settings:D.settings})});
      const j=await r.json();
      if(!j.ok)throw new Error(j.error);
      let added=0;
      (j.mails||[]).forEach(m=>{
        const ex=D.mails.find(x=>x.threadId===m.threadId);
        if(ex){ if(ex.status==='ignored')return; Object.assign(ex,m,{status:ex.status==='replied'&&m.needsReply?'open':ex.status}); }
        else{D.mails.push({...m,id:uid(),status:'open'});added++}
      });
      store.save(); render(); toast(added?added+'件を取り込みました':'新しいメールはありません');
    }catch(e){setSave('err','取り込み失敗');toast('取り込みに失敗しました：'+e.message)}
  }
};
function setSave(cls,txt){const s=document.getElementById('savestate');s.className=cls;s.querySelector('span').textContent=txt||'未保存'}

/* ========== 計算 ========== */
function eventsOn(date){return D.events.filter(e=>e.date===date).sort((a,b)=>mins(a.start)-mins(b.start))}
function overlaps(a,b){return a.date===b.date&&mins(a.start)<mins(b.end||b.start)+1&&mins(b.start)<mins(a.end||a.start)+1&&a.id!==b.id}
function durH(e){return Math.max(0,(mins(e.end)-mins(e.start))/60)}
function weekKey(s){return weekStart(s)}
function weekGoal(s){return D.settings.weekGoals[weekKey(s)]??D.settings.weeklyGoal}
function weekPeopleHours(s){const ws=weekStart(s),we=addDays(ws,6);return D.events.filter(e=>e.cat==='人'&&e.date>=ws&&e.date<=we).reduce((a,e)=>a+durH(e),0)}
function openTasks(){return D.tasks.filter(t=>t.status==='open')}
function staleDays(t){return diffDays(t.createdAt.slice(0,10),today())}
function mailScore(m){
  const s=D.settings;let sc=0;const from=(m.from||'').toLowerCase();
  if(s.vip.some(v=>v&&from.includes(v.toLowerCase())))sc+=30;
  if(m.to==='TO')sc+=15;
  const txt=(m.subject||'')+' '+(m.snippet||'');
  if(s.deadlineWords.some(w=>w&&txt.includes(w)))sc+=20;
  if(m.needsReply)sc+=25;
  if(m.flagged)sc+=40;
  if(m.hasAttach)sc+=5;
  if(m.external)sc+=10;
  if(/no-?reply|noreply|newsletter|magazine|mailmag|info@|news@/.test(from))sc-=30;
  if(s.exclude.some(v=>v&&from.includes(v.toLowerCase())))sc-=50;
  return sc;
}
function mailBucket(m){if(m.needsReply)return 'reply';return mailScore(m)>=50?'read':'other'}
function mailStaleDays(m){return m.lastActivity?Math.floor((Date.now()-new Date(m.lastActivity))/86400000):0}
function staffScore(p){
  let sc=0;const t=today();
  const last=p.lastContact||p.startDate||t;const gap=diffDays(last,t);const target=p.contactDays||KIND_DAYS[p.kind]||90;
  sc+=Math.min(3,gap/target)*40;
  if(p.renewalDate){const r=diffDays(t,p.renewalDate);const lead=renewalLead(p);if(r>=0&&r<=lead)sc+=80+ (lead-r);}
  const c=p.conditions||[];if(c.length>=2&&c[c.length-1].v>c[c.length-2].v)sc+=35;if(c.length&&c[c.length-1].v>=5)sc+=40;
  if(p.startDate&&diffDays(p.startDate,t)<=90)sc+=20;
  if(p.flag)sc+=50;
  if(p.birthday){const b=p.birthday.slice(5);const tb=t.slice(5);const d=diffDays(t.slice(0,4)+'-'+tb,t.slice(0,4)+'-'+b);if(d>=0&&d<=7)sc+=10}
  return sc;
}
function renewalLead(p){return Math.min(60,(p.cycleMonths||12)*7)}
function staffWhy(p){
  const t=today();const w=[];
  if(p.renewalDate){const r=diffDays(t,p.renewalDate);if(r>=0&&r<=renewalLead(p))w.push('契約更新まで'+r+'日')}
  const gap=diffDays(p.lastContact||p.startDate||t,t);const target=p.contactDays||KIND_DAYS[p.kind]||90;
  if(!p.lastContact)w.push('まだ接触記録がありません');else if(gap>target)w.push('最後に話してから'+gap+'日');
  const c=p.conditions||[];if(c.length>=2&&c[c.length-1].v>c[c.length-2].v)w.push('コンディションが下降');
  if(p.startDate&&diffDays(p.startDate,t)<=90)w.push('就業'+diffDays(p.startDate,t)+'日目');
  if(p.flag)w.push('気になる印あり');
  return w.join('／');
}
function lastCond(p){const c=p.conditions||[];return c.length?c[c.length-1].v:0}


/* ========== ざっくりメモの解釈 ========== */
const WD={'日':0,'月':1,'火':2,'水':3,'木':4,'金':5,'土':6};
function nextWeekday(from,w,nextWeek){
  const d=parse(from);let cur=d.getDay();let add=(w-cur+7)%7;
  if(nextWeek){add=add+((w-cur+7)%7===0?7:0);add+=7-((add>=7)?7:0);add=((w-cur+7)%7)+7}
  else if(add===0)add=7;
  return addDays(from,add);
}
function parseLine(line){
  let s=line.trim();if(!s)return null;
  const t=today();let date=null,start=null,end=null,place='';
  // 場所 @〜
  s=s.replace(/[@＠]\s*([^\s、,]+)/,(m,p)=>{place=p;return ' '});
  // 日付
  const rep=(re,fn)=>{const m=s.match(re);if(m){date=fn(m);s=s.replace(m[0],' ')}};
  rep(/(\d{1,2})[\/月](\d{1,2})日?/,m=>{const y=parse(t).getFullYear();const c=y+'-'+String(+m[1]).padStart(2,'0')+'-'+String(+m[2]).padStart(2,'0');return c<t?(y+1)+c.slice(4):c});
  if(!date)rep(/今日|本日|きょう/,()=>t);
  if(!date)rep(/明後日|あさって/,()=>addDays(t,2));
  if(!date)rep(/明日|あした|あす/,()=>addDays(t,1));
  if(!date)rep(/来週\s*([日月火水木金土])曜?日?/,m=>nextWeekday(t,WD[m[1]],true));
  if(!date)rep(/今週\s*([日月火水木金土])曜?日?/,m=>{const d=parse(t);const add=(WD[m[1]]-d.getDay()+7)%7;return addDays(t,add)});
  if(!date)rep(/([日月火水木金土])曜日?/,m=>nextWeekday(t,WD[m[1]]));
  // 時刻（範囲対応）
  const tm=s.match(/(午前|午後|朝|夕方|夜)?\s*(\d{1,2})\s*(?:時(?!間)|:|：)\s*(半|\d{1,2})?分?\s*(?:(?:[〜~\-ー–]|から|より)\s*(?:午前|午後)?\s*(\d{1,2})\s*(?:時(?!間)|:|：)\s*(半|\d{1,2})?分?(?:まで)?)?/);
  if(tm){
    let hh=+tm[2];const ap=tm[1];
    if((ap==='午後'||ap==='夕方'||ap==='夜')&&hh<12)hh+=12;
    if(ap==='午前'&&hh===12)hh=0;
    if(!ap&&hh<=7)hh+=12;
    const mm=tm[3]==='半'?30:(+tm[3]||0);
    start=String(hh).padStart(2,'0')+':'+String(mm).padStart(2,'0');
    if(tm[4]){let eh=+tm[4];if(hh>=12&&eh<hh)eh+=12;const em=tm[5]==='半'?30:(+tm[5]||0);end=String(Math.min(23,eh)).padStart(2,'0')+':'+String(em).padStart(2,'0')}
    s=s.replace(tm[0],' ');
  }
  // 所要時間
  const du=s.match(/(\d+(?:\.\d+)?)\s*時間(半)?|(\d+)\s*分/);
  if(du){const add=du[1]?Math.round(parseFloat(du[1])*60)+(du[2]?30:0):+du[3];if(start&&!end){const m0=mins(start)+add;end=String(Math.floor(m0/60)%24).padStart(2,'0')+':'+String(m0%60).padStart(2,'0')}s=s.replace(du[0],' ')}
  let title=s.replace(/\s+/g,' ').trim();
  title=title.replace(/^(から|より|まで|に|で|は|を|の|、|,|・|[〜~\-ー–])+\s*/,'').replace(/\s*(から|より|、|,|・)+$/,'').trim();
  if(!title)return null;
  // 型の推定
  let type='作業';
  if(/面談|1on1|ワンオンワン/.test(title))type='面談';
  else if(/定例/.test(title))type='定例会議';
  else if(/会議|ミーティング|MTG|mtg/.test(title))type='臨時会議';
  else if(/打合|打ち合わ|来社|訪問|商談/.test(title))type='社外打合せ';
  else if(/移動|出発|直行|直帰/.test(title))type='移動';
  return {kind:start?'event':'task',title,date:date||t,start:start||'',end:end||(start?addMin(start,60):''),type,place,use:true};
}
function addMin(t0,n){const m0=mins(t0)+n;return String(Math.floor(m0/60)%24).padStart(2,'0')+':'+String(m0%60).padStart(2,'0')}

/* ========== みーの言葉 ========== */
function voice(){
  const h=new Date().getHours();const t=today();
  const ev=eventsOn(t);const people=ev.filter(e=>e.cat==='人');
  const reply=D.mails.filter(m=>m.status==='open'&&mailBucket(m)==='reply');
  const staleMail=reply.filter(m=>mailStaleDays(m)>=3);
  const due=openTasks().filter(x=>x.due&&x.due<=t);
  const stale=openTasks().filter(x=>staleDays(x)>=3);
  const L=[];
  L.push(h<11?'おはようございます。':h<17?'こんにちは。':'お疲れ様でございました。');
  if(people.length)L.push('人に向き合う枠が'+people.length+'件、ご予定は全'+ev.length+'件。');
  else if(ev.length)L.push('本日のご予定は'+ev.length+'件でございます。');
  else L.push('本日、ご予定はございません。');
  const a=[];
  if(reply.length)a.push('要返信'+reply.length+'件'+(staleMail.length?'（'+staleMail.length+'件は3日以上）':''));
  if(due.length)a.push('本日中'+due.length+'件');
  if(stale.length)a.push('机に停滞'+stale.length+'件');
  if(a.length)L.push(a.join('　'));else L.push('急ぎのものはございません。');
  const cand=D.staff.map(p=>({p,sc:staffScore(p)})).filter(x=>x.sc>=40).sort((a,b)=>b.sc-a.sc).slice(0,2);
  if(cand.length)L.push('今週は'+cand.map(x=>x.p.name.split(' ')[0]+'さん').join('と')+'にお声がけを。');
  return L.slice(0,4).join('\n');
}

  else h+=`<div class="empty">${{reply:'返信待ちのメールはありません。',read:'今日読むべきメールはありません。',other:'その他はありません。'}[mailTab]}</div>`;

  return h;
}
function rowMail(m,compact){
  const sd=mailStaleDays(m);const rep=m.needsReply;
  return `<div class="row ${rep?'due':''} ${sd>=3&&rep?'stale':''}"><div class="t"><div class="ttl">${m.flagged?'<span class="fwd">自分で送信</span>':''}${esc(m.subject||'（件名なし）')}</div><div class="sub">${esc(m.from)}${m.to==='CC'?'<span class="pill">CC</span>':''}　${m.date?fmtMD(m.date.slice(0,10)):''}${rep?'　<span class="'+(sd>=3?'due-today':'')+'">'+(sd?sd+'日返信なし':'返信待ち')+'</span>':''}　<span class="score">${mailScore(m)}点</span></div>
  ${m.snippet?`<div class="sub" style="margin-top:4px;color:var(--ink)">${esc(m.snippet.slice(0,120))}</div>`:''}
  ${compact?'':`<div class="exits"><button class="btn small" onclick="mailExit('${m.id}','replied')">返信した</button><button class="btn small" onclick="mailToTask('${m.id}')">タスク化</button><button class="btn ghost small" onclick="mailExit('${m.id}','ignored')">対応不要</button>${m.link?`<a class="btn ghost small" href="${esc(m.link)}" target="_blank" rel="noopener">Gmailで開く</a>`:''}</div>`}
  </div>${compact?`<div class="acts"><button class="btn small" onclick="mailExit('${m.id}','replied')">返信した</button></div>`:''}</div>`;
}
function mailExit(id,st){const m=D.mails.find(x=>x.id===id);m.status=st;store.save();render();toast({replied:'完了',ignored:'以後追いません',tasked:'タスクにしました'}[st])}
function mailToTask(id){const m=D.mails.find(x=>x.id===id);openModal(`<h3>タスク化</h3><div class="hint">${esc(m.subject)}</div><div class="f"><label>やること</label><input id="mt-title" value="${esc('返信：'+(m.subject||''))}"></div><div class="f"><label>期限</label><input id="mt-due" type="date" value="${addDays(today(),1)}"></div><div class="foot"><button class="btn ghost" onclick="closeModal()">やめる</button><button class="btn solid" onclick="doMailTask('${id}')">机に置く</button></div>`)}
function doMailTask(id){const m=D.mails.find(x=>x.id===id);D.tasks.push({id:uid(),title:document.getElementById('mt-title').value,due:document.getElementById('mt-due').value,source:'mail',mailId:id,status:'open',createdAt:new Date().toISOString()});m.status='tasked';closeModal();store.save();render();toast('机に入れました')}

function vPeople(){
  const all=D.staff.map(p=>({p,sc:staffScore(p)}));
  const pick=all.filter(x=>x.sc>=40).sort((a,b)=>b.sc-a.sc).slice(0,5);
  let list=peopleFilter==='全'?all:peopleFilter==='要'?all.filter(x=>x.sc>=40):all.filter(x=>x.p.kind===peopleFilter);

  let h=`<h1>PEOPLE</h1>`;
  if(!D.staff.length)return h+`<div class="empty"><b>まだ名簿がありません。</b><br>エクセルの名簿を貼り付けて一括登録できます。<div style="margin-top:10px"><button class="btn" onclick="openImportModal()">名簿を貼り付ける</button> <button class="btn ghost" onclick="openStaffModal()">1人ずつ登録</button></div></div>`;
  h+=`<h2>今週、お声がけを</h2>`;
  h+=pick.length?`<div class="grid">${pick.map(x=>cardStaff(x.p,true)).join('')}</div>`:`<div class="empty">今週は特に浮上している方はいません。</div>`;
  h+=`<h2>全員</h2><div class="toolbar"><div class="seg">${['全','要',...KINDS].map(k=>`<button class="${peopleFilter===k?'on':''}" onclick="peopleFilter='${k}';render()">${k==='全'?'全員':k==='要'?'要対応':k}</button>`).join('')}</div><span class="sp"></span><button class="btn ghost small" onclick="openImportModal()">名簿を貼り付け</button></div>`;
  h+=`<div class="grid">${list.map(x=>cardStaff(x.p)).join('')}</div>`;

function cardStaff(p,big){
  const c=(p.conditions||[]).slice(-3);const lc=lastCond(p);const t=today();
  const gap=p.lastContact?diffDays(p.lastContact,t):null;const target=p.contactDays||KIND_DAYS[p.kind]||90;
  const r=p.renewalDate?diffDays(t,p.renewalDate):null;const ren=r!==null&&r>=0&&r<=renewalLead(p);
  const dots=[0,1,2].map(i=>{const v=c[i-(3-c.length)];const sz=i===2?14:i===1?10:7;return v?`<i class="c${v.v}" style="width:${sz}px;height:${sz}px"></i>`:`<i style="width:${sz}px;height:${sz}px"></i>`}).join('');
  return `<div class="card cond${lc} ${big?'big':''}" onclick="openStaffDetail('${p.id}')">${ren?`<span class="ren">更新 ${r}日前</span>`:''}<div class="nm">${esc(p.name)}</div><span class="kd">${esc(p.kind)}</span><div class="dots">${dots}</div><div class="last ${gap!==null&&gap>target?'over':''}">${gap===null?'未接触':gap+'日前に接触'}</div>${big?`<div class="why">${esc(staffWhy(p))}</div>`:''}</div>`;
}
function openStaffDetail(id){
  const p=D.staff.find(x=>x.id===id);const t=today();

  <div class="hint">${p.dept?esc(p.dept)+'　':''}就業 ${p.startDate||'未登録'}　${p.renewalDate?'次回更新 '+p.renewalDate+'（'+(p.cycleMonths||'?')+'か月）':''}</div>

  <div class="f"><label>一言メモ・面談内容（任意）</label><textarea id="st-note"></textarea></div>

  ${p.homework?`<div class="warn">前回の宿題：${esc(p.homework)}</div>`:''}
  <div class="foot"><button class="btn ghost" onclick="openStaffModal('${id}')">情報を編集</button><button class="btn ghost" onclick="toggleFlag('${id}')">${p.flag?'気になる印を外す':'気になる印'}</button><button class="btn solid" onclick="logContact('${id}')">記録する</button></div>
  ${hist.length?`<h2>これまで</h2>${hist.map(c=>`<div class="row"><div class="time">${fmtMD(c.d)}</div><div class="t"><div class="ttl">コンディション ${c.v}</div>${c.note?`<div class="sub">${esc(c.note)}</div>`:''}</div></div>`).join('')}`:''}`);

}
function pickCond(v){window._cond=v;document.querySelectorAll('#cp button').forEach(b=>b.classList.toggle('on',b.textContent==String(v)))}
function logContact(id){
  const p=D.staff.find(x=>x.id===id);const note=document.getElementById('st-note').value.trim();const hw=document.getElementById('st-hw').value.trim();

function saveStaff(id){

function delStaff(id){if(!confirm('名簿から削除しますか？'))return;D.staff=D.staff.filter(x=>x.id!==id);closeModal();store.save();render()}
function renewDone(id){const p=D.staff.find(x=>x.id===id);if(!p.renewalDate||!p.cycleMonths){toast('更新日とサイクルを入れてください');return}p.renewalDate=addMonths(p.renewalDate,p.cycleMonths).slice(0,8)+p.renewalDate.slice(8);p.lastContact=today();closeModal();store.save();render();toast('次回更新日を'+p.renewalDate+'にしました')}
function openImportModal(){
  openModal(`<h3>名簿を貼り付け</h3><div class="hint">エクセルで列を「氏名／区分／所属／就業開始日／次回更新日／更新サイクル（月）／誕生日」の順に並べ、範囲をコピーして貼り付けてください。日付は 2026/4/1 のような形で構いません。見出し行があっても大丈夫です。</div>
  <div class="f"><textarea id="im-text" style="min-height:160px" placeholder="山田太郎	派遣	第1現場	2025/4/1	2026/12/31	3	1990/5/10"></textarea></div>
  <div class="foot"><button class="btn ghost" onclick="closeModal()">やめる</button><button class="btn solid" onclick="doImport()">取り込む</button></div>`);
}
function normDate(s){s=(s||'').trim();if(!s)return '';const m=s.match(/(\d{4})[\/\-.年](\d{1,2})[\/\-.月](\d{1,2})/);if(!m)return '';return m[1]+'-'+m[2].padStart(2,'0')+'-'+m[3].padStart(2,'0')}
function doImport(){
  const lines=document.getElementById('im-text').value.split(/\r?\n/).map(l=>l.trim()).filter(Boolean);let n=0,u=0;
  lines.forEach(l=>{const c=l.split(/\t|,/).map(x=>x.trim());if(!c[0]||c[0]==='氏名')return;
    const kind=KINDS.find(k=>(c[1]||'').includes(k))||'派遣';
    const o={name:c[0],kind,dept:c[2]||'',startDate:normDate(c[3]),renewalDate:normDate(c[4]),cycleMonths:Number(c[5])||'',birthday:normDate(c[6])};
    const ex=D.staff.find(p=>p.name===o.name);if(ex){Object.assign(ex,o);u++}else{D.staff.push({id:uid(),conditions:[],...o});n++}});
  closeModal();store.save();render();toast(n+'名を追加、'+u+'名を更新しました');
}

function quickSave(){

}
function exportData(){const b=new Blob([JSON.stringify(D,null,1)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='mii-'+today()+'.json';a.click()}
function importData(){const i=document.createElement('input');i.type='file';i.accept='.json';i.onchange=()=>{const f=i.files[0];const r=new FileReader();r.onload=()=>{try{const j=JSON.parse(r.result);D={...D,...j,settings:{...DEFAULT_SETTINGS,...(j.settings||{})}};store.save();render();toast('読み込みました')}catch(e){toast('読み込めませんでした')}};r.readAsText(f)};i.click()}
function resetData(){if(!confirm('すべてのデータを消します。よろしいですか？'))return;if(!confirm('本当に消しますか？この操作は戻せません。'))return;const gas=D.settings.gasUrl;D={events:[],tasks:[],mails:[],staff:[],settings:{...DEFAULT_SETTINGS,gasUrl:gas},meta:{updatedAt:0}};store.save();render()}

/* ========== モーダル ========== */
function openModal(html){document.getElementById('modal').innerHTML=html;document.getElementById('modal-bg').classList.add('on')}
function closeModal(){document.getElementById('modal-bg').classList.remove('on')}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});

/* ========== 起動 ========== */
const miiHdr=document.getElementById('mii-hdr');
miiHdr.onerror=()=>{miiHdr.onerror=null;miiHdr.src='data:image/svg+xml;utf8,'+encodeURIComponent(MII_FALLBACK)};
miiHdr.src='mii.png';
(async()=>{render();await store.load();render();})();
</script>
